<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prancheta FC! — Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111112'/><text x='50' y='78' font-size='80' font-family='Arial Black' font-weight='900' text-anchor='middle' fill='%23D2FF00'>!</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#111112; --lemon:#D2FF00; --white:#f4f6ee;
    --gray:#8a8d84; --gray2:#5a5d55; --panel:#1a1a1c; --panel2:#222224;
    --line:#2e2f31; --win:#D2FF00; --draw:#9a9d94; --loss:#ff5470;
    --shadow:#000;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--black); color:var(--white)}
  body{font-family:'Space Mono',monospace; font-size:14px; line-height:1.5; min-height:100vh; -webkit-tap-highlight-color:transparent}
  .wrap{max-width:1720px; margin:0 auto; padding:16px 24px 80px}
  .bungee{font-family:'Bungee',cursive; font-weight:400; letter-spacing:.5px; text-transform:uppercase}

  /* ===== HEADER / NAV ARCADE (full-bleed: linha lemon até a borda) ===== */
  header.topnav{
    position:sticky; top:0; z-index:50; background:var(--black);
    border-bottom:3px solid var(--lemon);
    /* estende até as bordas da viewport, saindo do .wrap */
    width:100vw; margin-left:calc(-50vw + 50%); margin-top:-16px; margin-bottom:20px;
    padding:14px max(24px, calc((100vw - 1920px)/2 + 24px));
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .logo{font-family:'Bungee'; font-size:26px; color:var(--white); line-height:1; text-transform:uppercase}
  .logo b{color:var(--lemon)}
  .hud{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .hud .chip{
    font-family:'Space Mono'; font-weight:700; font-size:12px; letter-spacing:1px;
    background:var(--panel); border:2px solid var(--line); border-radius:8px; padding:6px 10px;
    text-transform:uppercase;
  }
  .hud .chip b{color:var(--lemon)}
  .hud .chip.scorecard{background:var(--lemon); color:var(--black); border-color:var(--lemon)}

  /* ===== TABS ===== */
  nav.tabs{display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap}
  nav.tabs button{
    font-family:'Bungee'; font-size:13px; text-transform:uppercase;
    background:var(--panel); color:var(--gray); border:2px solid var(--line);
    border-radius:10px; padding:9px 16px; cursor:pointer;
    box-shadow:3px 3px 0 var(--shadow); transition:transform .04s;
  }
  nav.tabs button.active{background:var(--lemon); color:var(--black); border-color:var(--lemon)}
  nav.tabs button:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--shadow)}

  /* ===== BOTÕES ===== */
  .btn{
    font-family:'Bungee'; font-size:14px; text-transform:uppercase; cursor:pointer;
    background:var(--panel); color:var(--white); border:2px solid var(--white);
    border-radius:10px; padding:11px 20px; box-shadow:4px 4px 0 var(--shadow);
    transition:transform .04s; user-select:none;
  }
  .btn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--shadow)}
  .btn.primary{background:var(--lemon); color:var(--black); border-color:var(--lemon)}
  .btn.danger{border-color:var(--loss); color:var(--loss)}
  .btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none; transform:none}
  .btn.sm{font-size:11px; padding:7px 12px; box-shadow:3px 3px 0 var(--shadow)}
  .btn-row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}

  /* ===== PAINÉIS ===== */
  .panel{background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:18px; box-shadow:5px 5px 0 var(--shadow)}
  .grid-2{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:18px}
  @media(max-width:800px){.grid-2{grid-template-columns:1fr}}
  .ptitle{font-family:'Bungee'; font-size:18px; color:var(--white); margin-bottom:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .ptitle .lbl{font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--black); background:var(--lemon); padding:3px 8px; border-radius:5px}

  /* ===== TABELA ===== */
  table{width:100%; border-collapse:collapse; font-size:13px}
  thead th{font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--gray2); text-align:center; padding:7px 4px; text-transform:uppercase}
  thead th.l{text-align:left}
  tbody td{padding:8px 4px; text-align:center; border-top:1px solid var(--line)}
  tbody td.l{text-align:left}
  tbody tr.me{background:rgba(210,255,0,.08)}
  tbody tr.me td:first-child{box-shadow:inset 4px 0 0 var(--lemon)}
  .pos{color:var(--gray2); font-weight:700}
  .abrev{font-weight:700; color:var(--lemon); font-size:11px; margin-right:6px}
  td.pts{font-family:'Bungee'; font-size:15px; color:var(--white)}
  .zona-g{box-shadow:inset 4px 0 0 var(--lemon) !important}
  .zona-r{box-shadow:inset 4px 0 0 var(--loss) !important}

  /* ===== RESULTADOS ===== */
  .match{display:flex; align-items:center; gap:8px; padding:9px 10px; background:var(--panel2); border-radius:8px; font-size:12px; margin-bottom:6px; border:2px solid transparent}
  .match.me{border-color:var(--lemon)}
  .match .home{flex:1; text-align:right}
  .match .away{flex:1; text-align:left}
  .match .score{font-family:'Bungee'; font-size:15px; min-width:56px; text-align:center; color:var(--lemon)}
  .match .w{color:var(--white); font-weight:700}
  .match .l{color:var(--gray2)}

  /* ===== ELENCO ===== */
  .team-pick{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
  .team-pick button{font-family:'Space Mono'; font-weight:700; font-size:12px; background:var(--panel); color:var(--gray); border:2px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer; box-shadow:2px 2px 0 var(--shadow)}
  .team-pick button.active{background:var(--lemon); color:var(--black); border-color:var(--lemon)}
  .team-pick button:active{transform:translate(2px,2px); box-shadow:none}
  .roster-head,.player{display:grid; grid-template-columns:34px 46px 1fr 54px 110px; align-items:center; gap:10px}
  .roster-head{padding:0 8px 6px; font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--gray2); text-transform:uppercase}
  .player{padding:9px 8px; border-top:1px solid var(--line); font-size:13px}
  .player:hover{background:var(--panel2)}
  .player.escalado{background:rgba(210,255,0,.06)}
  .player.lesionado{opacity:.5}
  .num{font-family:'Space Mono'; font-weight:700; color:var(--gray2); text-align:center; font-size:12px}
  .pos-tag{display:inline-block; font-family:'Space Mono'; font-weight:700; font-size:10px; padding:3px 6px; border-radius:5px; background:var(--line); color:var(--white); text-align:center}
  .pos-GOL{background:#e0a54f; color:#111} .pos-ZAG{background:#4f9be0; color:#111}
  .pos-LAT{background:#4fe0c0; color:#111} .pos-MEI{background:var(--lemon); color:#111}
  .pos-ATA{background:var(--loss); color:#111}
  .nome{color:var(--white); font-weight:700}
  .forca-num{font-family:'Bungee'; font-size:14px; color:var(--lemon); text-align:center}
  .bar{height:8px; border-radius:4px; background:var(--line); overflow:hidden; border:1px solid var(--black)}
  .bar>i{display:block; height:100%}
  .bar-en{background:var(--lemon)} .bar-en.low{background:var(--loss)}
  .barwrap{display:flex; flex-direction:column; gap:3px}
  .barwrap .n{font-family:'Space Mono'; font-weight:700; font-size:10px; color:var(--gray)}

  /* ===== FIELD / ESCALAÇÃO ===== */
  .field-wrap{display:grid; grid-template-columns:1fr 320px; gap:18px}
  @media(max-width:800px){.field-wrap{grid-template-columns:1fr}}
  .pitch{background:linear-gradient(#16301a,#0f240f); border:3px solid var(--line); border-radius:14px; padding:14px; position:relative; min-height:440px; display:flex; flex-direction:column; justify-content:space-between}
  .pitch::before{content:''; position:absolute; left:50%; top:14px; bottom:14px; width:2px; background:rgba(255,255,255,.08)}
  .pitch-line{display:flex; justify-content:space-around; align-items:center; gap:6px}
  .slot{width:66px; text-align:center; cursor:pointer}
  .slot .dot{width:44px; height:44px; margin:0 auto 3px; border-radius:50%; background:var(--panel); border:2px solid var(--lemon); display:flex; align-items:center; justify-content:center; font-family:'Bungee'; font-size:13px; color:var(--lemon); box-shadow:2px 2px 0 var(--shadow)}
  .slot .dot.empty{border-color:var(--gray2); color:var(--gray2); border-style:dashed}
  .slot .dot.foraPos{border-color:var(--loss); color:var(--loss)}
  .slot .nm{font-family:'Space Mono'; font-size:9px; color:var(--white); line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .slot .fc{font-family:'Space Mono'; font-weight:700; font-size:9px; color:var(--lemon)}
  .slot .slot-pos{font-family:'Space Mono'; font-weight:700; font-size:8px; color:var(--gray2); letter-spacing:.5px}

  .ctrl-group{margin-bottom:16px}
  .ctrl-group>.h{font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--gray); text-transform:uppercase; margin-bottom:7px}
  .opt-row{display:flex; gap:6px; flex-wrap:wrap}
  .opt{font-family:'Space Mono'; font-weight:700; font-size:11px; background:var(--panel2); color:var(--gray); border:2px solid var(--line); border-radius:7px; padding:7px 10px; cursor:pointer; text-transform:uppercase}
  .opt.active{background:var(--lemon); color:var(--black); border-color:var(--lemon)}
  .bench-pick{max-height:200px; overflow-y:auto; border:2px solid var(--line); border-radius:10px}
  .bench-item{display:flex; align-items:center; gap:8px; padding:7px 9px; border-bottom:1px solid var(--line); cursor:pointer; font-size:12px}
  .bench-item:hover{background:var(--panel2)}
  .bench-item.sel{background:rgba(210,255,0,.12)}

  /* ===== ESCALAÇÃO ESTILO MAKEFOOT (2 metades) ===== */
  .mk-wrap{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1.35fr); gap:18px; align-items:start}
  @media(max-width:1100px){.mk-wrap{grid-template-columns:1fr}}

  /* ===== ESCUDOS ===== */
  .escudo-fb{display:inline-flex; align-items:center; justify-content:center; border-radius:50%; border:2px solid; font-family:'Bungee'; font-size:8px; letter-spacing:-.5px; vertical-align:middle; overflow:hidden}
  .escudo-img{border-radius:50%; object-fit:cover; vertical-align:middle}

  /* ===== TOPBAR DA ESCALAÇÃO ===== */
  .esc-topbar{display:flex; align-items:center; gap:20px; flex-wrap:wrap; background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:12px 18px; margin-bottom:16px; box-shadow:4px 4px 0 var(--shadow)}
  .esc-teampick{display:flex; align-items:center; gap:10px}
  .esc-teamsel{font-family:'Bungee'; font-size:16px; background:var(--black); color:var(--white); border:2px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer}
  .esc-teamsel:focus{outline:none; border-color:var(--lemon)}
  .esc-forminfo{display:flex; align-items:center; gap:8px}
  .esc-forminfo label{font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--gray); text-transform:uppercase}
  .esc-formsel{font-family:'Bungee'; font-size:14px; background:var(--lemon); color:var(--black); border:2px solid var(--lemon); border-radius:8px; padding:6px 12px; cursor:pointer}
  .esc-forca{margin-left:auto; font-family:'Space Mono'; font-weight:700; font-size:12px; color:var(--gray)}
  .esc-forca b{font-family:'Bungee'; color:var(--lemon); font-size:15px}

  /* ===== CAMPO HORIZONTAL (estilo FM) ===== */
  .pitch-h{display:flex; gap:6px; background:linear-gradient(90deg,#0f240f,#16301a,#0f240f); border:3px solid var(--line); border-radius:14px; padding:14px 10px; width:100%; aspect-ratio:1.55/1; max-height:566px; align-items:stretch; position:relative}
  .pitch-h::before{content:''; position:absolute; top:16px; bottom:16px; left:50%; width:2px; background:rgba(255,255,255,.06)}
  .pitch-col{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:18px}
  .slot-h{text-align:center; cursor:pointer; width:100%; max-width:92px}
  .slot-h .doth{width:48px; height:48px; margin:0 auto 4px; border-radius:50%; background:var(--panel); border:2.5px solid var(--lemon); display:flex; align-items:center; justify-content:center; font-family:'Bungee'; font-size:15px; color:var(--lemon); box-shadow:2px 2px 0 var(--shadow)}
  .slot-h .doth.empty{border-style:dashed; border-color:var(--gray2); color:var(--gray2); background:transparent}
  .slot-h.sel .doth{box-shadow:0 0 0 3px rgba(210,255,0,.35), 2px 2px 0 var(--shadow)}
  .slot-h .slot-hnm{font-family:'Space Mono'; font-weight:700; font-size:10px; color:var(--white); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .slot-h .slot-hpos{font-family:'Space Mono'; font-weight:700; font-size:9px; color:var(--gray2); letter-spacing:.5px}
  .slot-h.empty{opacity:.5}

  /* linhas fora/banco na tabela */
  .mk-row.fora{opacity:.4}
  .mk-row.fora .mk-nome-link{color:var(--gray2)}
  .mk-nome-link{color:var(--lemon); font-weight:700; cursor:pointer; text-decoration:none; border-bottom:1px dotted var(--lemon)}
  .mk-nome-link:hover{color:var(--white); border-bottom-color:var(--white)}

  /* ===== MODAL DA FICHA ===== */
  #fichaModal{position:fixed; inset:0; z-index:300}

  /* ===== FINANÇAS ===== */
  .fin-topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:14px 18px; margin-bottom:16px; box-shadow:4px 4px 0 var(--shadow)}
  .fin-saldo{display:flex; flex-direction:column; align-items:flex-end}
  .fin-saldo-lbl{font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--gray); text-transform:uppercase}
  .fin-saldo-v{font-family:'Bungee'; font-size:28px}
  .fin-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
  @media(max-width:800px){.fin-cards{grid-template-columns:1fr}}
  .fin-card{background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:16px; box-shadow:4px 4px 0 var(--shadow)}
  .fin-card-h{font-family:'Space Mono'; font-weight:700; font-size:11px; letter-spacing:1px; color:var(--gray); text-transform:uppercase; margin-bottom:10px}
  .fin-card-v{font-family:'Bungee'; font-size:24px; color:var(--white)}
  .fin-card-sub{font-family:'Space Mono'; font-size:11px; color:var(--gray2); margin-top:6px}
  .fin-ext-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); font-family:'Space Mono'; font-size:13px}
  .fin-ext-desc{color:var(--white); font-weight:700; flex:1}
  .fin-ext-rod{color:var(--gray2); font-size:11px}
  .fin-ext-val{font-weight:700; min-width:90px; text-align:right}

  /* ===== PÓDIO / FIM DE TEMPORADA ===== */
  #podioModal{position:fixed; inset:0; z-index:320}
  .podio-bg{position:absolute; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto}
  .podio-box{position:relative; width:100%; max-width:860px; max-height:92vh; overflow-y:auto; background:var(--black); border:3px solid var(--lemon); border-radius:18px; box-shadow:8px 8px 0 var(--shadow); padding:26px}
  .podio-titulo{font-family:'Bungee'; font-size:26px; color:var(--lemon); text-align:center; margin-bottom:24px}
  .podio-pedestais{display:flex; align-items:flex-end; justify-content:center; gap:14px; margin-bottom:26px}
  .podio-col{display:flex; flex-direction:column; align-items:center; gap:10px; width:180px}
  .podio-team{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center}
  .podio-nome{font-family:'Bungee'; font-size:14px; color:var(--white); line-height:1.1}
  .podio-pts{font-family:'Space Mono'; font-weight:700; font-size:11px; color:var(--gray)}
  .podio-pedestal{width:100%; background:var(--panel); border:2px solid var(--line); border-bottom:none; border-radius:8px 8px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:12px; gap:4px}
  .podio-pedestal.ouro{background:linear-gradient(180deg, rgba(210,255,0,.18), var(--panel)); border-color:var(--lemon)}
  .podio-medal{font-size:30px}
  .podio-lugar{font-family:'Bungee'; font-size:20px; color:var(--lemon)}
  .podio-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px}
  @media(max-width:640px){.podio-stats{grid-template-columns:1fr}}
  .podio-card{background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:14px}
  .podio-card.destaque-g{border-color:var(--lemon)}
  .podio-card.destaque-r{border-color:var(--loss)}
  .podio-card-h{font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--gray); text-transform:uppercase; margin-bottom:8px}
  .podio-card-b{font-family:'Space Mono'; font-size:14px; color:var(--white); display:flex; align-items:center; gap:8px}
  .podio-card-b b{font-weight:700}
  .podio-card-sub{font-family:'Space Mono'; font-size:11px; color:var(--gray); margin-top:4px}
  .podio-zonas{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px}
  @media(max-width:640px){.podio-zonas{grid-template-columns:1fr}}
  .podio-zona{background:var(--panel); border:2px solid var(--line); border-radius:10px; overflow:hidden}
  .podio-zona-h{font-family:'Space Mono'; font-weight:700; font-size:12px; padding:8px 12px; text-align:center}
  .podio-zona-h.zona-liberta{background:rgba(210,255,0,.12); color:var(--lemon)}
  .podio-zona-h.zona-reba{background:rgba(255,84,112,.12); color:var(--loss)}
  .podio-zona-row{display:flex; align-items:center; gap:8px; padding:6px 12px; border-top:1px solid var(--line); font-family:'Space Mono'; font-size:12px; color:var(--white)}
  .podio-zona-row span{color:var(--gray2); font-weight:700; min-width:24px}
  .podio-zona-row b{margin-left:auto; color:var(--lemon)}
  .podio-foot{display:flex; justify-content:center}
  .fmodal-bg{position:absolute; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; padding:24px}
  .fmodal-box{position:relative; width:100%; max-width:860px; max-height:90vh; overflow-y:auto; background:var(--black); border:3px solid var(--lemon); border-radius:16px; box-shadow:8px 8px 0 var(--shadow); padding:22px}
  .fmodal-layout{display:grid; grid-template-columns:300px 1fr; gap:22px; align-items:start}
  @media(max-width:720px){.fmodal-layout{grid-template-columns:1fr; justify-items:center}}
  .fmodal-ficha{padding-top:6px}
  .fmodal-close{position:absolute; top:12px; right:12px; background:var(--panel); border:2px solid var(--line); color:var(--white); width:32px; height:32px; border-radius:8px; cursor:pointer; font-family:'Bungee'; font-size:14px; z-index:2}

  /* ===== CARD COLECIONÁVEL DO JOGADOR (adaptado) ===== */
  .pcard-stage{perspective:1200px}
  .pcard{width:270px; height:384px; position:relative; border-radius:18px; padding:9px; transform-style:preserve-3d; transition:transform .15s ease-out; cursor:grab;
    box-shadow:0 25px 50px -12px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06);
    background:linear-gradient(150deg,#3a3a3a 0%,#0c0c0c 35%,#050505 55%,#2a2a2a 75%,#0a0a0a 100%)}
  .pcard-inner{position:relative; width:100%; height:100%; border-radius:11px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .pcard-photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .pcard-silhueta{position:absolute; inset:0; width:100%; height:100%}
  .pcard-sil-svg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .pcard-fade{position:absolute; left:0; right:0; bottom:0; height:62%; pointer-events:none;
    background:linear-gradient(180deg, rgba(5,7,10,0) 0%, rgba(5,7,10,.55) 45%, rgba(4,5,7,.96) 100%)}
  .pcard-bottom{position:absolute; left:0; right:0; bottom:20px; display:flex; flex-direction:column; align-items:center; gap:12px; padding:0 14px}
  .pcard-name{font-family:'Bungee'; font-size:26px; color:#fff; letter-spacing:.5px; text-transform:uppercase; text-align:center; line-height:1; text-shadow:0 3px 10px rgba(0,0,0,.6)}
  .pcard-stats{display:flex; gap:22px}
  .pcard-stat{display:flex; flex-direction:column; align-items:center; gap:2px}
  .pcard-stat .pcs-v{font-family:'Bungee'; font-size:22px; color:var(--lemon); line-height:1}
  .pcard-stat .pcs-k{font-family:'Space Mono'; font-weight:700; font-size:9px; letter-spacing:1px; color:#c9cdbe}
  .pcard-glare{position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay; opacity:0; transition:opacity .2s ease;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%)}
  .fmodal-close:hover{border-color:var(--loss); color:var(--loss)}
  /* dropdowns de posição/role na tabela */
  .mk-posdd,.mk-roledd{font-family:'Space Mono'; font-weight:700; font-size:10px; background:var(--panel2); color:var(--white); border:2px solid var(--line); border-radius:6px; padding:4px 5px; cursor:pointer; width:100%; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; appearance:none; -webkit-appearance:none}
  .mk-posdd:focus,.mk-roledd:focus{outline:none; border-color:var(--lemon)}
  .mk-nat{font-family:'Space Mono'; font-weight:700; font-size:10px; color:var(--gray)}
  .mk-dash{color:var(--gray2)}
  .mk-row.banco{opacity:.62}
  .mk-row.banco .mk-nome{color:var(--gray)}
  /* ficha: overall por posição */
  .ficha-roles{margin-top:14px; padding-top:12px; border-top:2px solid var(--line)}
  .role-chip.atual{background:var(--lemon); border-color:var(--lemon)!important}
  .role-chip.atual b,.role-chip.atual i{color:var(--black)!important}
  .mk-left{display:flex; flex-direction:column; gap:14px}
  .mk-panel{background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:14px; box-shadow:4px 4px 0 var(--shadow)}
  .mk-tablewrap{overflow-y:auto; height:566px}
  .mk-tablewrap::-webkit-scrollbar{width:10px}
  .mk-tablewrap::-webkit-scrollbar-track{background:var(--black); border-radius:5px}
  .mk-tablewrap::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px}
  .mk-tablewrap::-webkit-scrollbar-thumb:hover{background:var(--gray2)}
  /* filtros do elenco */
  .mk-filtros{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap}
  .mk-sel{font-family:'Space Mono'; font-weight:700; font-size:11px; background:var(--panel2); color:var(--white); border:2px solid var(--line); border-radius:7px; padding:6px 8px; cursor:pointer}
  .mk-sel:focus{outline:none; border-color:var(--lemon)}
  .mk-count{font-family:'Space Mono'; font-size:10px; color:var(--gray2); margin-left:auto}
  th.sortable{cursor:pointer; user-select:none} th.sortable:hover{color:var(--lemon)}
  /* linha expansível de roles */
  .role-toggle{background:none; border:none; color:var(--lemon); cursor:pointer; font-size:11px; padding:0 4px; margin-left:4px}
  .role-row td{padding:8px 10px !important; background:var(--black)}
  .role-line{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
  .role-hint{font-family:'Space Mono'; font-size:9px; color:var(--gray2); margin-right:6px; width:100%}
  .role-chip{display:inline-flex; align-items:center; gap:5px; border:2px solid var(--line); border-radius:6px; padding:3px 7px; cursor:pointer; background:var(--panel2)}
  .role-chip:hover{background:var(--panel)}
  .role-chip b{font-family:'Space Mono'; font-weight:700; font-size:10px; color:var(--white)}
  .role-chip i{font-family:'Bungee'; font-size:11px; font-style:normal}
  /* TABELA COM LARGURAS FIXAS (não "pula" ao mover jogadores) */
  .mk-table{width:100%; border-collapse:collapse; font-size:12px; white-space:nowrap; table-layout:fixed}
  .mk-table col.c-nome{width:150px} .mk-table col.c-nat{width:42px}
  .mk-table col.c-pos{width:132px} .mk-table col.c-role{width:120px}
  .mk-table col.c-ovr{width:44px} .mk-table col.c-id{width:36px}
  .mk-table col.c-j{width:32px} .mk-table col.c-g{width:32px} .mk-table col.c-valor{width:96px}
  .mk-table thead th{font-family:'Space Mono'; font-weight:700; font-size:9px; letter-spacing:.5px; color:var(--gray2); text-transform:uppercase; padding:6px 5px; text-align:center; border-bottom:2px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2}
  .mk-table thead th.l{text-align:left}
  .mk-row{cursor:pointer; transition:background .1s}
  .mk-row td{padding:6px 5px; text-align:center; border-bottom:1px solid var(--line); overflow:hidden; text-overflow:ellipsis}
  .mk-row td.l{text-align:left}
  .mk-row:hover{background:var(--panel2)}
  .mk-row.sel{background:rgba(210,255,0,.12); box-shadow:inset 3px 0 0 var(--lemon)}
  .mk-row.les{opacity:.55}
  .team-pick-bar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  .tp-label{font-family:'Space Mono'; font-weight:700; font-size:10px; color:var(--gray2);
    text-transform:uppercase; letter-spacing:1px}
  .tp-sel{font-family:'Space Mono'; font-weight:700; font-size:12px; background:var(--panel2);
    color:var(--white); border:2px solid var(--line); border-radius:8px; padding:8px 10px;
    min-width:260px; cursor:pointer}
  .tp-sel:focus{outline:none; border-color:var(--lemon)}
  .tp-sel optgroup{background:var(--panel); color:var(--lemon); font-style:normal}
  .tp-sel option{background:var(--panel); color:var(--white)}
  .cmp-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
  .cmp-tab{font-family:'Space Mono'; font-weight:700; font-size:11px; padding:6px 11px; cursor:pointer;
    background:var(--panel2); color:var(--gray); border:2px solid var(--line); border-radius:7px}
  .cmp-tab:hover{color:var(--white)}
  .cmp-tab.on{background:var(--lemon); color:#111112; border-color:var(--lemon)}
  .cmp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:12px}
  .cmp-grupo{background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:12px}
  .cmp-grupo.meu{border-color:var(--lemon)}
  .cmp-grupo-h{font-family:'Bungee'; font-size:12px; color:var(--white); margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center}
  .cmp-badge{font-family:'Space Mono'; font-size:8px; font-weight:700; background:var(--lemon);
    color:#111112; padding:2px 6px; border-radius:4px; letter-spacing:.5px}
  .cmp-row{display:flex; align-items:center; gap:7px; font-family:'Space Mono'; font-size:11px;
    padding:4px 0; border-bottom:1px solid var(--line); color:var(--gray)}
  .cmp-row:last-child{border-bottom:none}
  .cmp-row.classifica{color:var(--white)}
  .cmp-row.eu{color:var(--lemon); font-weight:700}
  .cmp-row.rebaixa{color:var(--loss)}
  .cmp-pos{min-width:16px; color:var(--gray2); font-size:10px}

  /* ---- Painel do presidente + confiança (aba Escalação) ---- */
  .pres-wrap{display:grid; grid-template-columns:1fr 320px; gap:14px; margin-bottom:16px}
  @media(max-width:820px){.pres-wrap{grid-template-columns:1fr}}
  .pres-fala{display:flex; gap:12px; align-items:flex-start; background:var(--panel);
    border:2px solid var(--line); border-radius:12px; padding:12px 14px}
  .pres-avatar{font-size:30px; line-height:1}
  .pres-txt{flex:1}
  .pres-h{font-family:'Space Mono'; font-size:11px; color:var(--gray2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px}
  .pres-h b{color:var(--white)}
  .pres-msg{font-family:'Space Mono'; font-size:13px; color:var(--white); font-style:italic; line-height:1.5}
  .pres-conf{background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:12px 14px}
  .pres-conf-top{display:flex; justify-content:space-between; align-items:baseline; font-family:'Space Mono'; font-size:11px; color:var(--gray2); margin-bottom:8px}
  .pres-conf-top b{font-size:12px}
  .pres-bar{position:relative; height:14px; background:#0c0d0c; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .pres-bar-fill{position:absolute; top:0; left:0; bottom:0; border-radius:8px 0 0 8px; transition:width .4s}
  .pres-bar-corte{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--loss); box-shadow:0 0 4px var(--loss)}
  .pres-conf-sub{font-family:'Space Mono'; font-size:10px; color:var(--gray2); margin-top:7px}
  .pres-conf-sub b{color:var(--loss)}

  /* ---- Empréstimo (aba Finanças) ---- */
  .fin-emp{display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-top:14px; background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:14px 16px}
  .fin-emp-h{font-family:'Bungee'; font-size:13px; color:var(--white); margin-bottom:4px}
  .fin-emp-sub{font-family:'Space Mono'; font-size:12px; color:var(--gray2)}

  /* ---- Modal FLK (prompt/confirm/alert estilizados) ---- */
  .flkm-bg{position:absolute; inset:0; background:rgba(0,0,0,.82); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50}
  .flkm-box{position:relative; width:100%; max-width:440px; background:var(--black);
    border:3px solid var(--lemon); border-radius:16px; box-shadow:8px 8px 0 var(--shadow); padding:22px}
  .flkm-title{font-family:'Bungee'; font-size:18px; color:var(--lemon); margin-bottom:14px; padding-right:30px}
  .flkm-body{font-family:'Space Mono'; font-size:13px; color:var(--white); margin-bottom:14px}
  .flkm-fields{display:flex; flex-direction:column; gap:12px; margin-bottom:16px}
  .flkm-field label{display:block; font-family:'Space Mono'; font-size:11px; color:var(--gray2); margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px}
  .flkm-field input{width:100%; background:var(--panel); border:2px solid var(--line); color:var(--white);
    border-radius:8px; padding:10px 12px; font-family:'Space Mono'; font-size:15px; box-sizing:border-box}
  .flkm-field input:focus{outline:none; border-color:var(--lemon)}
  .flkm-foot{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

  /* ---- Tela de demissão ---- */
  .dem-body{font-family:'Space Mono'; font-size:13px; color:var(--white); line-height:1.7; margin:10px 0 18px}
  .dem-body p{margin:0 0 10px}
  .dem-conf{font-size:12px; color:var(--gray2); margin-top:8px}
  .cmp-nome{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .cmp-pts{font-weight:700; min-width:22px; text-align:right}
  .cmp-j{color:var(--gray2); font-size:9px; min-width:34px; text-align:right}
  .cmp-nota{font-family:'Space Mono'; font-size:10px; color:var(--gray2); margin-bottom:12px; line-height:1.6}
  .cmp-ko{display:flex; gap:10px; overflow-x:auto; padding-bottom:8px}
  .cmp-ko-fase{min-width:190px; background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:10px}
  .cmp-ko-h{font-family:'Bungee'; font-size:10px; color:var(--lemon); margin-bottom:8px}
  .cmp-ko-cf{font-family:'Space Mono'; font-size:10px; padding:5px 0; border-bottom:1px solid var(--line); color:var(--gray)}
  .cmp-ko-cf b{color:var(--white)}
  .cmp-ko-cf.eu{color:var(--lemon); font-weight:700}
  /* --- filtro de séries (Competições) --- */
  .cmp-filtro{display:flex; flex-direction:column; gap:10px; margin-bottom:14px}
  .cmp-series{display:flex; gap:6px; flex-wrap:wrap}
  .cmp-serie{font-family:'Space Mono'; font-weight:700; font-size:11px; padding:6px 12px; cursor:pointer;
    background:var(--panel); color:var(--gray); border:2px solid var(--line); border-radius:8px}
  .cmp-serie:hover{border-color:var(--lemon)}
  .cmp-serie.on{background:var(--lemon); color:#111112; border-color:var(--lemon)}
  .cmp-serie.minha{border-color:var(--lemon)}
  .cmp-serie.minha.on{border-color:var(--lemon)}
  .cmp-vc{font-family:'Space Mono'; font-size:8px; font-weight:700; background:#111112; color:var(--lemon);
    padding:1px 5px; border-radius:4px; margin-left:4px}
  .cmp-serie.on .cmp-vc{background:#111112; color:var(--lemon)}
  .cmp-sub{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .cmp-grpsel{display:flex; align-items:center; gap:8px}
  .cmp-grpsel label{font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px;
    text-transform:uppercase; color:var(--gray2)}
  .cmp-grpsel select{font-family:'Space Mono'; font-weight:700; font-size:12px; background:var(--panel);
    color:var(--white); border:2px solid var(--lemon); border-radius:8px; padding:6px 10px; cursor:pointer}
  .cmp-euflag{font-family:'Space Mono'; font-size:8px; font-weight:700; background:var(--lemon); color:#111112;
    padding:1px 5px; border-radius:4px; margin-left:6px; letter-spacing:.5px}
  /* --- filtro de série/grupo na ARENA (Placar geral) --- */
  .ptitle-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
  .arena-filtro{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 12px}
  .arena-series{display:flex; gap:5px; flex-wrap:wrap}
  .cmp-serie.sm{font-size:10px; padding:4px 9px; border-radius:7px}
  .arena-sub{display:flex; align-items:center; gap:7px}
  .arena-sub label{font-family:'Space Mono'; font-weight:700; font-size:9px; letter-spacing:1px;
    text-transform:uppercase; color:var(--gray2)}
  .arena-grpsel{font-family:'Space Mono'; font-weight:700; font-size:11px; background:var(--panel);
    color:var(--white); border:2px solid var(--lemon); border-radius:7px; padding:4px 8px; cursor:pointer}
  .btn.jogar{background:var(--lemon); color:#111112; border-color:var(--lemon)}
  .btn.jogar[disabled]{opacity:.5; cursor:default}
  /* --- lista de escolha de clube (5 times) --- */
  .pre-card-wide{width:calc(100% - 32px)}
  .clube-lista{display:flex; flex-direction:column; gap:8px; margin:16px 0}
  .clube-lin{display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
    background:var(--panel); border:2px solid var(--line); border-radius:12px; padding:12px 16px;
    box-sizing:border-box; transition:border-color .12s, transform .12s}
  .clube-lin:hover{border-color:var(--lemon); transform:translateY(-1px)}
  .clube-escudo{flex-shrink:0; display:flex; align-items:center; justify-content:center}
  .clube-info{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1 1 auto}
  .clube-nome{font-family:'Bungee'; font-size:15px; color:var(--white); letter-spacing:.3px; line-height:1.15}
  .clube-tag{font-family:'Space Mono'; font-size:9px; font-weight:700; color:var(--gray2); text-transform:uppercase; letter-spacing:.5px}
  .clube-metas{display:flex; gap:20px; flex-shrink:0}
  .clube-meta{display:flex; flex-direction:column; align-items:center; line-height:1.2; min-width:56px}
  .clube-meta b{font-family:'Bungee'; font-size:12px; color:var(--lemon)}
  .clube-meta small{font-family:'Space Mono'; font-size:8px; color:var(--gray2); text-transform:uppercase; margin-top:2px}
  .clube-go{flex-shrink:0; font-family:'Space Mono'; font-weight:700; font-size:11px; color:var(--lemon)}
  @media(max-width:720px){ .clube-metas{gap:12px} .clube-meta{min-width:44px} }
  @media(max-width:560px){ .clube-metas{display:none} .clube-nome{font-size:14px} }
  .esc-teamnome{font-family:'Bungee'; font-size:15px; color:var(--white); letter-spacing:.3px}
  .esc-badge{font-family:'Space Mono'; font-weight:700; font-size:9px; letter-spacing:1px;
    text-transform:uppercase; color:#111112; background:var(--lemon); padding:3px 7px; border-radius:4px}
  .mk-idade{color:var(--gray2); font-size:10px; font-weight:400; margin-left:4px}
  .mk-pos-tag{display:inline-block; font-size:9px; font-weight:700; padding:1px 4px; border-radius:3px;
    letter-spacing:.3px; vertical-align:middle}
  .mk-pos-tag.setor-GK{background:#f5a623; color:#111112}
  .mk-pos-tag.setor-DEF{background:#4a9eff; color:#111112}
  .mk-pos-tag.setor-MEI{background:#2ecc71; color:#111112}
  .mk-pos-tag.setor-ATQ{background:#ff5c5c; color:#111112}
  .mk-pos-fm{color:var(--gray2); font-size:10px; margin-left:2px}
  .mini-btn{font-family:'Space Mono',monospace; font-size:11px; font-weight:700; cursor:pointer;
    background:var(--lemon); color:#111112; border:none; border-radius:4px; padding:4px 9px; white-space:nowrap}
  .mini-btn:hover{background:var(--white)}
  .mini-btn.ghost{background:transparent; color:var(--gray2); border:1px solid var(--line)}
  .mini-btn.ghost:hover{color:var(--white); border-color:var(--white); background:transparent}
  .t-tit{font-size:12px} .t-res{color:var(--gray2)}
  .mk-nome{color:var(--white); font-weight:700}
  .mk-les{color:var(--loss); font-size:9px}
  .mk-susp{color:#ff5c5c; font-size:9px; font-weight:700}
  .mk-indisp{display:inline-block; font-size:10px; color:var(--gray2); font-style:italic;
    padding:3px 6px; border:1px dashed var(--line); border-radius:4px; white-space:nowrap}
  .mk-f{font-family:'Bungee'; font-size:13px; color:var(--lemon)}
  .mk-money{font-family:'Space Mono'; font-weight:700; color:var(--gray); font-size:11px}
  .mk-contract{color:var(--gray); font-size:11px}
  .venda-sim{color:var(--loss); font-weight:700; font-size:10px}

  /* ficha do jogador */
  .mk-ficha{padding:16px}
  .ficha-grid{display:grid; grid-template-columns:1fr auto; gap:20px}
  @media(max-width:520px){.ficha-grid{grid-template-columns:1fr}}
  .ficha-grid .ficha-col:last-child{margin-top:32px}
  @media(max-width:520px){.ficha-grid .ficha-col:last-child{margin-top:0}}
  .ficha-nome{font-family:'Bungee'; font-size:15px; color:var(--white); margin-bottom:10px; line-height:1.25; display:flex; flex-wrap:wrap; align-items:center; gap:7px}
  .ficha-badge{font-family:'Space Mono'; font-weight:700; font-size:9px; background:var(--lemon); color:var(--black); padding:3px 7px; border-radius:4px; white-space:nowrap; display:inline-block}
  .ficha-line{display:flex; justify-content:space-between; gap:16px; padding:4px 0; border-bottom:1px solid var(--line); font-family:'Space Mono'; font-size:12px}
  .ficha-line span{color:var(--gray)} .ficha-line b{color:var(--white); font-weight:700}
  .ficha-bigstat{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px}
  .ficha-bigstat span{font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--gray); text-transform:uppercase}
  .ficha-bigstat b{font-family:'Bungee'; font-size:26px; color:var(--lemon)}
  .ficha-rolediff{font-family:'Space Mono'; font-weight:700; font-size:10px; color:var(--lemon); text-align:right; margin:-4px 0 6px}
  .ficha-pealert{font-family:'Space Mono'; font-weight:700; font-size:10px; color:var(--loss); text-align:right; margin:-2px 0 8px}
  .ficha-actions{display:flex; gap:8px; margin-top:14px; padding-top:12px; border-top:2px solid var(--line)}

  /* campo compacto + barras de tática */
  .mk-tacticbar{display:flex; align-items:flex-end; gap:12px; margin-bottom:12px; flex-wrap:wrap}
  .mk-tacticbar .btn{margin-left:auto}
  .mk-tactic2{display:flex; gap:18px; margin-top:12px; flex-wrap:wrap}
  .mk-pitch{min-height:400px}
  .slot.slot-sel .dot{background:var(--lemon); color:var(--black); box-shadow:0 0 0 3px rgba(210,255,0,.3), 2px 2px 0 var(--shadow)}

  /* ===== RODADA AO VIVO (todas as partidas simultâneas, painel direito) ===== */
  .live-head{display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--panel); border:2px solid var(--lemon); border-radius:12px; padding:12px 16px; box-shadow:4px 4px 0 var(--shadow)}
  .live-title{font-family:'Bungee'; font-size:20px; color:var(--white)}
  .live-clockbox{display:flex; align-items:center; gap:12px; flex:1; min-width:200px}
  .live-progwrap{flex:1; height:12px; background:var(--black); border:2px solid var(--line); border-radius:8px; overflow:hidden; min-width:100px}
  .live-prog{height:100%; width:0; background:var(--lemon); transition:width .05s linear}
  .live-clock{font-family:'Bungee'; font-size:16px; color:var(--lemon); min-width:78px; text-align:right; white-space:nowrap}

  .live-list{display:flex; flex-direction:column; gap:8px}
  .live-match{background:var(--panel2); border:2px solid var(--line); border-radius:10px; padding:9px 12px}
  .live-match.me{border-color:var(--lemon); background:rgba(210,255,0,.06)}
  .lm-teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px}
  .lm-home{text-align:right; font-size:12px; color:var(--white); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lm-away{text-align:left; font-size:12px; color:var(--white); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lm-score{font-family:'Bungee'; font-size:19px; color:var(--lemon); display:flex; align-items:center; gap:7px; white-space:nowrap}
  .lm-score .lsc-x{color:var(--gray2); font-size:12px}
  .lev{font-family:'Space Mono'; font-weight:700; font-size:11px; color:var(--gray2); margin-top:5px; min-height:15px; text-align:center}

  /* tabela viva: linha de quem está jogando + bolinha pulsante */

  /* ===== TELA DE SUBSTITUIÇÃO ===== */
  #subsOverlay{position:fixed; inset:0; z-index:200; display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto; background:rgba(0,0,0,.8)}
  .subs-bg{width:100%; max-width:600px; margin:auto}

  .subs-pend{padding:10px 16px; font-family:'Space Mono'; font-weight:700; font-size:11px; color:#4fc0e0; border-top:2px solid var(--line); background:var(--panel)}

  .empty{color:var(--gray2); font-size:13px; padding:24px; text-align:center; font-weight:700}

  /* ===== CONFIG / DADOS ===== */
  .field-in{margin-bottom:14px}
  .field-in label{display:block; font-family:'Space Mono'; font-weight:700; font-size:10px; letter-spacing:1px; color:var(--gray); text-transform:uppercase; margin-bottom:5px}
  .field-in input{width:100%; background:var(--black); border:2px solid var(--line); border-radius:8px; color:var(--white); padding:10px; font-family:'Space Mono'; font-size:13px}
  .field-in input:focus{outline:none; border-color:var(--lemon)}
  .status{font-family:'Space Mono'; font-weight:700; font-size:12px; padding:10px; border-radius:8px; margin-top:12px; border:2px solid}
  .status.ok{background:rgba(210,255,0,.1); color:var(--lemon); border-color:var(--lemon)}
  .status.err{background:rgba(255,84,112,.1); color:var(--loss); border-color:var(--loss)}
  .status.info{background:var(--panel2); color:var(--gray); border-color:var(--line)}
  .hint{font-size:12px; color:var(--gray); line-height:1.7}
  .hint code{background:var(--black); padding:2px 6px; border-radius:4px; color:var(--lemon); font-size:11px}
  .prov-badge{font-family:'Space Mono'; font-weight:700; font-size:10px; padding:4px 9px; border-radius:6px; letter-spacing:1px; border:2px solid}
  .prov-mock{background:var(--panel); color:var(--gray); border-color:var(--line)}
  .prov-sup{background:var(--lemon); color:var(--black); border-color:var(--lemon)}
  /* ===== PRÉ-JOGO (login / menu / novo jogo) ===== */
  .pre-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:40px 20px; gap:6px}
  .pre-logo{font-family:'Bungee'; font-size:clamp(34px,7vw,60px); color:var(--white); letter-spacing:1px}
  .pre-logo b{color:var(--lemon)}
  .pre-sub{font-family:'Space Mono'; font-weight:700; font-size:11px; letter-spacing:3px;
    color:var(--gray2); text-transform:uppercase; margin-bottom:26px}
  #preBody{width:100%; display:flex; justify-content:center}
  #preBody>.pre-card{flex:1 1 auto}
  .pre-card{background:var(--panel); border:2px solid var(--line); border-radius:14px;
    padding:26px; width:100%; max-width:420px}
  .pre-card.wide{max-width:640px}
  /* card largo da seleção de clubes: precisa vencer o max-width:420px de .pre-card
     (mesma especificidade, então tem de vir DEPOIS na cascata) */
  .pre-card.pre-card-wide{max-width:860px}
  .pre-title{font-family:'Bungee'; font-size:15px; color:var(--white); margin-bottom:4px}
  .pre-hint{font-family:'Space Mono'; font-size:11px; color:var(--gray2); margin-bottom:18px; line-height:1.6}
  .pre-btn{display:block; width:100%; font-family:'Bungee'; font-size:14px; letter-spacing:.5px;
    background:var(--lemon); color:#111112; border:none; border-radius:10px; padding:14px;
    cursor:pointer; margin-top:10px; transition:transform .08s, background .12s}

  .pre-btn.ghost:hover{color:var(--white); border-color:var(--white); background:transparent}
  .pre-btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
  .pre-sep{position:relative; text-align:center; margin:18px 0 12px}
  .pre-sep::before{content:''; position:absolute; top:50%; left:0; right:0; height:2px; background:var(--line)}
  .pre-sep span{position:relative; background:var(--panel); padding:0 12px; font-family:'Space Mono';
    font-weight:700; font-size:10px; color:var(--gray2); text-transform:uppercase; letter-spacing:1px}
  .pre-foot{margin-top:22px; font-family:'Space Mono'; font-size:10px; color:var(--gray2); text-align:center}
  .pre-link{color:var(--lemon); cursor:pointer; text-decoration:underline}
  .pre-msg{font-family:'Space Mono'; font-weight:700; font-size:11px; padding:10px; border-radius:8px;
    margin-top:14px; border:2px solid; line-height:1.5}
  .pre-msg.err{background:rgba(255,84,112,.1); color:var(--loss); border-color:var(--loss)}
  .pre-msg.ok{background:rgba(210,255,0,.1); color:var(--lemon); border-color:var(--lemon)}

  /* slots de save */
  .save-slot{display:flex; align-items:center; gap:14px; background:var(--panel2); border:2px solid var(--line);
    border-radius:10px; padding:14px; margin-bottom:10px; cursor:pointer; transition:border-color .12s;
    width:100%; box-sizing:border-box; text-align:left}
  .save-slot:hover{border-color:var(--lemon)}
  .save-slot-n{font-family:'Bungee'; font-size:18px; color:var(--gray2); min-width:26px; flex:0 0 auto}

  .save-slot-clube{font-family:'Bungee'; font-size:13px; color:var(--white)}

  .save-slot-del{font-family:'Space Mono'; font-size:10px; color:var(--gray2); border:1px solid var(--line);
    background:transparent; border-radius:5px; padding:4px 7px; cursor:pointer; flex:0 0 auto}
  .save-slot-del:hover{color:var(--loss); border-color:var(--loss)}
  /* proposta de clube */
  .oferta{text-align:center; padding:8px 0 4px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>/* ====================================================================
   Prancheta FC — lógica do jogo
   ==================================================================== */

/* ---------- DATA PROVIDERS (abstração) ---------- */
class MockProvider{
  constructor(d){ this.data=d; this.label='MOCK'; }
  async getTeams(){ return JSON.parse(JSON.stringify(this.data.teams)); }
}
class SupabaseProvider{
  constructor(url,key){
    if(!window.supabase) throw new Error('supabase-js não carregou');
    this.client=window.supabase.createClient(url,key); this.label='SUPABASE';
  }
  async getTeams(divisoes){
    // times (tabela 'team', singular)
    let q=this.client.from('team').select('id,nome,abrev,cidade,divisao,saldo,escudo,cor1,cor2');
    if(divisoes && divisoes.length) q=q.in('divisao',divisoes);
    const {data:teams,error:e1}=await q;
    if(e1) throw new Error('team: '+e1.message);
    if(!teams||!teams.length) throw new Error('tabela team vazia');
    const ids=teams.map(t=>t.id);
    // jogadores: o Supabase limita a 1000 linhas por request → PAGINA em blocos
    const players=[];
    const PAG=1000;
    for(let de=0; ; de+=PAG){
      const {data,error}=await this.client.from('player').select('*')
        .in('team_id',ids).order('id',{ascending:true}).range(de, de+PAG-1);
      if(error) throw new Error('player: '+error.message);
      players.push(...(data||[]));
      if(!data || data.length<PAG) break;
    }

    // colunas de atributo (0-100) que alimentam o cálculo de overall
    const ATTR_COLS=["corners","crossing","dribbling","finishing","first_touch","freekick",
      "heading","long_shots","long_throws","marking","passing","penalty","tackling","technique",
      "agression","antecipation","bravery","composure","concentration","decisions","determination",
      "flair","leadership","off_the_ball","positioning","teamwork","vision","work_rate",
      "acceleration","agility","balance","jump_reach","natural_fitness","pace","stamina","strength",
      "aerial_reach","command_of_area","communication","handling","kicking","one_on_ones",
      "reflexes","rushing_out","throwing"];

    const byT={}; (players||[]).forEach(p=>(byT[p.team_id]||=[]).push(p));
    const SETOR_SIGLA={goleiro:'GK',defesa:'DEF',meio:'MEI',ataque:'ATQ'};
    return teams.map(t=>({
      id:t.id, abrev:t.abrev, nome:t.nome, cidade:t.cidade, divisao:t.divisao||'A', saldo:t.saldo,
      escudo:t.escudo, cor1:t.cor1||'#333', cor2:t.cor2||'#fff',
      players:(byT[t.id]||[]).map((p,idx)=>{
        const attrs={}; ATTR_COLS.forEach(c=>attrs[c]=p[c]??0);
        return {
          nome:p.player_name, numero:p.numero??(idx+1),
          pid:p.id,                                // id estável do banco (sobrevive a transferências)
          setorNat:SETOR_SIGLA[p.setor]||'MEI',   // dica: GK/DEF/MEI/ATQ
          energia:p.energia??100,
          idade:p.age, valor:p.valor, salario:p.salario, contratoMeses:p.contract,
          pais:'BR',
          jogos:p.games||0, gols:p.gols||0, expulsoes:p['expulsões']||0, lesoesTemporada:p.lesoes||0,
          altura:p.height, peso:p.weight, peDominante:p.preferred_foot, peFraco:p.weak_foot,
          foto:p.photo_player,
          attrs,
          // --- Fase 2B: evolução/potencial ---
          potential:p.potential??null,      // overall-alvo na posição natural
          talento:p.talento??3,             // 1..5 velocidade de evolução
          aVenda:p.avenda??false,           // transferível
          // 'forca' de exibição = melhor overall entre as posições
          forca: Math.max(...Object.keys(PESOS_POS).map(pos=>Motor.overallEm({attrs},pos))),
        };
      })
    }));
  }
  // NOTA: persistência foi removida do provider (era o save legado sem dono,
  // slot:'default'/user_id:null). O provider é agora SÓ fonte de dados.
  // Save/load oficial: App.salvarSupabase / App.carregarSlot em game_save
  // (por user_id + slot). Ver Fase 1 da rota.
}

/* ---------- ESQUEMAS TÁTICOS ---------- */
const ESQUEMAS={
  '4-4-2':{ZAG:2,LAT:2,MEI:4,ATA:2},
  '4-3-3':{ZAG:2,LAT:2,MEI:3,ATA:3},
  '3-5-2':{ZAG:3,LAT:0,MEI:5,ATA:2},
  '5-3-2':{ZAG:3,LAT:2,MEI:3,ATA:2},
};
const LINHAS={ // ordem de exibição no campo (de trás pra frente) — genérico (mock)
  '4-4-2':[['GOL'],['ZAG','ZAG','LAT','LAT'],['MEI','MEI','MEI','MEI'],['ATA','ATA']],
  '4-3-3':[['GOL'],['ZAG','ZAG','LAT','LAT'],['MEI','MEI','MEI'],['ATA','ATA','ATA']],
  '3-5-2':[['GOL'],['ZAG','ZAG','ZAG'],['MEI','MEI','MEI','MEI','MEI'],['ATA','ATA']],
  '5-3-2':[['GOL'],['ZAG','LAT','ZAG','LAT','ZAG'],['MEI','MEI','MEI'],['ATA','ATA']],
};
// LINHAS com POSIÇÕES FM reais (cada slot = uma posição FM concreta)
// ordem de exibição: da defesa (esquerda) ao ataque (direita) no campo horizontal
const LINHAS_FM={
  '4-4-2':[['GK'],['DL','DC','DC','DR'],['ML','MC','MC','MR'],['ST','ST']],
  '4-3-3':[['GK'],['DL','DC','DC','DR'],['MC','MC','MC'],['AML','ST','AMR']],
  '4-5-1':[['GK'],['DL','DC','DC','DR'],['ML','MC','MC','MC','MR'],['ST']],
  '4-2-3-1':[['GK'],['DL','DC','DC','DR'],['DM','DM'],['AML','AMC','AMR'],['ST']],
  '4-1-4-1':[['GK'],['DL','DC','DC','DR'],['DM'],['ML','MC','MC','MR'],['ST']],
  '3-5-2':[['GK'],['DC','DC','DC'],['WBL','MC','MC','MC','WBR'],['ST','ST']],
  '3-4-3':[['GK'],['DC','DC','DC'],['WBL','MC','MC','WBR'],['AML','ST','AMR']],
  '5-3-2':[['GK'],['WBL','DC','DC','DC','WBR'],['MC','MC','MC'],['ST','ST']],
  '5-4-1':[['GK'],['WBL','DC','DC','DC','WBR'],['ML','MC','MC','MR'],['ST']],
};

/* ---------- PESOS DE ATRIBUTOS POR POSIÇÃO (FM) ---------- */
// 3=chave, 2=importante, 1=útil. Nomes = colunas da tabela player (com as grafias do banco).
const PESOS_POS={
  GK:{3:["reflexes","handling","one_on_ones","positioning"],2:["aerial_reach","command_of_area","concentration","composure","agility"],1:["kicking","communication","decisions","bravery","jump_reach"]},
  DC:{3:["marking","tackling","positioning","heading"],2:["strength","jump_reach","bravery","antecipation","concentration"],1:["pace","composure","decisions","agression"]},
  DL:{3:["tackling","marking","pace","stamina"],2:["crossing","positioning","work_rate","acceleration","agility"],1:["dribbling","passing","teamwork","antecipation"]},
  DR:{3:["tackling","marking","pace","stamina"],2:["crossing","positioning","work_rate","acceleration","agility"],1:["dribbling","passing","teamwork","antecipation"]},
  WBL:{3:["pace","stamina","crossing","tackling"],2:["acceleration","work_rate","dribbling","marking","agility","teamwork"],1:["positioning","passing","technique","balance"]},
  WBR:{3:["pace","stamina","crossing","tackling"],2:["acceleration","work_rate","dribbling","marking","agility","teamwork"],1:["positioning","passing","technique","balance"]},
  DM:{3:["tackling","positioning","antecipation","teamwork"],2:["marking","composure","stamina","strength","decisions","work_rate"],1:["passing","vision","concentration","first_touch"]},
  MC:{3:["passing","work_rate","stamina","decisions"],2:["technique","vision","first_touch","teamwork","positioning","tackling"],1:["dribbling","composure","long_shots","antecipation"]},
  ML:{3:["pace","crossing","stamina","dribbling"],2:["acceleration","work_rate","agility","technique","first_touch"],1:["passing","flair","balance","teamwork"]},
  MR:{3:["pace","crossing","stamina","dribbling"],2:["acceleration","work_rate","agility","technique","first_touch"],1:["passing","flair","balance","teamwork"]},
  AMC:{3:["vision","passing","technique","off_the_ball"],2:["flair","first_touch","dribbling","decisions","composure"],1:["finishing","long_shots","agility","antecipation"]},
  AML:{3:["pace","acceleration","dribbling","agility"],2:["crossing","finishing","flair","technique","off_the_ball"],1:["first_touch","passing","balance","work_rate"]},
  AMR:{3:["pace","acceleration","dribbling","agility"],2:["crossing","finishing","flair","technique","off_the_ball"],1:["first_touch","passing","balance","work_rate"]},
  ST:{3:["finishing","off_the_ball","composure","antecipation"],2:["heading","strength","first_touch","technique","acceleration"],1:["pace","dribbling","jump_reach","long_shots","balance"]},
};
// xG (fração ofensiva) por posição; xGA = 1 - xG
const XG_POS={GK:0,DC:.05,DL:.25,DR:.25,WBL:.30,WBR:.30,DM:.30,MC:.50,ML:.55,MR:.55,AMC:.75,AML:.80,AMR:.80,ST:.95};
// mapeamento posição FM -> slot genérico do jogo (5 posições dos esquemas atuais)
const POS_TO_SLOT={GK:"GOL",DC:"ZAG",DL:"LAT",DR:"LAT",WBL:"LAT",WBR:"LAT",
  DM:"MEI",MC:"MEI",ML:"MEI",MR:"MEI",AMC:"MEI",AML:"ATA",AMR:"ATA",ST:"ATA"};
// slot genérico -> posição FM padrão (pra calcular overall quando só temos o slot)
const SLOT_TO_POS={GOL:"GK",ZAG:"DC",LAT:"DL",MEI:"MC",ATA:"ST"};

// nome amigável das 14 posições FM
const POS_NOME={GK:'Goleiro',DC:'Zagueiro',DL:'Lateral E',DR:'Lateral D',
  WBL:'Ala E',WBR:'Ala D',DM:'Volante',MC:'Meio-campo',ML:'Meia E',MR:'Meia D',
  AMC:'Meia Ofensivo',AML:'Ponta E',AMR:'Ponta D',ST:'Atacante'};

// setor natural (sigla curta) por posição
const POS_SETOR={GK:'GK',DC:'DEF',DL:'DEF',DR:'DEF',WBL:'DEF',WBR:'DEF',
  DM:'MEI',MC:'MEI',ML:'MEI',MR:'MEI',AMC:'MEI',AML:'ATQ',AMR:'ATQ',ST:'ATQ'};

// ROLES do FM disponíveis por posição (Etapa 1: rótulo; Etapa 2: pesos próprios)
/* ---------- ROLES: modificadores sobre os pesos da posição ----------
   Cada role define:
     mods: {atributo: delta_de_peso}  -> soma ao peso que o atributo já tem na posição
                                          (peso mínimo resultante é 0)
     pe: 'interno' | 'externo' | undefined
        - 'interno' (corta pra dentro): pede pé OPOSTO ao lado (canhoto na direita, destro na esquerda)
        - 'externo' (vai à linha):     pede pé DO lado (destro na direita, canhoto na esquerda)
        - undefined: pé não importa
   O lado vem da posição (…R = direita, …L = esquerda).
*/
const ROLES_DEF={

// lista de nomes de roles por posição (pros dropdowns) — derivada de ROLES_DEF
const ROLES_POS={};
for(const pos in ROLES_DEF) ROLES_POS[pos]=Object.keys(ROLES_DEF[pos]);


/* ---------- MOTOR ---------- */
const Motor={
  // monta o mapa de pesos {atributo: peso} da posição, já com os modificadores da role
  pesosCom(posFM, role){
    const w=PESOS_POS[posFM]; if(!w) return null;
    const mapa={};
    for(const grau in w){ const g=+grau; for(const a of w[grau]) mapa[a]=(mapa[a]||0)+g; }
    const rdef = role && ROLES_DEF[posFM] && ROLES_DEF[posFM][role];
    if(rdef && rdef.mods){
      for(const a in rdef.mods){ mapa[a]=Math.max(0,(mapa[a]||0)+rdef.mods[a]); }
    }
    return mapa;
  },

  // penalidade de pé (0 a 1, multiplica o overall). 1 = sem penalidade.
  // role.pe 'interno' pede pé oposto ao lado; 'externo' pede pé do lado.
  // pé fraco forte (weak_foot 1-5) suaviza a penalidade.
  fatorPe(p, posFM, role){
    const rdef = role && ROLES_DEF[posFM] && ROLES_DEF[posFM][role];
    if(!rdef || !rdef.pe) return 1;                 // pé não importa nessa role
    const lado = posFM.endsWith('R') ? 'D' : posFM.endsWith('L') ? 'E' : null;
    if(!lado) return 1;                              // posição central: sem lado
    const pe = (p.peDominante||'').toLowerCase().startsWith('e') ? 'E' : 'D';
    // pé "ideal" pra role
    const ideal = rdef.pe==='interno' ? (lado==='D'?'E':'D') : lado;
    if(pe===ideal) return 1;                         // pé certo: sem penalidade
    // pé errado: penalidade base −18%, suavizada pelo pé fraco (1★=cheia, 5★=quase nada)
    const wf = p.peFraco || 1;                       // 1..5
    const penalidadeMax = 0.18;
    const alivio = (wf-1)/4;                         // 0 (1★) .. 1 (5★)
    return 1 - penalidadeMax*(1-alivio);
  },

  // overall do jogador NUMA posição FM (opcionalmente com ROLE), a partir dos atributos
  overallEm(p, posFM, role){
    const mapa=this.pesosCom(posFM, role);
    const attrs=p.attrs; if(!mapa || !attrs) return p.forca||50;
    let soma=0, peso=0;
    for(const a in mapa){ soma+=(attrs[a]||0)*mapa[a]; peso+=100*mapa[a]; }
    if(peso===0) return p.forca||50;
    let ov = soma/peso*100;
    ov *= this.fatorPe(p, posFM, role);             // penalidade de pé (se aplicável)
    return Math.round(ov);
  },
  // overall no slot onde está escalado. Aceita posição FM (GK,DC,DL...) ou genérica (GOL,ZAG...)
  overallSlot(p, slot){
    if(!p.attrs) return p.forca||50; // mock: usa força fixa
    // se o slot já é uma posição FM conhecida, usa direto; senão mapeia do genérico
    const posFM = PESOS_POS[slot] ? slot : (SLOT_TO_POS[slot] || 'MC');
    return this.overallEm(p, posFM);
  },
  // fração xG da posição (FM ou genérica)
  xgSlot(slot){ const posFM=PESOS_POS[slot]?slot:(SLOT_TO_POS[slot]||'MC'); return XG_POS[posFM]??0.4; },

  // cor da adequação estilo FM: verde (bom) / amarelo (serve) / vermelho (fora)
  corAdequacao(ov){
    if(ov>=75) return 'var(--lemon)';      // verde/lemon = joga bem
    if(ov>=55) return '#e8c547';            // amarelo = serve
    return 'var(--loss)';                   // vermelho = fora de posição
  },

  // melhor overall do jogador numa posição, testando todas as roles daquela posição
  melhorOvNaPos(p, posFM){
    const roles=ROLES_POS[posFM]||[''];
    let best=-1, bestRole='';
    for(const r of roles){ const o=this.overallEm(p,posFM,r); if(o>best){best=o;bestRole=r;} }
    return {ov:best, role:bestRole, pos:posFM};
  },

  // melhor overall+role geral (entre todas as 14 posições)
  melhorGeral(p){
    let best={ov:-1,role:'',pos:'MC'};
    for(const pos of Object.keys(PESOS_POS)){
      const m=this.melhorOvNaPos(p,pos);
      if(m.ov>best.ov) best=m;
    }
    return best;
  },

  // melhor overall+role por SETOR (defesa/meio/ataque). Retorna {DEF,MEI,ATQ}
  melhorPorSetor(p){
    const grupos={DEF:['DC','DL','DR','WBL','WBR'], MEI:['DM','MC','ML','MR','AMC'], ATQ:['AML','AMR','ST']};
    const res={};
    for(const set in grupos){
      let best={ov:-1,role:'',pos:''};
      for(const pos of grupos[set]){ const m=this.melhorOvNaPos(p,pos); if(m.ov>best.ov) best=m; }
      res[set]=best;
    }
    return res; // {DEF:{ov,role,pos}, MEI:{...}, ATQ:{...}}
  },

  // rendimento = overall EFETIVO × energia. Se vier slot/role, usa o overall NAQUELE
  // slot (adequação real); sem slot, cai no melhor overall global (p.forca) — compat.
  rendimento(p, slotPos, role){
    const base = (p.attrs && slotPos)
      ? this.overallEm(p, PESOS_POS[slotPos]?slotPos:(SLOT_TO_POS[slotPos]||'MC'), role)
      : p.forca;
    return base*(p.energia/100);
  },
  disp(team){ return team.players.filter(p=>!p.lesionado && !(p.suspenso>0)); },

  escalarAuto(team,esquema){
    // COM atributos FM: aloca por melhor overall em cada slot FM do esquema
    if(team.players.some(p=>p.attrs) && LINHAS_FM[esquema]){
      const slots=LINHAS_FM[esquema].flat();
      const disp=this.disp(team);
      const usados=new Set(); const onze=new Array(slots.length).fill(null);
      // preenche posições mais especializadas primeiro (GK, defesa, ataque, meio)
      const ordemSlots=slots.map((pos,idx)=>({pos,idx}))
        .sort((a,b)=>{
          const prio={GK:0,DC:1,DL:1,DR:1,WBL:1,WBR:1,ST:2,DM:3,MC:3,ML:3,MR:3,AMC:4,AML:4,AMR:4};
          return (prio[a.pos]??5)-(prio[b.pos]??5);
        });
      for(const {pos,idx} of ordemSlots){
        let melhor=null, melhorOv=-1;
        for(const p of disp){
          if(usados.has(p.numero)) continue;
          const ov=Motor.overallEm(p,pos);
          if(ov>melhorOv){ melhorOv=ov; melhor=p; }
        }
        if(melhor){ onze[idx]=melhor; usados.add(melhor.numero); }
      }
      const resto=disp.filter(p=>!usados.has(p.numero)); let r=0;
      for(let k=0;k<onze.length;k++) if(!onze[k] && resto[r]){ onze[k]=resto[r++]; }
      return onze.filter(Boolean);
    }
    // SEM atributos (mock): sistema antigo por posição genérica
    const need={GOL:1,...ESQUEMAS[esquema]};
    const porPos={}; this.disp(team).forEach(p=>(porPos[p.posicao]||=[]).push(p));
    Object.values(porPos).forEach(a=>a.sort((x,y)=>this.rendimento(y)-this.rendimento(x)));
    const onze=[]; const usados=new Set();
    for(const [pos,n] of Object.entries(need)){
      const d=(porPos[pos]||[]).filter(p=>!usados.has(p));
      for(let i=0;i<n;i++) if(d[i]){ onze.push(d[i]); usados.add(d[i]); }
    }
    const faltam=11-onze.length;
    if(faltam>0){
      const resto=this.disp(team).filter(p=>!usados.has(p))
        .sort((a,b)=>this.rendimento(b)-this.rendimento(a));
      for(let i=0;i<faltam;i++) if(resto[i]){ onze.push(resto[i]); usados.add(resto[i]); }
    }
    return onze;
  },

  // checa se um jogador está na posição natural pra dada slot-posição
  natural(player,slotPos){ return player.posicao===slotPos; },

  // força atual de um jogador no slot onde está (× energia/100), considerando a ROLE
  forcaAtual(p, slotPos, role){
    let base;
    if(p.attrs && slotPos){
      const posFM = PESOS_POS[slotPos] ? slotPos : (SLOT_TO_POS[slotPos] || 'MC');
      base = this.overallEm(p, posFM, role);       // overall na posição+role = adequação
    } else {
      base = p.forca;
      if(slotPos && p.posicao!==slotPos) base*=0.75;
    }
    return base * (p.energia/100);
  },

  // adequação (%) do jogador a um slot — pra exibir no campo (verde/amarelo/vermelho)
  adequacao(p, slotPos, role){
    if(!p.attrs) return p.posicao===slotPos?100:60;
    const posFM = PESOS_POS[slotPos] ? slotPos : (SLOT_TO_POS[slotPos] || 'MC');
    return this.overallEm(p, posFM, role);
  },

  // força do time somando cada jogador em campo pela SUA posição e role
  forcaCampo(campo){
    if(!campo.length) return 30;
    return campo.reduce((s,c)=>{
      const p=c.ref||c;
      const en=c.energia!=null?c.energia:p.energia;
      let base;
      if(p.attrs && c.posicao){
        const posFM = PESOS_POS[c.posicao] ? c.posicao : (SLOT_TO_POS[c.posicao]||'MC');
        base = this.overallEm(p, posFM, c.role);
      } else base = c.forca||p.forca;
      return s + base*(en/100);
    },0);
  },

  // FORÇA DO TIME = SOMA da força atual dos que estão em campo (roles: array paralelo opcional)
  forcaEmCampo(onze, slots, roles){
    if(!onze.length) return 30;
    return onze.reduce((s,p,i)=>s+this.forcaAtual(p, slots?slots[i]:null, roles?roles[i]:null), 0);
  },

  // compat: força média pra exibição
  forcaOnze(onze, slots, roles){
    if(!onze.length) return 30;
    return this.forcaEmCampo(onze,slots,roles)/onze.length;
  },

  // chance de gol de um lado num minuto, dadas as forças EM CAMPO (soma) e estilos
  chanceGol(fAtk, fDef, estiloAtk, estiloDef, mando){
    const est={ofensivo:1.35,normal:1.0,defensivo:0.72};
    // Fase 0: mando percentual (+7%) em vez de +40 absoluto — escala igual entre séries.
    const atk=fAtk*(mando?(1+this.MANDO_PCT):1)*est[estiloAtk];
    const def=fDef*(estiloDef==='defensivo'?1.3:estiloDef==='ofensivo'?0.82:1);
    // Fase 0: *0.027 estabiliza ~2,5 gols/jogo (harness_calibracao.js: 2,71 -> 2,44).
    return (atk/(def+atk))*0.027;
  },
  MANDO_PCT:0.07,   // bônus de mando percentual sobre o ataque (Fase 0)

  // desgaste fixo por minuto jogado (Fase 0: ~−7 na partida cheia, saldo do ciclo não-negativo)
  desgastarMinuto(onze){
    onze.forEach(p=>{ p.energia=Math.max(0, p.energia-0.078); });
  },

  // risco de lesão ao FIM do jogo, baseado na energia final
  checarLesao(onze){
    const les=[];
    onze.forEach(p=>{
      const risco=p.energia<30?0.06:p.energia<60?0.025:0.008;
      if(Math.random()<risco){ p.lesionado=Math.floor(Math.random()*18)+4; les.push({nome:p.nome,dias:p.lesionado}); }
    });
    return les;
  }
};

/* ====================================================================
   EVOLUÇÃO (Fase 2B) — passiva por idade + tempero de forma
   Mexe nos 45 atributos individuais. Overall sobe como consequência.
   ==================================================================== */
const Evolucao={
  PASSO_BASE: 2.4,          // magnitude do ganho por rodada (calibrável)

  // fator idade: >0 evolui, ~0 estável, <0 declina. Espelha o Brasfoot.
  fatorIdade(age){
    if(age<=19) return 1.35;
    if(age<=21) return 1.15;
    if(age<=23) return 0.95;
    if(age<=26) return 0.60;
    if(age<=29) return 0.30;
    if(age<=31) return 0.12;
    if(age<=32) return -0.08;      // começa a cair de leve
    if(age<=34) return -0.14;      // declínio suave
    if(age<=36) return -0.24;
    return -0.38;                  // 37+ cai rápido
  },

  // talento 1..5 -> multiplicador de velocidade
  fatorTalento(t){ return ({1:0.55,2:0.8,3:1.0,4:1.25,5:1.6})[t||3]||1.0; },

  // tempero de forma: jogou? venceu? Quem não joga evolui menos.
  fatorForma(jogou, venceu){
    let f = jogou ? 1.0 : 0.55;    // encostado ganha, mas menos
    if(jogou && venceu) f += 0.15; // vitória dá um empurrãozinho
    return f;
  },

  // growthFactor GLOBAL do jogador (potencial/ov natural). Fixo pra sempre.
  // Ancorado no overall inicial da MELHOR posição (natural).
  growthFactor(p){
    if(p._growth!=null) return p._growth;
    const ovNat = (p._ovInicialNat!=null) ? p._ovInicialNat : Motor.melhorGeral(p).ov;
    const pot = p.potential || ovNat;
    p._growth = ovNat>0 ? Math.max(1, pot/ovNat) : 1;
    return p._growth;
  },

  // Tira a "foto" inicial: overall base por posição e o growthFactor.
  // Chamado UMA vez por jogador (âncora fixa). Idempotente.
  inicializar(p){
    if(p._ancora) return;
    const posNat = Motor.melhorGeral(p).pos;
    p._ovInicialNat = Motor.overallEm(p, posNat);
    p._posNat = posNat;
    this.growthFactor(p);                          // popula p._growth
    p.attrsDec = {};                               // acumulador decimal paralelo
    for(const a in p.attrs) p.attrsDec[a] = p.attrs[a];
    // Calibra o multiplicador de atributo (mult) pra que o overall da POSIÇÃO NATURAL
    // atinja exatamente o 'potential'. O overall é ponderado, então mult != growthFactor.
    // Busca binária sobre o multiplicador aplicado aos attrs-chave da posição.
    const pot = p.potential || p._ovInicialNat;
    p._capAttr = {};
    if(pot<=p._ovInicialNat){
      for(const a in p.attrs) p._capAttr[a]=p.attrs[a];   // sem folga
    } else {
      const teste=(mult)=>{
        const at={};
        for(const a in p.attrs) at[a]=Math.min(100, p.attrs[a]*mult);
        return Motor.overallEm({attrs:at, peDominante:p.peDominante, peFraco:p.peFraco}, posNat);
      };
      let lo=1, hi=2.5;
      for(let it=0; it<24; it++){ const mid=(lo+hi)/2; if(teste(mid)<pot) lo=mid; else hi=mid; }
      const mult=(lo+hi)/2;
      for(const a in p.attrs) p._capAttr[a]=Math.min(100, Math.round(p.attrs[a]*mult*10)/10);
    }
    p._ancora = true;
  },

  // aplica UMA rodada de evolução a um jogador, direcionada a posAlvo.
  // Retorna true se algum atributo inteiro mudou (pra saber se recalcula 'forca').
  // Fase 0: evolução por tipo de posição jogada.
  // natural (posição-alvo == posição natural)          -> 100%
  // treinada (mesmo setor da natural: DEF/MEI/ATQ)      -> 70%
  // improvisada (setor diferente)                        -> 30%
  fatorPosicaoTreino(p, posAlvo){
    const nat = p._posNat || (p._ancora ? p._posNat : Motor.melhorGeral(p).pos);
    if(!nat) return 1;
    if(posAlvo===nat) return 1.0;
    return (POS_SETOR[posAlvo] && POS_SETOR[posAlvo]===POS_SETOR[nat]) ? 0.7 : 0.3;
  },

  aplicarRodada(p, posAlvo, jogou, venceu){
    if(!p._ancora) this.inicializar(p);
    const fIdade = this.fatorIdade(p.idade);
    if(fIdade===0) return false;                   // estagnação total
    const fTal = this.fatorTalento(p.talento);
    const fForma = this.fatorForma(jogou, venceu);
    const fPos = this.fatorPosicaoTreino(p, posAlvo);   // Fase 0: natural/treinada/improvisada
    const pesos = PESOS_POS[posAlvo] || PESOS_POS.MC;
    // monta lista {attr:pesoGrau} da posição (grau 3/2/1)
    const alvos = {};
    for(const grau in pesos){ for(const a of pesos[grau]) alvos[a]=Math.max(alvos[a]||0,+grau); }
    const somaPesos = Object.values(alvos).reduce((s,w)=>s+w,0) || 1;
    let mudou=false;
    const ganhoTot = this.PASSO_BASE * fIdade * fTal * fForma * fPos;
    for(const a in alvos){
      const cap = p._capAttr[a] ?? 100;
      if(fIdade>0 && p.attrsDec[a]>=cap) continue;  // chegou no teto daquele attr
      // distribui proporcional ao peso do atributo na posição
      let d = ganhoTot * (alvos[a]/somaPesos);
      // freio de gap: só desacelera nos últimos ~5 pts até o teto do attr
      if(fIdade>0){
        const gap = cap - p.attrsDec[a];
        d *= Math.max(0.2, Math.min(1, gap/5));
      }
      let nv = p.attrsDec[a] + d;
      if(fIdade>0) nv = Math.min(nv, cap);
      nv = Math.max(1, Math.min(100, nv));          // sanidade 1..100
      const antesInt = Math.floor(p.attrsDec[a]);
      p.attrsDec[a] = nv;
      const depoisInt = Math.floor(nv);
      if(depoisInt!==antesInt){ p.attrs[a]=depoisInt; mudou=true; }
    }
    return mudou;
  },

  // recalcula a 'forca' exibida (melhor overall) após mudanças de attrs
  recalcForca(p){
    p.forca = Math.max(...Object.keys(PESOS_POS).map(pos=>Motor.overallEm(p,pos)));
  },
};

/* ---------- RATING (Fase 0) ----------
   Camada única de "quão bom é o jogador". Todo sistema (ficha, mercado,
   substituição, expectativa, artilheiro) consulta AQUI em vez de recalcular,
   pra que presidente e motor concordem sobre "favorito" e ninguém compare
   overall global com overall de posição sem querer. Fina de propósito:
   delega ao Motor, só dá nomes claros ao que cada consulta significa. */
const Rating = {
  // melhor overall do jogador em QUALQUER posição (identidade global do jogador)
  overallGlobal(p){ return p.attrs ? Motor.melhorGeral(p).ov : (p.forca||50); },
  // overall do jogador NUM slot/role específico (adequação tática real)
  overallPosicao(p, slotPos, role){
    if(!p.attrs || !slotPos) return p.forca||50;
    const posFM = PESOS_POS[slotPos] ? slotPos : (SLOT_TO_POS[slotPos]||'MC');
    return Motor.overallEm(p, posFM, role);
  },
  // rendimento = overall × energia. Com slot → adequação real; sem → global.
  rendimento(p, slotPos, role){ return Motor.rendimento(p, slotPos, role); },
};

/* ---------- FIXTURES ---------- */
function gerarFixtures(n){
  const ids=[...Array(n).keys()]; if(n%2) ids.push(-1);
  const m=ids.length,t=[];
  for(let r=0;r<m-1;r++){ const j=[];
    for(let i=0;i<m/2;i++){ const h=ids[i],a=ids[m-1-i]; if(h!==-1&&a!==-1) j.push(r%2?[a,h]:[h,a]); }
    t.push(j); ids.splice(1,0,ids.pop());
  }
  return t.concat(t.map(j=>j.map(([h,a])=>[a,h])));
}

  retomarNovaCarreira(){
    this.mostrar();               // reexibe o container de pré-jogo por cima do jogo
    this.sub('livre no mercado');
    // só clubes das divisões mais baixas carregadas (arco de carreira: recomeça por baixo)
    const divsBaixas=['D','C'].filter(d=>App.teams.some(t=>t.divisao===d));
    const elegiveis=App.teams.map((t,i)=>({i,t})).filter(o=> divsBaixas.length? divsBaixas.includes(o.t.divisao) : true);
    const forcas=elegiveis.map(({i})=>({i, f:this.forcaTime(i)}));
    // 60% mais fracos, embaralhados
    forcas.sort((a,b)=>a.f-b.f);
    const corte=Math.max(1,Math.floor(forcas.length*0.6));
    this._ofertas=forcas.slice(0,corte).sort(()=>Math.random()-0.5);
    this._ofertaIdx=0;
    this._demissaoFlow=true;
    this.mostrarOferta();
