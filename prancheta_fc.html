/* ---------- MOTOR ---------- */
const Motor={
  // monta o mapa de pesos {atributo: peso} da posição, já com os modificadores da role
  pesosCom(posFM, role){
    const w=PESOS_POS[posFM]; if(!w) return null;
    const mapa={};
    for(const grau in w){ const g=+grau; for(const a of w[grau]) mapa[a]=(mapa[a]||0)+g; }
    const rdef = role && ROLES_DEF[posFM] && ROLES_DEF[posFM][role];
    if(rdef && rdef.mods){
      for(const a in rdef.mods){ mapa[a]=Math.max(0,(mapa[a]||0)+rdef.mods[a]); }
    }
    return mapa;
  },

  // penalidade de pé (0 a 1, multiplica o overall). 1 = sem penalidade.
  // role.pe 'interno' pede pé oposto ao lado; 'externo' pede pé do lado.
  // pé fraco forte (weak_foot 1-5) suaviza a penalidade.
  fatorPe(p, posFM, role){
    const rdef = role && ROLES_DEF[posFM] && ROLES_DEF[posFM][role];
    if(!rdef || !rdef.pe) return 1;                 // pé não importa nessa role
    const lado = posFM.endsWith('R') ? 'D' : posFM.endsWith('L') ? 'E' : null;
    if(!lado) return 1;                              // posição central: sem lado
    const pe = (p.peDominante||'').toLowerCase().startsWith('e') ? 'E' : 'D';
    // pé "ideal" pra role
    const ideal = rdef.pe==='interno' ? (lado==='D'?'E':'D') : lado;
    if(pe===ideal) return 1;                         // pé certo: sem penalidade
    // pé errado: penalidade base −18%, suavizada pelo pé fraco (1★=cheia, 5★=quase nada)
    const wf = p.peFraco || 1;                       // 1..5
    const penalidadeMax = 0.18;
    const alivio = (wf-1)/4;                         // 0 (1★) .. 1 (5★)
    return 1 - penalidadeMax*(1-alivio);
  },

  // overall do jogador NUMA posição FM (opcionalmente com ROLE), a partir dos atributos
  overallEm(p, posFM, role){
    const mapa=this.pesosCom(posFM, role);
    const attrs=p.attrs; if(!mapa || !attrs) return p.forca||50;
    let soma=0, peso=0;
    for(const a in mapa){ soma+=(attrs[a]||0)*mapa[a]; peso+=100*mapa[a]; }
    if(peso===0) return p.forca||50;
    let ov = soma/peso*100;
    ov *= this.fatorPe(p, posFM, role);             // penalidade de pé (se aplicável)
    return Math.round(ov);
  },
  // overall no slot onde está escalado. Aceita posição FM (GK,DC,DL...) ou genérica (GOL,ZAG...)
  overallSlot(p, slot){
    if(!p.attrs) return p.forca||50; // mock: usa força fixa
    // se o slot já é uma posição FM conhecida, usa direto; senão mapeia do genérico
    const posFM = PESOS_POS[slot] ? slot : (SLOT_TO_POS[slot] || 'MC');
    return this.overallEm(p, posFM);
  },
  // fração xG da posição (FM ou genérica)
  xgSlot(slot){ const posFM=PESOS_POS[slot]?slot:(SLOT_TO_POS[slot]||'MC'); return XG_POS[posFM]??0.4; },

  // cor da adequação estilo FM: verde (bom) / amarelo (serve) / vermelho (fora)
  corAdequacao(ov){
    if(ov>=75) return 'var(--lemon)';      // verde/lemon = joga bem
    if(ov>=55) return '#e8c547';            // amarelo = serve
    return 'var(--loss)';                   // vermelho = fora de posição
  },

  // melhor overall do jogador numa posição, testando todas as roles daquela posição
  melhorOvNaPos(p, posFM){
    const roles=ROLES_POS[posFM]||[''];
    let best=-1, bestRole='';
    for(const r of roles){ const o=this.overallEm(p,posFM,r); if(o>best){best=o;bestRole=r;} }
    return {ov:best, role:bestRole, pos:posFM};
  },

  // melhor overall+role geral (entre todas as 14 posições)
  melhorGeral(p){
    let best={ov:-1,role:'',pos:'MC'};
    for(const pos of Object.keys(PESOS_POS)){
      const m=this.melhorOvNaPos(p,pos);
      if(m.ov>best.ov) best=m;
    }
    return best;
  },

  // melhor overall+role por SETOR (defesa/meio/ataque). Retorna {DEF,MEI,ATQ}
  melhorPorSetor(p){
    const grupos={DEF:['DC','DL','DR','WBL','WBR'], MEI:['DM','MC','ML','MR','AMC'], ATQ:['AML','AMR','ST']};
    const res={};
    for(const set in grupos){
      let best={ov:-1,role:'',pos:''};
      for(const pos of grupos[set]){ const m=this.melhorOvNaPos(p,pos); if(m.ov>best.ov) best=m; }
      res[set]=best;
    }
    return res; // {DEF:{ov,role,pos}, MEI:{...}, ATQ:{...}}
  },

  // rendimento = overall EFETIVO × energia. Se vier slot/role, usa o overall NAQUELE
  // slot (adequação real); sem slot, cai no melhor overall global (p.forca) — compat.
  rendimento(p, slotPos, role){
    const base = (p.attrs && slotPos)
      ? this.overallEm(p, PESOS_POS[slotPos]?slotPos:(SLOT_TO_POS[slotPos]||'MC'), role)
      : p.forca;
    // A4: moral tempera o rendimento (suave). Rating pode não existir em testes isolados.
    const fMoral = (typeof Rating!=='undefined' && Rating.fatorMoral) ? Rating.fatorMoral(p) : 1;
    return base*(p.energia/100)*fMoral;
  },
  disp(team){ return team.players.filter(p=>!p.lesionado && !(p.suspenso>0)); },

  escalarAuto(team,esquema){
    // COM atributos FM: aloca por melhor overall em cada slot FM do esquema
    if(team.players.some(p=>p.attrs) && LINHAS_FM[esquema]){
      const slots=LINHAS_FM[esquema].flat();
      const disp=this.disp(team);
      const usados=new Set(); const onze=new Array(slots.length).fill(null);
      // preenche posições mais especializadas primeiro (GK, defesa, ataque, meio)
      const ordemSlots=slots.map((pos,idx)=>({pos,idx}))
        .sort((a,b)=>{
          const prio={GK:0,DC:1,DL:1,DR:1,WBL:1,WBR:1,ST:2,DM:3,MC:3,ML:3,MR:3,AMC:4,AML:4,AMR:4};
          return (prio[a.pos]??5)-(prio[b.pos]??5);
        });
      for(const {pos,idx} of ordemSlots){
        let melhor=null, melhorOv=-1;
        for(const p of disp){
          if(usados.has(p.numero)) continue;
          const ov=Motor.overallEm(p,pos);
          if(ov>melhorOv){ melhorOv=ov; melhor=p; }
        }
        if(melhor){ onze[idx]=melhor; usados.add(melhor.numero); }
      }
      const resto=disp.filter(p=>!usados.has(p.numero)); let r=0;
      for(let k=0;k<onze.length;k++) if(!onze[k] && resto[r]){ onze[k]=resto[r++]; }
      return onze.filter(Boolean);
    }
    // SEM atributos (mock): sistema antigo por posição genérica
    const need={GOL:1,...ESQUEMAS[esquema]};
    const porPos={}; this.disp(team).forEach(p=>(porPos[p.posicao]||=[]).push(p));
    Object.values(porPos).forEach(a=>a.sort((x,y)=>this.rendimento(y)-this.rendimento(x)));
    const onze=[]; const usados=new Set();
    for(const [pos,n] of Object.entries(need)){
      const d=(porPos[pos]||[]).filter(p=>!usados.has(p));
      for(let i=0;i<n;i++) if(d[i]){ onze.push(d[i]); usados.add(d[i]); }
    }
    const faltam=11-onze.length;
    if(faltam>0){
      const resto=this.disp(team).filter(p=>!usados.has(p))
        .sort((a,b)=>this.rendimento(b)-this.rendimento(a));
      for(let i=0;i<faltam;i++) if(resto[i]){ onze.push(resto[i]); usados.add(resto[i]); }
    }
    return onze;
  },

  // checa se um jogador está na posição natural pra dada slot-posição
  natural(player,slotPos){ return player.posicao===slotPos; },

  // força atual de um jogador no slot onde está (× energia/100), considerando a ROLE
  forcaAtual(p, slotPos, role){
    let base;
    if(p.attrs && slotPos){
      const posFM = PESOS_POS[slotPos] ? slotPos : (SLOT_TO_POS[slotPos] || 'MC');
      base = this.overallEm(p, posFM, role);       // overall na posição+role = adequação
    } else {
      base = p.forca;
      if(slotPos && p.posicao!==slotPos) base*=0.75;
    }
    // A4: moral tempera a força efetiva na partida (mesmo fator suave do rendimento)
    const fMoral = (typeof Rating!=='undefined' && Rating.fatorMoral) ? Rating.fatorMoral(p) : 1;
    return base * (p.energia/100) * fMoral;
  },

  // adequação (%) do jogador a um slot — pra exibir no campo (verde/amarelo/vermelho)
  adequacao(p, slotPos, role){
    if(!p.attrs) return p.posicao===slotPos?100:60;
    const posFM = PESOS_POS[slotPos] ? slotPos : (SLOT_TO_POS[slotPos] || 'MC');
    return this.overallEm(p, posFM, role);
  },

  // força do time somando cada jogador em campo pela SUA posição e role
  forcaCampo(campo){
    if(!campo.length) return 30;
    return campo.reduce((s,c)=>{
      const p=c.ref||c;
      const en=c.energia!=null?c.energia:p.energia;
      let base;
      if(p.attrs && c.posicao){
        const posFM = PESOS_POS[c.posicao] ? c.posicao : (SLOT_TO_POS[c.posicao]||'MC');
        base = this.overallEm(p, posFM, c.role);
      } else base = c.forca||p.forca;
      return s + base*(en/100);
    },0);
  },

  // FORÇA DO TIME = SOMA da força atual dos que estão em campo (roles: array paralelo opcional)
  forcaEmCampo(onze, slots, roles){
    if(!onze.length) return 30;
    return onze.reduce((s,p,i)=>s+this.forcaAtual(p, slots?slots[i]:null, roles?roles[i]:null), 0);
  },

  // compat: força média pra exibição
  forcaOnze(onze, slots, roles){
    if(!onze.length) return 30;
    return this.forcaEmCampo(onze,slots,roles)/onze.length;
  },

  // chance de gol de um lado num minuto, dadas as forças EM CAMPO (soma) e estilos
  chanceGol(fAtk, fDef, estiloAtk, estiloDef, mando){
    const est={ofensivo:1.35,normal:1.0,defensivo:0.72};
    // Fase 0: mando percentual (+7%) em vez de +40 absoluto — escala igual entre séries.
    const atk=fAtk*(mando?(1+this.MANDO_PCT):1)*est[estiloAtk];
    const def=fDef*(estiloDef==='defensivo'?1.3:estiloDef==='ofensivo'?0.82:1);
    // Fase 0: *0.027 estabiliza ~2,5 gols/jogo (harness_calibracao.js: 2,71 -> 2,44).
    return (atk/(def+atk))*0.027;
  },
  MANDO_PCT:0.07,   // bônus de mando percentual sobre o ataque (Fase 0)

  // desgaste fixo por minuto jogado (Fase 0: ~−7 na partida cheia, saldo do ciclo não-negativo)
  desgastarMinuto(onze){
    onze.forEach(p=>{ p.energia=Math.max(0, p.energia-0.078); });
  },

  // risco de lesão ao FIM do jogo, baseado na energia final
  checarLesao(onze){
    const les=[];
    onze.forEach(p=>{
      const risco=p.energia<30?0.06:p.energia<60?0.025:0.008;
      if(Math.random()<risco){ p.lesionado=Math.floor(Math.random()*18)+4; les.push({nome:p.nome,dias:p.lesionado}); }
    });
    return les;
  }
};

/* ====================================================================
   EVOLUÇÃO (Fase 2B) — passiva por idade + tempero de forma
   Mexe nos 45 atributos individuais. Overall sobe como consequência.
   ==================================================================== */
const Evolucao={
  PASSO_BASE: 2.4,          // magnitude do ganho por rodada (calibrável)

  // fator idade: >0 evolui, ~0 estável, <0 declina. Espelha o Brasfoot.
  fatorIdade(age){
    if(age<=19) return 1.35;
    if(age<=21) return 1.15;
    if(age<=23) return 0.95;
    if(age<=26) return 0.60;
    if(age<=29) return 0.30;
    if(age<=31) return 0.12;
    if(age<=32) return -0.08;      // começa a cair de leve
    if(age<=34) return -0.14;      // declínio suave
    if(age<=36) return -0.24;
    return -0.38;                  // 37+ cai rápido
  },

  // talento 1..5 -> multiplicador de velocidade
  fatorTalento(t){ return ({1:0.55,2:0.8,3:1.0,4:1.25,5:1.6})[t||3]||1.0; },

  // tempero de forma: jogou? venceu? Quem não joga evolui menos.
  fatorForma(jogou, venceu){
    let f = jogou ? 1.0 : 0.55;    // encostado ganha, mas menos
    if(jogou && venceu) f += 0.15; // vitória dá um empurrãozinho
    return f;
  },

  // growthFactor GLOBAL do jogador (potencial/ov natural). Fixo pra sempre.
  // Ancorado no overall inicial da MELHOR posição (natural).
  growthFactor(p){
    if(p._growth!=null) return p._growth;
    const ovNat = (p._ovInicialNat!=null) ? p._ovInicialNat : Motor.melhorGeral(p).ov;
    const pot = p.potential || ovNat;
    p._growth = ovNat>0 ? Math.max(1, pot/ovNat) : 1;
    return p._growth;
  },

  // Tira a "foto" inicial: overall base por posição e o growthFactor.
  // Chamado UMA vez por jogador (âncora fixa). Idempotente.
  inicializar(p){
    if(p._ancora) return;
    const posNat = Motor.melhorGeral(p).pos;
    p._ovInicialNat = Motor.overallEm(p, posNat);
    p._posNat = posNat;
    this.growthFactor(p);                          // popula p._growth
    p.attrsDec = {};                               // acumulador decimal paralelo
    for(const a in p.attrs) p.attrsDec[a] = p.attrs[a];
    // Calibra o multiplicador de atributo (mult) pra que o overall da POSIÇÃO NATURAL
    // atinja exatamente o 'potential'. O overall é ponderado, então mult != growthFactor.
    // Busca binária sobre o multiplicador aplicado aos attrs-chave da posição.
    const pot = p.potential || p._ovInicialNat;
    p._capAttr = {};
    if(pot<=p._ovInicialNat){
      for(const a in p.attrs) p._capAttr[a]=p.attrs[a];   // sem folga
    } else {
      const teste=(mult)=>{
        const at={};
        for(const a in p.attrs) at[a]=Math.min(100, p.attrs[a]*mult);
        return Motor.overallEm({attrs:at, peDominante:p.peDominante, peFraco:p.peFraco}, posNat);
      };
      let lo=1, hi=2.5;
      for(let it=0; it<24; it++){ const mid=(lo+hi)/2; if(teste(mid)<pot) lo=mid; else hi=mid; }
      const mult=(lo+hi)/2;
      for(const a in p.attrs) p._capAttr[a]=Math.min(100, Math.round(p.attrs[a]*mult*10)/10);
    }
    p._ancora = true;
  },

  // aplica UMA rodada de evolução a um jogador, direcionada a posAlvo.
  // Retorna true se algum atributo inteiro mudou (pra saber se recalcula 'forca').
  // Fase 0: evolução por tipo de posição jogada.
  // natural (posição-alvo == posição natural)          -> 100%
  // treinada (mesmo setor da natural: DEF/MEI/ATQ)      -> 70%
  // improvisada (setor diferente)                        -> 30%
  fatorPosicaoTreino(p, posAlvo){
    const nat = p._posNat || (p._ancora ? p._posNat : Motor.melhorGeral(p).pos);
    if(!nat) return 1;
    if(posAlvo===nat) return 1.0;
    return (POS_SETOR[posAlvo] && POS_SETOR[posAlvo]===POS_SETOR[nat]) ? 0.7 : 0.3;
  },

  aplicarRodada(p, posAlvo, jogou, venceu){
    if(!p._ancora) this.inicializar(p);
    const fIdade = this.fatorIdade(p.idade);
    if(fIdade===0) return false;                   // estagnação total
    const fTal = this.fatorTalento(p.talento);
    const fForma = this.fatorForma(jogou, venceu);
    const fPos = this.fatorPosicaoTreino(p, posAlvo);   // Fase 0: natural/treinada/improvisada
    const pesos = PESOS_POS[posAlvo] || PESOS_POS.MC;
    // monta lista {attr:pesoGrau} da posição (grau 3/2/1)
    const alvos = {};
    for(const grau in pesos){ for(const a of pesos[grau]) alvos[a]=Math.max(alvos[a]||0,+grau); }
    const somaPesos = Object.values(alvos).reduce((s,w)=>s+w,0) || 1;
    let mudou=false;
    const ganhoTot = this.PASSO_BASE * fIdade * fTal * fForma * fPos;
    for(const a in alvos){
      const cap = p._capAttr[a] ?? 100;
      if(fIdade>0 && p.attrsDec[a]>=cap) continue;  // chegou no teto daquele attr
      // distribui proporcional ao peso do atributo na posição
      let d = ganhoTot * (alvos[a]/somaPesos);
      // freio de gap: só desacelera nos últimos ~5 pts até o teto do attr
      if(fIdade>0){
        const gap = cap - p.attrsDec[a];
        d *= Math.max(0.2, Math.min(1, gap/5));
      }
      let nv = p.attrsDec[a] + d;
      if(fIdade>0) nv = Math.min(nv, cap);
      nv = Math.max(1, Math.min(100, nv));          // sanidade 1..100
      const antesInt = Math.floor(p.attrsDec[a]);
      p.attrsDec[a] = nv;
      const depoisInt = Math.floor(nv);
      if(depoisInt!==antesInt){ p.attrs[a]=depoisInt; mudou=true; }
    }
    return mudou;
  },

  // recalcula a 'forca' exibida (melhor overall) após mudanças de attrs
  recalcForca(p){
    p.forca = Math.max(...Object.keys(PESOS_POS).map(pos=>Motor.overallEm(p,pos)));
  },
};

/* ---------- RATING (Fase 0) ----------
   Camada única de "quão bom é o jogador". Todo sistema (ficha, mercado,
   substituição, expectativa, artilheiro) consulta AQUI em vez de recalcular,
   pra que presidente e motor concordem sobre "favorito" e ninguém compare
   overall global com overall de posição sem querer. Fina de propósito:
   delega ao Motor, só dá nomes claros ao que cada consulta significa. */
const Rating = {
  // melhor overall do jogador em QUALQUER posição (identidade global do jogador)
  overallGlobal(p){ return p.attrs ? Motor.melhorGeral(p).ov : (p.forca||50); },
  // overall do jogador NUM slot/role específico (adequação tática real)
  overallPosicao(p, slotPos, role){
    if(!p.attrs || !slotPos) return p.forca||50;
    const posFM = PESOS_POS[slotPos] ? slotPos : (SLOT_TO_POS[slotPos]||'MC');
    return Motor.overallEm(p, posFM, role);
  },
  // rendimento = overall × energia. Com slot → adequação real; sem → global.
  rendimento(p, slotPos, role){ return Motor.rendimento(p, slotPos, role); },

  /* ---------- MATCH RATING (A1) ----------
     Nota 0–10 de UMA partida para UM jogador. Base 6,0 (atuação neutra),
     ajustada pelo que o jogador FEZ e por como estava. Deriva de dados reais
     do motor (gols na rodada, cartões, energia final, adequação de posição),
     nunca de números inventados. É o insumo de: evolução por desempenho,
     jogador da rodada, valorização de mercado e o score do ranking.
     Parâmetros (tudo opcional exceto p):
       ctx = {
         slot, role,          // onde jogou (adequação real)
         golsFeitos,          // gols do jogador na partida (_golsRodada)
         assistencias,        // passes pra gol na partida (_assistRodada)
         golsSofridosTime,    // gols que o TIME dele levou (nota do GK/defesa)
         resultado,           // 'v' | 'e' | 'd' (do time do jogador)
         amarelos, expulso,   // disciplina na partida
         energiaFinal,        // 0–100 ao apito final
         minutos              // minutos em campo (default 90)
       }
  */
  matchRating(p, ctx){
    ctx = ctx || {};
    const min = (ctx.minutos!=null) ? ctx.minutos : 90;
    if(min<=0) return null;                 // não entrou em campo: sem nota
    let nota = 6.0;                          // atuação neutra

    // 1) adequação de posição: jogar fora da melhor posição derruba a base.
    //    compara o overall NO SLOT com o overall global do jogador.
    const ovSlot = this.overallPosicao(p, ctx.slot, ctx.role);
    const ovGlob = this.overallGlobal(p);
    if(ovGlob>0){
      const adeq = ovSlot/ovGlob;           // 1.0 = na posição; <1 = improvisado
      nota += (adeq-1)*3.0;                 // -0.3 por 10% fora de posição
    }

    const posFM = PESOS_POS[ctx.slot] ? ctx.slot : (SLOT_TO_POS[ctx.slot]||'MC');
    const ehGK = posFM==='GK';

    // 2) resultado do time (empurrãozinho coletivo)
    if(ctx.resultado==='v') nota += 0.6;
    else if(ctx.resultado==='d') nota -= 0.5;

    // 3) gols marcados — peso alto, decisivo pra artilheiro virar nota alta
    const gols = ctx.golsFeitos||0;
    if(gols>0) nota += gols*1.3;
    // 3b) assistências — menos que o gol, mas o garçom também sobe
    const ast = ctx.assistencias||0;
    if(ast>0) nota += ast*0.8;

    // 4) clean sheet / gols sofridos — pesa pro GK e zaga, leve pro resto
    const gsof = ctx.golsSofridosTime||0;
    if(ehGK || posFM==='DC' || posFM==='DL' || posFM==='DR' || posFM==='WBL' || posFM==='WBR'){
      const peso = ehGK ? 1.0 : 0.5;
      if(gsof===0) nota += 1.2*peso;        // não sofreu: bônus
      else nota -= Math.min(2.0, gsof*0.45)*peso; // sofreu: penalidade limitada
    }

    // 5) disciplina
    if(ctx.amarelos) nota -= 0.3*ctx.amarelos;
    if(ctx.expulso)  nota -= 1.5;

    // 6) energia final — quem terminou no talo rendeu; quem apagou, menos
    const en = (ctx.energiaFinal!=null) ? ctx.energiaFinal : (p.energia||100);
    if(en<40) nota -= 0.4;
    else if(en>80) nota += 0.15;

    // 7) minutos parciais aproximam a nota do neutro (jogou pouco = menos impacto)
    if(min<90){ const f=min/90; nota = 6.0 + (nota-6.0)*Math.max(0.4,f); }

    // trava 0–10, uma casa decimal
    nota = Math.max(0, Math.min(10, nota));
    return Math.round(nota*10)/10;
  },

  /* ---------- MORAL / FORMA / STATUS (A4) ----------
     Moral = 0–100 por jogador (p.moral), neutra em ~65. Reage às decisões do
     usuário (jogar × banco, resultado, nota do A1) e afeta rendimento e mercado.
     Status é DERIVADO (não persistido) da moral + contexto, calculado na hora. */
  MORAL_NEUTRA:65,
  moralDe(p){ return (p.moral!=null) ? p.moral : this.MORAL_NEUTRA; },

  // tendência de overall na temporada: compara overall atual com _ovBase (capturado
  // no início da temporada). Retorna 'up'|'down'|'flat'. Ignora ruído < 1 ponto.
  tendenciaOverall(p){
    const atual=this.overallGlobal(p);
    const base=(p._ovBase!=null)?p._ovBase:atual;
    if(atual>=base+1) return 'up';
    if(atual<=base-1) return 'down';
    return 'flat';
  },
  // seta HTML da tendência (▲ verde / ▼ vermelha / nada se estável)
  setaTendencia(p){
    const t=this.tendenciaOverall(p);
    if(t==='up')   return ' <span style="color:var(--lemon);font-size:.75em">▲</span>';
    if(t==='down') return ' <span style="color:var(--loss);font-size:.75em">▼</span>';
    return '';
  },

  // multiplicador de rendimento pela moral: 0→0.92, 65→1.0, 100→1.06 (suave)
  fatorMoral(p){
    const m=this.moralDe(p);
    if(m>=this.MORAL_NEUTRA) return 1 + (m-this.MORAL_NEUTRA)/(100-this.MORAL_NEUTRA)*0.06;
    return 1 - (this.MORAL_NEUTRA-m)/this.MORAL_NEUTRA*0.08;
  },

  // aplica variação de moral após a rodada. ctx: {jogou, resultado, nota, foiCraque}
  atualizarMoralRodada(p, ctx){
    let m=this.moralDe(p); ctx=ctx||{};
    if(ctx.jogou){
      m+=1.5;                                        // jogar já anima
      if(ctx.resultado==='v') m+=2.5; else if(ctx.resultado==='d') m-=2.0;
      if(ctx.nota!=null){ m += (ctx.nota-6.0)*1.6; } // nota alta empolga, baixa frustra
      if(ctx.foiCraque) m+=2.0;
      p._semJogar=0;
    } else {
      // ficou de fora: desânimo cresce com o tempo sem minutos
      p._semJogar=(p._semJogar||0)+1;
      m -= 1.0 + Math.min(3.0, p._semJogar*0.5);
    }
    // deriva lentamente pro neutro (evita extremos travados)
    m += (this.MORAL_NEUTRA-m)*0.04;
    p.moral=Math.max(0,Math.min(100,Math.round(m*10)/10));
    return p.moral;
  },

  // status/humor derivado (rótulo + cor). NÃO persistido — sempre recalculado.
  statusJogador(p, ehReserva){
    const m=this.moralDe(p);
    const mg=(p.attrs)?Motor.melhorGeral(p).ov:(p.forca||50);
    const pot=p.potential||mg;
    const jovemPromissor = (p.idade!=null && p.idade<=23 && pot>mg+3);
    if(m<35 && ehReserva) return {txt:'Quer sair',    cor:'var(--loss)',  emoji:'🚪'};
    if(m<40)              return {txt:'Insatisfeito',  cor:'var(--loss)',  emoji:'😤'};
    if(jovemPromissor && m>=55) return {txt:'Em ascensão', cor:'var(--lemon)', emoji:'📈'};
    if(m>=80)             return {txt:'Motivado',     cor:'var(--lemon)', emoji:'🔥'};
    if(m>=60)             return {txt:'Contente',     cor:'var(--lemon)', emoji:'🙂'};
    return {txt:'Neutro', cor:'var(--muted)', emoji:'😐'};
  },
};

/* ---------- FIXTURES ---------- */
function gerarFixtures(n){
  const ids=[...Array(n).keys()]; if(n%2) ids.push(-1);
  const m=ids.length,t=[];
  for(let r=0;r<m-1;r++){ const j=[];
    for(let i=0;i<m/2;i++){ const h=ids[i],a=ids[m-1-i]; if(h!==-1&&a!==-1) j.push(r%2?[a,h]:[h,a]); }
    t.push(j); ids.splice(1,0,ids.pop());
  }
  return t.concat(t.map(j=>j.map(([h,a])=>[a,h])));
}

/* ====================================================================
   MENU / PRÉ-JOGO (Fase 3): login, slots de save, novo jogo
   ==================================================================== */
const Menu={
  user:null,            // objeto do Supabase auth, ou null
  convidado:false,      // true = jogando sem conta (save em localStorage)
  slot:null,            // slot escolhido ('1'|'2'|'3')
  _ofertas:[], _ofertaIdx:0,

  el(){ return document.getElementById('preBody'); },
  foot(t){ const f=document.getElementById('preFoot'); if(f) f.innerHTML=t||''; },
  sub(t){ const s=document.getElementById('preSub'); if(s) s.textContent=t; },
  msg(txt,tipo){ return `<div class="pre-msg ${tipo||'info'}">${txt}</div>`; },

  mostrar(){ document.getElementById('preGame').classList.remove('hidden');
             document.getElementById('gameWrap').classList.add('hidden'); },
  esconder(){ document.getElementById('preGame').classList.add('hidden');
              document.getElementById('gameWrap').classList.remove('hidden'); },

  // ---------- entrada ----------
  async iniciar(){
    this.mostrar();
    // já tem sessão ativa?
    try{
      const {data}=await App.sb.auth.getSession();
      if(data && data.session){ this.user=data.session.user; return this.telaMenu(); }
    }catch(e){}
    this.telaEntrada();
  },

  // ---------- ENTRADA (D1): jogar primeiro, conta depois ----------
  // O jogador novo não deve bater num formulário de login. "Jogar agora" entra
  // como convidado; se ainda não há nenhuma carreira neste aparelho, vai direto
  // escolher o clube (sem passar pela tela de slots).
  telaEntrada(){
    this.sub('manager de futebol');
    this.el().innerHTML=`
      <div class="pre-card">
        <div class="pre-title">Bora treinar?</div>
        <div class="pre-hint">Assuma um clube da Série D, monte o time e leve ele até o topo do futebol brasileiro.</div>
        <button class="pre-btn" id="btnJogarAgora">▶ Jogar agora</button>
        <div class="pre-sep"><span>já tem carreira salva na nuvem?</span></div>
        <button class="pre-btn ghost" id="btnIrLogin">Entrar na minha conta</button>
        <button class="pre-btn ghost" id="btnIrCriar">Criar uma conta</button>
      </div>`;
    this.foot('Sem conta, o jogo salva só neste aparelho. Crie uma conta quando quiser para salvar na nuvem e aparecer no ranking.');
    document.getElementById('btnJogarAgora').onclick=()=>this.jogarAgora();
    document.getElementById('btnIrLogin').onclick=()=>this.telaLogin();
    document.getElementById('btnIrCriar').onclick=()=>this.telaCadastro();
  },
  async jogarAgora(){
    this.convidado=true; this.user=null;
    const saves=await this.listarSaves();
    if(!Object.keys(saves).length) return this.telaNovoJogo('1');   // 1ª vez: direto pro clube
    this.telaMenu();
  },

  // ---------- LOGIN ----------
  telaLogin(erro){
    this.sub('entrar na sua conta');
    this.el().innerHTML=`
      <div class="pre-card">
        <div class="pre-title">Entrar</div>
        <div class="pre-hint">Use a conta que você já criou para continuar sua carreira.</div>
        <div class="field-in"><label>E-mail</label><input id="mEmail" type="email" autocomplete="email" placeholder="voce@email.com"></div>
        <div class="field-in"><label>Senha</label><input id="mSenha" type="password" autocomplete="current-password" placeholder="sua senha"></div>
        <button class="pre-btn" id="btnEntrar">Entrar</button>
        ${erro?this.msg(erro,'err'):''}
        <div class="pre-sep"><span>ainda não tem conta?</span></div>
        <button class="pre-btn ghost" id="btnIrCriar">Criar uma conta</button>
        <button class="pre-btn ghost" id="btnConvidado">Jogar sem conta</button>
        <button class="pre-btn ghost" id="btnVoltarEntrada">Voltar</button>
      </div>`;
    this.foot('Sem conta, o jogo salva só neste aparelho.');
    const email=()=>document.getElementById('mEmail').value.trim();

  retomarNovaCarreira(){

    this.sub('livre no mercado');
    // só clubes das divisões mais baixas carregadas (arco de carreira: recomeça por baixo)
    const divsBaixas=['D','C'].filter(d=>App.teams.some(t=>t.divisao===d));
    const elegiveis=App.teams.map((t,i)=>({i,t})).filter(o=> divsBaixas.length? divsBaixas.includes(o.t.divisao) : true);

    // 60% mais fracos, embaralhados
    forcas.sort((a,b)=>a.f-b.f);
    const corte=Math.max(1,Math.floor(forcas.length*0.6));
    this._ofertas=forcas.slice(0,corte).sort(()=>Math.random()-0.5);

    App.confianca=App.CONF_INICIAL;    // voto de confiança inicial (60/100)
    App.demitido=false;
    // fluxo de DEMISSÃO: recomeça uma temporada limpa no clube novo (zera tabela/competição)
    if(this._demissaoFlow){
      this._demissaoFlow=false;
      App.temporada=1;
      App.reiniciarTemporadaPara(ti);

      // e o recado do presidente ficam presos na Série A).
      App.sincronizarDivisaoAtiva();
    }
    App.escalarMelhor(ti);             // já entra com o melhor 11 montado (evita time incompleto)
    this.esconder();
    App.renderShell(); App.showTab('escala');
    App.salvarSupabase(true);

  async listarSaves(){
    const out={};
    if(this.convidado){
      [1,2,3].forEach(n=>{
        try{
          const raw=localStorage.getItem('flk_save_'+n); if(!raw) return;
          const s=JSON.parse(raw);
          out[n]={clube:s.clube, temporada:s.temporada, rodada:s.rodada, quando:this.quando(s.updated_at)};
        }catch(e){}
      });
      return out;
    }
    try{
      const {data}=await App.sb.from('game_save')
        .select('slot,temporada,rodada,my_team,updated_at').eq('user_id',this.user.id);
      (data||[]).forEach(r=>{
        out[r.slot]={clube:(App.teams&&App.teams[r.my_team]?.nome)||'Carreira',

  quando(iso){
    if(!iso) return '';
    const d=new Date(iso), h=Math.round((Date.now()-d.getTime())/36e5);
    if(h<1) return 'agora há pouco';
    if(h<24) return `há ${h}h`;
    return `há ${Math.round(h/24)}d`;

  async apagarSave(slot){
    if(this.convidado){ localStorage.removeItem('flk_save_'+slot); return; }
    try{ await App.sb.from('game_save').delete().eq('user_id',this.user.id).eq('slot',String(slot)); }catch(e){}
  },
  async carregarSlot(slot){
    this.slot=slot;
    this.el().innerHTML=`<div class="pre-card">${this.msg('Carregando carreira...','info')}</div>`;
    try{
      if(!App.provider) App.provider=new SupabaseProvider(App.SUP_URL,App.SUP_KEY);
      await App.novaTemporada(['A','B','C','D']);
      App.slotAtual=slot; App.userId=this.user?.id||null; App.convidado=this.convidado;
      let estado=null, sig=null;
      if(this.convidado){
        const raw=localStorage.getItem('flk_save_'+slot);
        if(raw){ const env=JSON.parse(raw); sig=env.sig||null;
          estado = env.estadoZ ? JSON.parse(await App.descomprimir(env.estadoZ)) : env.estado; }
      } else {
        const {data}=await App.sb.from('game_save').select('estado')
          .eq('user_id',this.user.id).eq('slot',String(slot)).maybeSingle();
        estado=data?.estado||null;
        // C1: a assinatura vem embutida no envelope como _sig; separa antes de aplicar
        if(estado && estado._sig!==undefined){ sig=estado._sig; estado={...estado}; delete estado._sig; }
      }
      // C1: confere a assinatura HMAC. O veredito alimenta o ranking (C3) — save
      // não-assinado/adulterado entra no placar CARIMBADO como suspeito, não é barrado.
      App._saveAssinado = estado ? await App.conferirAssinatura(estado, sig) : true;
      let aplicado={ok:true};
      if(estado) aplicado=App.aplicarSnapshot(estado)||{ok:true};
      // save inválido/incompatível: começa uma temporada nova neste slot (aviso já dado)
      if(!aplicado.ok || App.teams.some(t=>!t.players.length)){
        App.myTeam=0; App.squadView=0;
        App.montarTemporada();
        this.esconder(); App.renderShell(); App.showTab('escala');
        return;
      }
      this.esconder();
      App.renderShell(); App.showTab('escala');
    }catch(e){
      this.el().innerHTML=`<div class="pre-card">${this.msg('Erro ao carregar: '+e.message,'err')}
        <button class="pre-btn ghost" onclick="Menu.telaMenu()">Voltar</button></div>`;
    }
  },
};

/* ====================================================================
   COMPETIÇÃO — formatos de disputa (pontos corridos e Série D)
   Série D: 96 times, 16 grupos de 6 (turno e returno = 10 rodadas),
   4 melhores de cada grupo avançam (64), mata-mata ida e volta,
   4 semifinalistas sobem + 2 vagas em repescagem entre os eliminados
   nas quartas = 6 acessos. Sem rebaixamento.
   ==================================================================== */
// Configuração de formato por divisão (data-driven — Fase 1).
// Para chegar às 10 divisões do regras_jogo_cartas.md no futuro, basta estender
// esta tabela; a lógica de competição lê daqui, não tem números hard-coded.
// Regra de consistência: os `acessos` de uma divisão devem casar com o `rebaixa`
// da divisão imediatamente acima, senão os tamanhos das séries derivam a cada
// temporada (ver harness de regressão de divisões).
const FORMATO_DIVISOES={
  A:{tipo:'pontos', acessos:4, rebaixa:4},                                   // topo: acessos ignorado
  B:{tipo:'pontos', acessos:4, rebaixa:4},
  C:{tipo:'pontos', acessos:4, rebaixa:6},                                   // cai 6 = casa com os 6 da D
  D:{tipo:'grupos', nGrupos:16, porGrupo:6, avancamPorGrupo:4, acessos:6, rebaixa:0}, // base
};

const Competicao={
  // ---------- formato por divisão ----------
  formatoDe(divisao){
    // Lê da tabela data-driven FORMATO_DIVISOES. Fallback defensivo p/ divisão
    // desconhecida (pontos corridos 4/4), para nunca quebrar em save antigo.
    const f=FORMATO_DIVISOES[divisao];
    if(f) return Object.assign({}, f);
    return {tipo:'pontos', acessos:4, rebaixa:4};
  },

  // ---------- FASE DE GRUPOS ----------
  // distribui os índices em N grupos por POTES: ordena por força, fatia em potes
  // e sorteia dentro de cada pote — equilibra as chaves mas muda a cada temporada.
  montarGrupos(indices, nGrupos, forcaDe){
    const ord=[...indices].sort((a,b)=>forcaDe(b)-forcaDe(a));
    const porGrupo=Math.ceil(ord.length/nGrupos);
    const g=Array.from({length:nGrupos},()=>[]);
    for(let pote=0; pote<porGrupo; pote++){
      // times deste pote, embaralhados
      const fatia=ord.slice(pote*nGrupos,(pote+1)*nGrupos).sort(()=>Math.random()-0.5);
      // serpentina entre potes evita que o mesmo grupo pegue sempre o melhor
      const ordemGrupos=pote%2? [...Array(nGrupos).keys()].reverse() : [...Array(nGrupos).keys()];
      fatia.forEach((idx,k)=>{ g[ordemGrupos[k]].push(idx); });
    }
    return g;
  },

  // fixtures de turno e returno DENTRO de cada grupo, mesclando as rodadas
  // (todos os grupos jogam a mesma rodada). Retorna array de rodadas; cada rodada = [[h,a],...]
  fixturesGrupos(grupos){
    const porGrupo=grupos.map(g=>this.roundRobin(g));
    const nRod=Math.max(...porGrupo.map(f=>f.length));
    const out=[];
    for(let r=0;r<nRod;r++){
      const rodada=[];
      porGrupo.forEach(f=>{ if(f[r]) rodada.push(...f[r]); });
      out.push(rodada);
    }
    return out;
  },
  // pontos corridos (ida e volta) entre os índices reais de uma divisão inteira
  roundRobinIdx(ids){ return this.roundRobin(ids); },
  // turno e returno de um grupo (recebe os índices reais dos times)
  roundRobin(ids){
    const arr=[...ids]; if(arr.length%2) arr.push(-1);
    const m=arr.length, t=[];
    for(let r=0;r<m-1;r++){
      const j=[];
      for(let i=0;i<m/2;i++){
        const h=arr[i], a=arr[m-1-i];
        if(h!==-1&&a!==-1) j.push(r%2?[a,h]:[h,a]);
      }
      t.push(j); arr.splice(1,0,arr.pop());
    }
    return t.concat(t.map(j=>j.map(([h,a])=>[a,h])));
  },

  // classificação DENTRO de um grupo (usa o stats global do App)
  classificarGrupo(stats, grupo, nomeDe){
    return grupo.map(i=>stats.find(s=>s.i===i)).filter(Boolean)
      .sort((a,b)=> b.pts-a.pts || (b.gp-b.gc)-(a.gp-a.gc) || b.gp-a.gp
                 || nomeDe(a.i).localeCompare(nomeDe(b.i)));
  },

  // ---------- MATA-MATA ----------
  // monta os confrontos da 2ª fase: 1º de um grupo x 4º de outro, etc. (cruzado)
  montarMataMata(grupos, stats, nomeDe, avancam){
    const class1=grupos.map(g=>this.classificarGrupo(stats,g,nomeDe));
    const classificados=[];
    class1.forEach((c,gi)=>c.slice(0,avancam).forEach((s,pos)=>classificados.push({i:s.i, grupo:gi, pos})));
    // cruzamento: 1º do grupo G enfrenta o 4º do grupo espelhado
    const pares=[];
    const n=grupos.length;
    for(let gi=0; gi<n; gi++){
      const espelho=n-1-gi;
      const a=classificados.find(c=>c.grupo===gi && c.pos===0);
      const b=classificados.find(c=>c.grupo===espelho && c.pos===3);
      const c2=classificados.find(c=>c.grupo===gi && c.pos===1);
      const d=classificados.find(c=>c.grupo===espelho && c.pos===2);
      if(a&&b) pares.push([a.i,b.i]);
      if(c2&&d) pares.push([c2.i,d.i]);
    }
    return pares.slice(0, classificados.length/2);
  },

  // resolve um confronto de ida e volta. jogos = [{h,a,gc,gf},{...}]
  // Critério: soma dos gols; empate → melhor campanha (quem foi mandante na volta avança)
  vencedorDoConfronto(mandante, visitante, jogos){
    let gM=0, gV=0;
    jogos.forEach(j=>{
      if(j.h===mandante){ gM+=j.gc; gV+=j.gf; } else { gV+=j.gc; gM+=j.gf; }
    });
    if(gM>gV) return {vencedor:mandante, perdedor:visitante, gM, gV};
    if(gV>gM) return {vencedor:visitante, perdedor:mandante, gM, gV};
    // empate no agregado: decide nos pênaltis (aleatório, com leve vantagem do mandante da volta)
    const penM=Math.random()<0.55;
    return {vencedor:penM?mandante:visitante, perdedor:penM?visitante:mandante, gM, gV, penaltis:true};
  },

  // nome da fase pelo número de confrontos restantes
  nomeFase(nTimes){
    return ({64:'Segunda Fase',32:'Terceira Fase',16:'Oitavas de final',
             8:'Quartas de final',4:'Semifinal',2:'Final'})[nTimes] || `Fase de ${nTimes}`;
  },

  // ---------- ACESSO ----------
  // Série D: os 4 semifinalistas sobem; +2 em repescagem entre os 4 eliminados nas quartas.
  acessosSerieD(semifinalistas, eliminadosQuartas){
    const sobem=[...semifinalistas];
    // repescagem: 2 confrontos entre os 4 eliminados nas quartas
    const rep=[];
    if(eliminadosQuartas.length>=4){
      rep.push([eliminadosQuartas[0],eliminadosQuartas[3]]);
      rep.push([eliminadosQuartas[1],eliminadosQuartas[2]]);
    }
    return {sobem, repescagem:rep};
  },
};

/* ====================================================================
   OBJETIVOS (A3) — modelo híbrido
   • PRINCIPAL: meta da diretoria, derivada do formato da divisão. Avaliada
     no FIM da temporada. Cumprir dá bônus grande + confiança; falhar tira
     confiança. Conversa com o sistema de confiança existente.
   • SECUNDÁRIOS: 3 desafios rotativos sorteados por temporada, com progresso
     a cada rodada e pagamento ao concluir. São o gancho dos ads recompensados
     (Bloco B): concluiu → oferta de dobrar a recompensa vendo um anúncio.
   Estado vive em App.objetivos (persistido no save). Nada aqui é re-derivável
   de outra fonte, então é memória de jogo legítima.
   ==================================================================== */
const Objetivos={
  // bônus base (em reais) escalado por divisão — divisões de cima pagam mais
  escalaDiv(div){ return ({A:3, B:2.2, C:1.6, D:1.1})[div]||1.5; },

  // ---- PRINCIPAL: meta da diretoria conforme a divisão ----
  principalDe(div){
    const esc=this.escalaDiv(div);
    if(div==='A') return {id:'ficar_a', tipo:'principal',
      titulo:'Permanecer na Série A', desc:'Termine fora da zona de rebaixamento (Z-4).',
      premio:Math.round(6e6*esc), confOk:8, confFail:-14};
    if(div==='D') return {id:'subir_d', tipo:'principal',
      titulo:'Subir para a Série C', desc:'Avance no mata-mata e conquiste o acesso.',
      premio:Math.round(6e6*esc), confOk:12, confFail:-10};
    // B e C: subir é a meta; não cair é o piso
    const acima=({B:'Série A',C:'Série B'})[div];
    return {id:'subir_'+div.toLowerCase(), tipo:'principal',
      titulo:'Conquistar acesso à '+acima, desc:'Termine entre os primeiros e suba de divisão.',
      premio:Math.round(6e6*esc), confOk:12, confFail:-12};
  },

  // ---- SECUNDÁRIOS: catálogo. metaDe() dá o alvo; cada um sabe se progride. ----
  // progresso é acumulado em App.objetivos.sec[i].prog pelos eventos da rodada.
  CATALOGO:[
    {id:'vit_casa',  titulo:'Fortaleza em casa',  descF:m=>`Vença ${m} jogos como mandante.`,      meta:[3,4,5],   ev:'vitCasa'},
    {id:'gols_temp', titulo:'Ataque avassalador',  descF:m=>`Marque ${m} gols na temporada.`,        meta:[18,25,32],ev:'gols'},
    {id:'invicto',   titulo:'Invencível',          descF:m=>`Fique ${m} rodadas seguidas sem perder.`,meta:[4,5,6],  ev:'invicto', streak:true},
    {id:'clean',     titulo:'Muralha',             descF:m=>`Não sofra gols em ${m} jogos.`,          meta:[3,4,5],   ev:'clean'},
    {id:'vitorias',  titulo:'Máquina de vencer',   descF:m=>`Vença ${m} jogos na temporada.`,         meta:[8,11,14], ev:'vitoria'},
  ],

  // sorteia 3 secundários distintos, com dificuldade/prêmio escalados pela divisão
  sortearSecundarios(div){
    const esc=this.escalaDiv(div);
    const pool=[...this.CATALOGO];
    // embaralha
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    return pool.slice(0,3).map(c=>{
      const nivel=Math.floor(Math.random()*c.meta.length);      // 0=fácil,1=médio,2=difícil
      const meta=c.meta[nivel];
      const premio=Math.round((0.8e6 + nivel*0.6e6)*esc);         // mais difícil paga mais
      return {id:c.id, ev:c.ev, streak:!!c.streak, titulo:c.titulo,
              desc:c.descF(meta), meta, prog:0, feito:false, premioBase:premio, adUsado:false};
    });
  },

  // (re)inicia os objetivos da temporada para a divisão atual
  novaTemporada(div){
    return { div, principal:this.principalDe(div), principalStatus:'aberto',
             sec:this.sortearSecundarios(div) };
  },
};

/* ====================================================================
   ESCALAÇÃO AUTOMÁTICA — atribuição ÓTIMA jogador × vaga (algoritmo húngaro)
   Antes: preenchia vaga por vaga na ordem da formação (GK → defesa → meio →
   ataque), pegando o melhor disponível pra CADA vaga. Resultado: um meia forte
   (MC 78, DC 72) ia pra zaga só porque a zaga era preenchida primeiro.
   Agora: escolhe os 11 de uma vez, maximizando a soma de
     nota(p,vaga) = overall na vaga − penalidade por jogar fora da posição natural
   (natural 0 · mesmo setor −2 · outro setor −10: improvisar só quando compensa muito).
   Usa Motor.overallEm (então o "Descansados", que pesa energia, continua valendo).
   ==================================================================== */
const Escalacao={
  PEN_TREINADA:2,
  PEN_IMPROVISADA:10,
  posNatural(p){ return p._posNat || Motor.melhorGeral(p).pos; },
  nota(p, pos, nat){
    const ov=Motor.overallEm(p,pos);
    if(pos===nat) return ov;
    const mesmoSetor=POS_SETOR[pos] && POS_SETOR[pos]===POS_SETOR[nat];
    return ov-(mesmoSetor?this.PEN_TREINADA:this.PEN_IMPROVISADA);
  },
  // jogadores[], slots[] → array alinhado com slots: {pos, p|null}
  // bonus(p) opcional soma à nota (ex.: preferir manter quem já é titular)
  atribuir(jogadores, slots, bonus){
    const n=slots.length; if(!n) return [];
    const nat=new Map(jogadores.map(p=>[p,this.posNatural(p)]));
    const m=Math.max(jogadores.length, n);          // colunas extras = vaga vazia
    const custo=slots.map(pos=>{ const row=new Array(m);
      for(let j=0;j<m;j++) row[j] = j<jogadores.length ? -(this.nota(jogadores[j],pos,nat.get(jogadores[j]))+(bonus?bonus(jogadores[j]):0)) : 1000;
      return row; });
    const col=this.hungaro(custo);
    return slots.map((pos,i)=>({pos, p: col[i]>=0 && col[i]<jogadores.length ? jogadores[col[i]] : null}));
  },
  // húngaro (min custo), matriz n×m com n ≤ m. Retorna, pra cada linha, a coluna atribuída.
  hungaro(a){
    const n=a.length, m=a[0].length, INF=1e18;
    const u=new Array(n+1).fill(0), v=new Array(m+1).fill(0), p=new Array(m+1).fill(0), way=new Array(m+1).fill(0);
    for(let i=1;i<=n;i++){
      p[0]=i; let j0=0; const minv=new Array(m+1).fill(INF), used=new Array(m+1).fill(false);
      do{
        used[j0]=true; const i0=p[j0]; let delta=INF, j1=0;
        for(let j=1;j<=m;j++) if(!used[j]){
          const cur=a[i0-1][j-1]-u[i0]-v[j];
          if(cur<minv[j]){ minv[j]=cur; way[j]=j0; }
          if(minv[j]<delta){ delta=minv[j]; j1=j; }
        }
        for(let j=0;j<=m;j++){ if(used[j]){ u[p[j]]+=delta; v[j]-=delta; } else minv[j]-=delta; }
        j0=j1;
      } while(p[j0]!==0);
      do{ const j1=way[j0]; p[j0]=p[j1]; j0=j1; } while(j0);
    }
    const res=new Array(n).fill(-1);
    for(let j=1;j<=m;j++) if(p[j]) res[p[j]-1]=j-1;
    return res;
  },
};

/* ====================================================================
   FORMA RECENTE (§6.1 item 5) — janelas deslizantes de 5 (FIFO), no save v9.
   - jogador: p._notas5  = 5 últimas notas (Match Rating) de partidas em que atuou
   - time:    t._notas5  = 5 últimas notas do time; nota do time na partida =
                           média das notas dos jogadores que atuaram (banco não conta)
              t._forma5  = 5 últimos resultados ('v'|'e'|'d'), mais antigo primeiro
   ==================================================================== */
const Forma={
  N:5,
  empurrar(obj,campo,val){
    const arr=Array.isArray(obj[campo])?obj[campo]:[];
    arr.push(val); while(arr.length>this.N) arr.shift();
    obj[campo]=arr; return arr;
  },
  registrarTime(t,notas,res){
    if(!t) return;
    if(notas&&notas.length){
      const m=notas.reduce((a,b)=>a+b,0)/notas.length;
      this.empurrar(t,'_notas5',Math.round(m*10)/10);
    }
    if(res) this.empurrar(t,'_forma5',res);
  },
  media(arr){ return (Array.isArray(arr)&&arr.length) ? arr.reduce((a,b)=>a+b,0)/arr.length : null; },
  // dados vindos do save são NÃO confiáveis: filtra, faz clamp e corta em 5
  sanearNotas(v){ return Array.isArray(v) ? v.map(Number).filter(n=>isFinite(n)).map(n=>Math.max(0,Math.min(10,n))).slice(-this.N) : []; },
  sanearResultados(v){ return Array.isArray(v) ? v.filter(r=>r==='v'||r==='e'||r==='d').slice(-this.N) : []; },
};

/* ====================================================================
   COLETIVA PÓS-JOGO (§6.1 item 1) — 3 perguntas de um repórter depois da
   partida do MEU time: (1) o jogo, (2) o elenco, (3) o clube. Cada resposta
   tem um perfil (Protetor, Direto, Técnico…) e um efeito VISÍVEL antes de
   escolher: moral (do elenco ou de um jogador) e cargo (confiança da diretoria).
   Respostas são trocas: agradar o vestiário custa diretoria e vice-versa, pra
   coletiva não virar fonte grátis de confiança. Pulável; desliga nas Configurações.
   ==================================================================== */
const Coletiva={
  REPORTERES:[['Kátia Moreira','Rádio Arquibancada'],['Bruno Tavares','TV Várzea'],['Lia Fontes','Portal Chuteira'],
    ['Otávio Reis','Jornal do Interior'],['Marta Lopes','Podcast Prancheta'],['Caio Nunes','Rádio Geral AM']],
  pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; },

  // contexto da partida → 3 perguntas com respostas. ctx vem do App (ver App.contextoColetiva)
  montar(ctx){
    const q=[this.perguntaJogo(ctx), this.perguntaElenco(ctx), this.perguntaClube(ctx)].filter(Boolean);
    return {reporter:this.pick(this.REPORTERES), perguntas:q};
  },
  perguntaJogo(c){
    const placar=`${c.meus}×${c.deles}`, adv=c.adv;
    if(c.resultado==='v'){
      const goleada=c.meus-c.deles>=3;
      return {tema:'O jogo', txt:this.pick(goleada
          ?[`Goleada de ${placar} sobre o ${adv}. O time encaixou de vez?`,`${placar}! Dá pra dizer que foi a melhor atuação da temporada?`]
          :[`Vitória por ${placar} sobre o ${adv}. O que decidiu?`,`${placar} contra o ${adv}. Foi mais mérito ou sorte?`]),
        respostas:[
          {perfil:'Protetor', txt:'Mérito total dos jogadores. Eles merecem cada elogio.', moral:+3, cargo:0},
          {perfil:'Direto', txt:'Ganhamos, mas ainda erramos demais. Não dá pra relaxar.', moral:-2, cargo:+2},
          {perfil:'Técnico', txt:'O plano funcionou: ocupamos bem os espaços e fomos eficientes.', moral:+1, cargo:+1},
        ]};
    }
    if(c.resultado==='e'){
      return {tema:'O jogo', txt:this.pick([`Empate em ${placar} com o ${adv}. Ficou bom?`,`${placar} com o ${adv}. Ponto ganho ou dois perdidos?`]),
        respostas:[
          {perfil:'Protetor', txt:'O grupo lutou até o fim. Ponto conquistado com suor.', moral:+2, cargo:-1},
          {perfil:'Direto', txt:'Era jogo pra vencer. Vou cobrar no vestiário.', moral:-3, cargo:+2},
          {perfil:'Técnico', txt:'Faltou capricho no último passe. Vamos ajustar na semana.', moral:0, cargo:+1},
        ]};
    }
    const vexame=c.deles-c.meus>=3;
    return {tema:'O jogo', txt:this.pick(vexame
        ?[`Derrota por ${placar} para o ${adv}. O que aconteceu?`,`${placar}… a torcida saiu revoltada. Tem explicação?`]
        :[`Derrota por ${placar} para o ${adv}. O que faltou?`,`${placar} contra o ${adv}. O time sentiu a pressão?`]),
      respostas:[
        {perfil:'Protetor', txt:'A responsabilidade é minha. O grupo fez o que pedi.', moral:+4, cargo:-2},
        {perfil:'Direto', txt:'Não aceito essa atuação. Vai ter mudança.', moral:-4, cargo:+2},
        {perfil:'Contido', txt:'Futebol tem dessas. Cabeça no próximo jogo.', moral:0, cargo:0},
      ]};
  },
  perguntaElenco(c){
    if(c.insatisfeito){
      const n=c.insatisfeito.nome;
      return {tema:'O elenco', alvo:c.insatisfeito.numero, txt:`${n} anda reclamando da falta de chances. Ele vai ter espaço?`,
        respostas:[
          {perfil:'Abraço', txt:`O ${n.split(' ')[0]} é importante. A chance dele vai chegar.`, moralAlvo:+10, cargo:-1},
          {perfil:'Firme', txt:'Aqui joga quem treina melhor. Serve pra todo mundo.', moralAlvo:-5, cargo:+1},
          {perfil:'Contido', txt:'Isso a gente resolve internamente.', moral:0, cargo:0},
        ]};
    }
    if(c.craque){
      const n=c.craque.nome, pn=n.split(' ')[0];
      return {tema:'O elenco', alvo:c.craque.numero, txt:this.pick([`${n} foi o destaque com nota ${c.craque.nota.toFixed(1)}. É o craque do time?`,`Todo mundo fala do ${n} hoje. Ele carrega o time?`]),
        respostas:[
          {perfil:'Elogio', txt:`O ${pn} é diferenciado. Merece todos os holofotes.`, moralAlvo:+8, cargo:0},
          {perfil:'Coletivo', txt:'Ninguém ganha sozinho. O destaque é do grupo.', moral:+1, cargo:0},
          {perfil:'Exigente', txt:`Pode render ainda mais. Vou cobrar o ${pn}.`, moralAlvo:-3, cargo:+1},
        ]};
    }
    return null;
  },
  perguntaClube(c){
    const pos=`${c.posicao}º`;
    if(c.zonaBoa){
      return {tema:'O clube', txt:this.pick([`O time está em ${pos}. Dá pra sonhar com a meta ("${c.meta}")?`,`${pos} na tabela. A torcida já fala em "${c.meta}". Promete?`]),
        respostas:[
          {perfil:'Ambicioso', txt:'Vamos brigar até o fim. Esse elenco tem condição.', moral:+3, cargo:-1},
          {perfil:'Pé no chão', txt:'Um jogo de cada vez. Ainda falta muito.', moral:0, cargo:+1},
          {perfil:'Humilde', txt:'Nosso objetivo é somar pontos, sem euforia.', moral:+1, cargo:0},
        ]};
    }
    return {tema:'O clube', txt:this.pick([`${pos} na tabela e a diretoria ${c.pressao?'está impaciente':'observa'}. Seu cargo está ameaçado?`,`O time está em ${pos}. O que você diz pro torcedor?`]),
      respostas:[
        {perfil:'Institucional', txt:'Tenho total apoio da diretoria e confio no planejamento.', moral:0, cargo:+1},
        {perfil:'Firme', txt:'Vou cobrar mais de todo mundo. Não aceito essa posição.', moral:-2, cargo:+2},
        {perfil:'Protetor', txt:'O elenco está do meu lado. Vamos virar isso juntos.', moral:+3, cargo:-1},
      ]};
  },
  // selos de efeito da resposta ("moral +3", "cargo −1")
  selos(r, nomeAlvo){
    const s=[]; const f=v=>(v>0?'+':'−')+Math.abs(v);
    if(r.moral) s.push({t:`moral ${f(r.moral)}`, bom:r.moral>0});
    if(r.moralAlvo) s.push({t:`${nomeAlvo||'jogador'} ${f(r.moralAlvo)}`, bom:r.moralAlvo>0});
    if(r.cargo) s.push({t:`cargo ${f(r.cargo)}`, bom:r.cargo>0});
    if(!s.length) s.push({t:'sem efeito', neutro:true});
    return s;
  },
};

  // ---------- motor de coach-marks ----------
  tour(passos,onFim){ this._passos=passos; this._i=0; this._onFim=onFim||null; this.mostrarPasso(); },
  mostrarPasso(){
    const p=this._passos&&this._passos[this._i];
    if(!p){ this.fechar(); const f=this._onFim; this._onFim=null; if(f) f(); return; }
    if(p.antes) p.antes();
    const alvo=[...document.querySelectorAll(p.alvo)].find(e=>e.offsetParent);
    if(!alvo){ this._i++; return this.mostrarPasso(); }   // alvo sumiu: pula o passo
    this._alvo=alvo;
    alvo.scrollIntoView({block:'center', behavior:'instant'});
    let ov=document.getElementById('tutOverlay');
    if(!ov){ ov=document.createElement('div'); ov.id='tutOverlay'; document.body.appendChild(ov); }
    const ult=this._i===this._passos.length-1;
    ov.innerHTML=`<div class="tut-block"></div><div class="tut-spot"></div>
      <div class="tut-bubble" role="dialog" aria-live="polite">
        <div class="tut-step">${this._i+1}/${this._passos.length}</div>
        <div class="tut-h">${p.titulo}</div>
        <div class="tut-txt">${p.txt}</div>
        <div class="tut-foot">
          <button class="tut-skip" data-tut-skip>Pular tutorial</button>
          <button class="btn primary sm" data-tut-next>${p.botao||(ult?'Fechar':'Próximo ▸')}</button>
        </div>
      </div>`;
    ov.querySelector('[data-tut-next]').onclick=()=>{ this._i++; this.mostrarPasso(); };
    ov.querySelector('[data-tut-skip]').onclick=()=>{ this.marcar('feito'); this._onFim=null; this.fechar(); };
    this.posicionar();
    if(!this._onResize){ this._onResize=()=>this.posicionar(); window.addEventListener('resize',this._onResize); window.addEventListener('scroll',this._onResize,true); }
  },
  posicionar(){
    const ov=document.getElementById('tutOverlay'); if(!ov||!this._alvo) return;
    const r=this._alvo.getBoundingClientRect(), pad=6;
    const spot=ov.querySelector('.tut-spot'), b=ov.querySelector('.tut-bubble');
    Object.assign(spot.style,{left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px'});
    const vw=window.innerWidth, vh=window.innerHeight, bw=Math.min(340, vw-32);
    b.style.width=bw+'px';
    const bh=b.offsetHeight;
    let top = (r.bottom+14+bh<vh) ? r.bottom+14 : (r.top-14-bh>0 ? r.top-14-bh : Math.max(16, vh-bh-16));
    let left=Math.max(16, Math.min(r.left+r.width/2-bw/2, vw-bw-16));
    b.style.top=top+'px'; b.style.left=left+'px';
  },
  fechar(){
    const ov=document.getElementById('tutOverlay'); if(ov) ov.remove();
    this._alvo=null; this._passos=null;
    if(this._onResize){ window.removeEventListener('resize',this._onResize); window.removeEventListener('scroll',this._onResize,true); this._onResize=null; }
  },
  toast(html){
    let t=document.getElementById('tutToast');
    if(!t){ t=document.createElement('div'); t.id='tutToast'; document.body.appendChild(t); }
    t.innerHTML=`<span>${html}</span><button aria-label="Fechar">✕</button>`;
    t.classList.add('on');
    const fechar=()=>t.classList.remove('on');
    t.querySelector('button').onclick=fechar;
    clearTimeout(this._toastT); this._toastT=setTimeout(fechar,7000);
  },
};

  indicesDaDivisao(div){

  forcaBaseTime(ti){ return Motor.forcaOnze(Motor.escalarAuto(this.teams[ti],'4-3-3'),null)||0; },

  // monta a liga de UMA divisão: grupos+fixtures (D) ou pontos corridos (A/B/C).
  // 'espelho' liga os campos usados pelo motor ao vivo quando é a divisão do usuário.
  montarLigaDivisao(div){
    const idxs=this.indicesDaDivisao(div);
    const fmt=Competicao.formatoDe(div);
    const liga={div, formato:fmt, indices:idxs, rodada:0,
      grupos:null, fase:'pontos', mataMata:null, fixtures:[],
      stats:idxs.map(i=>({i,pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0}))};
    if(fmt.tipo==='grupos' && idxs.length>=fmt.nGrupos*2){
      const emb=[...idxs].sort(()=>Math.random()-0.5);
      liga.grupos=Competicao.montarGrupos(emb, fmt.nGrupos, i=>this.forcaBaseTime(i));
      liga.fase='grupos'; liga.mataMata=null;
      liga.fixtures=Competicao.fixturesGrupos(liga.grupos);

      liga.grupos=null; liga.fase='pontos'; liga.mataMata=null;

    this.stats=this.teams.map((t,i)=>({i,pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0}));

    this.divisao=this.teams[this.myTeam]?.divisao||this.divisao;
    this.formato=Competicao.formatoDe(this.divisao);

  // cfg inicial: escala o melhor 11 nas melhores posições (4-3-3 base)
  cfgInicial(t){
    const formacao='4-3-3';
    const posEscala={}, roleEscala={};
    const slots=LINHAS_FM[formacao].flat();
    const usados=new Set();
    // titulares: atribuição ótima jogador × vaga (ver Escalacao)
    Escalacao.atribuir([...t.players], slots).forEach(({pos,p})=>{
      if(p){ posEscala[p.numero]=pos; roleEscala[p.numero]=ROLES_POS[pos][0]; usados.add(p.numero); } });
    // banco: próximos 12 melhores (por força), o resto fica FORA
    const resto=t.players.filter(p=>!usados.has(p.numero)).sort((a,b)=>b.forca-a.forca);
    resto.forEach((p,idx)=>{ posEscala[p.numero]= idx<12 ? 'BANCO' : 'FORA'; });
    return {formacao, estilo:'normal', marcacao:'leve', posEscala, roleEscala};
