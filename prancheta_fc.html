  // fluxo de negociação de COMPRA (MVP com prompt; refino visual depois)
  negociarCompraUI(pid){
    const ti=this.timeDoJogador(pid); if(ti<0) return;
    const p=this.teams[ti].players.find(x=>x.pid===pid);
    const vm=this.valorMercadoReais(p);
    const meuSaldo=this.teams[this.myTeam].saldo||0;
    const sugestao=(vm/1e6).toFixed(0);
    const mg=Motor.melhorGeral(p);
    const mNeg=this.modalFLK({
      titulo:'💼 Negociar contratação',
      corpoHTML:this.cartaoDecisao({
        topo:{escudo:this.escudoHTML(this.teams[ti],40), nome:this.esc(p.nome), sub:`${this.esc(this.teams[ti].nome)} · ${mg.pos} · ${p.idade||'–'} anos`},
        destaque:{rotulo:'Valor de mercado', titulo:this.fmtReais(vm), desc:`força ${mg.ov} · salário ${this.fmtm(p.salario)}/mês`},
        kpis:[
          {rotulo:'Seu caixa', valor:this.fmtReais(meuSaldo), cor:meuSaldo<vm?'var(--loss)':'var(--lemon)'},
          {rotulo:'Caixa depois', valor:this.fmtReais(meuSaldo-Math.round(+sugestao*1e6)), id:'mfCaixaDepois'},
        ],
      }),
      campos:[{id:'oferta', label:'Sua oferta (em milhões)', tipo:'number', valor:sugestao}],
      botoes:[
        {txt:'Desistir', tipo:'sm'},
        {txt:'Fazer proposta', tipo:'sm primary', onClick:(v)=>{
          const oferta=Math.round(parseFloat(String(v.oferta).replace(',','.'))*1e6);
          if(!(oferta>0)){ this.avisoFLK('Oferta inválida','Digite um valor em milhões (ex: 30).','var(--loss)',{onClose:()=>this.negociarCompraUI(pid)}); return false; }
          if((this.teams[this.myTeam].saldo||0)<oferta){ this.avisoFLK('Saldo insuficiente','Você não tem caixa para essa oferta.','var(--loss)',{onClose:()=>this.negociarCompraUI(pid)}); return false; }
          const r=this.avaliarOfertaCompra(pid, oferta);
          if(r.decisao==='aceita'){
            const res=this.executarTransferencia(pid, this.myTeam, oferta);
            if(res.ok){ this.salvarSupabase(true); this.renderShell(); this.showTab('mercado'); }
            this.avisoFLK(res.ok?'✅ Negócio fechado':'❌ Falhou', res.ok?`${r.fala}<br><br>${res.msg}`:res.msg, res.ok?'var(--lemon)':'var(--loss)');
          } else if(r.decisao==='recusa'){
            this.avisoFLK('❌ Proposta recusada', r.fala,'var(--loss)');
          } else {
            // contraproposta: novo modal de decisão
            const cx=this.teams[this.myTeam].saldo||0;
            this.modalFLK({
              titulo:'🔁 Contraproposta',
              corpoHTML:this.cartaoDecisao({
                topo:{escudo:this.escudoHTML(this.teams[ti],40), nome:this.esc(this.teams[ti].nome), sub:`sobre ${this.esc(p.nome)}`},
                fala:`“${r.fala}”`,
                destaque:{rotulo:'Eles pedem', titulo:this.fmtReais(r.contra), desc:`Sua oferta foi ${this.fmtReais(oferta)}.`},
                kpis:[{rotulo:'Seu caixa', valor:this.fmtReais(cx)},
                      {rotulo:'Caixa depois', valor:this.fmtReais(cx-r.contra), cor:cx<r.contra?'var(--loss)':'var(--lemon)'}],
              }),
              botoes:[
                {txt:'Recusar', tipo:'sm'},
                {txt:'Aceitar', tipo:'sm primary', onClick:()=>{
                  if((this.teams[this.myTeam].saldo||0)<r.contra){ this.avisoFLK('Saldo insuficiente','Caixa insuficiente para a contraproposta.','var(--loss)'); return false; }
                  const res=this.executarTransferencia(pid, this.myTeam, r.contra);
                  if(res.ok){ this.salvarSupabase(true); this.renderShell(); this.showTab('mercado'); }
                  this.avisoFLK(res.ok?'✅ Fechado!':'❌ Falhou', res.ok?res.msg:res.msg, res.ok?'var(--lemon)':'var(--loss)');
                  return false;
                }},
              ],
            });
          }
          return false;
        }},
      ],
    });
    const inp=mNeg.el&&mNeg.el.querySelector('#flkm_oferta'), out=mNeg.el&&mNeg.el.querySelector('#mfCaixaDepois');
    if(inp&&out) inp.oninput=()=>{ const v=Math.round(parseFloat(String(inp.value).replace(',','.'))*1e6)||0;
      const d=meuSaldo-v; out.textContent=this.fmtReais(d); out.style.color=d<0?'var(--loss)':'var(--lemon)'; };
    if(inp) inp.oninput&&inp.oninput();
  },
  // aceitar/recusar oferta recebida (UI). Aceitar SEMPRE passa pelo modal de decisão.
  aceitarOfertaUI(pid, aceitar){
    if(aceitar) return this.decidirVendaUI(pid);
    this.responderOferta(pid, false);
    this.salvarSupabase(true); this.renderShell(); this.showTab('mercado');
  },
  /* ---------- CONFIANÇA: histórico + explicação (fórmula visível) ---------- */
  // toda mudança de confiança passa por aqui, pra o jogador ver o PORQUÊ
  mudarConfianca(d, motivo){
    if(this.confianca==null) this.confianca=this.CONF_INICIAL;
    const antes=this.confianca;
    this.confianca=Math.max(0,Math.min(100,this.confianca+d));
    const real=Math.round((this.confianca-antes)*10)/10;
    if(real){ if(!Array.isArray(this.histConf)) this.histConf=[];
      this.histConf.push({t:this.temporada||1, r:this.rodada, d:real, m:String(motivo||'')});
      if(this.histConf.length>12) this.histConf=this.histConf.slice(-12); }
    return real;
  },
  ROTULO_EXP:{favorito:'como favorito', ligeiro:'como ligeiro favorito', equilibrado:'em jogo equilibrado', azarao:'como azarão', impossivel:'como zebra'},
  limiarReuniao(){ return Math.min(90, this.corteDemissao()+15); },
  explicarConfiancaHTML(){
    const M=this.MATRIZ_CONF, f=v=>(v>0?'+':'')+v;
    const hist=(this.histConf||[]).slice(-5).reverse();
    return `<div class="conf-exp">
      <div class="conf-exp-h">O que mexe na confiança</div>
      <table class="conf-mat"><thead><tr><th class="l">Você era…</th><th>Vitória</th><th>Empate</th><th>Derrota</th></tr></thead><tbody>
        ${[['favorito','Favorito'],['equilibrado','Equilibrado'],['azarao','Azarão']].map(([k,l])=>`<tr><td class="l">${l}</td>${['v','e','d'].map(r=>`<td class="${M[k][r]>0?'b':M[k][r]<0?'r':''}">${f(M[k][r])}</td>`).join('')}</tr>`).join('')}
      </tbody></table>
      <div class="conf-exp-sub">Também contam a <b>meta da diretoria</b> no fim da temporada e as respostas na <b>coletiva</b>. Demissão se cair até <b>${this.corteDemissao()}</b>.</div>
      ${hist.length?`<div class="mf-lista">${hist.map(h=>`<div><b>${this.esc(h.m)}</b><span style="color:${h.d>0?'var(--lemon)':'var(--loss)'}">${f(h.d)}</span></div>`).join('')}</div>`:''}
    </div>`;
  },
  abrirExplicacaoConfianca(){
    this.modalFLK({titulo:'Segurança no cargo', corpoHTML:`<div class="mf">
        <div class="mf-kpis n2"><div class="mf-kpi"><small>Confiança</small><b>${Math.round(this.confianca??this.CONF_INICIAL)}/100</b></div>
          <div class="mf-kpi"><small>Demissão em</small><b style="color:var(--loss)">${this.corteDemissao()}</b></div></div>
        ${this.explicarConfiancaHTML()}</div>`,
      botoes:[{txt:'Entendido',tipo:'primary'}]});
  },

  /* ---------- REUNIÃO COM A DIRETORIA (§6.1 item 2) ----------
     Quando a confiança cai até a zona de alerta (corte + 15), o presidente chama
     uma reunião ANTES da demissão: 2 perguntas. Na 1ª a diretoria CONFERE a
     desculpa contra os fatos (força do elenco na série, nota recente do time) —
     honestidade vale. Na 2ª o treinador escolhe o plano (pedir prazo = ultimato). */
  checarReuniao(){
    if(this.demitido) return;
    const conf=this.confianca??this.CONF_INICIAL, lim=this.limiarReuniao();
    if(conf>lim+10) this._reuniaoFeita=false;              // saiu da crise: próxima crise tem reunião de novo
    if(conf<=lim && !this._reuniaoFeita && !this.ultimato){ this._reuniaoFeita=true; this.abrirReuniao(); }
  },
  fatosReuniao(){
    // compara com quem disputa a mesma tabela (grupo na Série D, a série inteira nas outras)
    const idxs=this.grupoDe(this.myTeam)||this.indicesDaDivisao(this.divisao);
    const ranking=[...idxs].sort((a,b)=>this.forcaDoTime(b)-this.forcaDoTime(a));
    const rank=ranking.indexOf(this.myTeam)+1, n=ranking.length;
    const notas=this.teams[this.myTeam]._notas5||[], media=Forma.media(notas);
    return {rank, n, elencoFraco:rank>Math.ceil(n/2), notaMedia:media, faseBoa:media!=null && media>=6.0};
  },
  VERBA_REUNIAO:{A:8e6,B:4e6,C:2e6,D:1e6},
  abrirReuniao(){
    const t=this.teams[this.myTeam], fatos=this.fatosReuniao(), lim=this.limiarReuniao();
    const verba=this.VERBA_REUNIAO[this.divisao]||1e6, f=v=>(v>0?'+':'')+v;
    const P1=[
      {perfil:'Elenco', txt:'O elenco não tem nível pra essa meta.', ok:fatos.elencoFraco, dOk:+4, dNao:-3,
        fato:`seu elenco é o ${fatos.rank}º mais forte de ${fatos.n} na ${this.grupoDe(this.myTeam)?'chave':'série'}`},
      {perfil:'Fase', txt:'É fase ruim. O time joga melhor do que os resultados mostram.', ok:fatos.faseBoa, dOk:+3, dNao:-3,
        fato:fatos.notaMedia!=null?`nota média recente do time: ${fatos.notaMedia.toFixed(1)} (precisa ≥ 6,0)`:'o time ainda não tem notas recentes'},
      {perfil:'Culpa', txt:'A responsabilidade é minha. Eu vou corrigir.', ok:true, dOk:+1, dNao:+1, fato:'a diretoria valoriza a franqueza'},
    ];
    const P2=[
      {perfil:'Prazo', txt:'Me deem 3 rodadas. Se não melhorar, eu mesmo saio.', ultimato:true, d:+6,
        selos:[{t:'cargo +6 agora',b:1},{t:`⚠️ em 3 rodadas precisa estar acima de ${lim}, senão demissão`,r:1}]},
      {perfil:'Reforços', txt:'Preciso de reforços. Libere verba pro mercado.', verba, d:-2,
        selos:[{t:`+${this.fmtReais(verba)} de verba`,b:1},{t:'cargo −2',r:1}]},
      {perfil:'Continuidade', txt:'O trabalho está certo. Vamos manter o caminho.', d:0, selos:[{t:'sem efeito',n:1}]},
    ];
    const tot={d:0};
    const topo=()=>`<div class="mf-top"><span class="col-mic">🤵</span><div><div class="mf-nome">Presidente do ${this.esc(t.nome)}</div>
        <div class="mf-sub">Reunião de emergência · Série ${this.divisao} · Rodada ${this.rodada}</div></div></div>
      <div class="mf-kpis n2"><div class="mf-kpi"><small>Confiança</small><b style="color:var(--loss)">${Math.round(this.confianca??this.CONF_INICIAL)}/100</b></div>
        <div class="mf-kpi"><small>Demissão em</small><b>${this.corteDemissao()}</b></div></div>`;
    const passo2=()=>({titulo:'🏛️ Reunião com a diretoria', fechavel:false,
      corpoHTML:`<div class="mf">${topo()}
        <div class="mf-destaque alerta"><small>Pergunta 2 de 2</small><b class="col-q">“E qual é o plano daqui pra frente?”</b></div>
        <div class="col-resps">${P2.map((r,i)=>`<button class="col-resp" data-resp="${i}"><small>${r.perfil}</small><span>“${this.esc(r.txt)}”</span>
          <em>${r.selos.map(x=>`<i class="${x.n?'n':x.b?'b':'r'}">${x.t}</i>`).join('')}</em></button>`).join('')}</div></div>`,
      botoes:[],
      aoAbrir:(el)=>el.querySelectorAll('[data-resp]').forEach(b=>b.onclick=()=>{
        const r=P2[+b.dataset.resp];
        if(r.d) tot.d+=this.mudarConfianca(r.d,'Reunião: '+r.perfil.toLowerCase());
        if(r.ultimato) this.ultimato={rodadaLimite:this.rodada+3, limiar:lim, temporada:this.temporada};
        if(r.verba){ t.saldo=(t.saldo||0)+r.verba; this.addExtrato('Verba da diretoria (reunião)', +r.verba); }
        this.salvarSupabase&&this.salvarSupabase(true); this.renderShell(); if(!this.liveState) this.showTab('escala');
        const msg=r.ultimato?`Você tem até a rodada ${this.ultimato.rodadaLimite} pra deixar a confiança acima de ${lim}.`
          : r.verba?`A diretoria liberou ${this.fmtReais(r.verba)} pro mercado. Use bem.`
          : 'A diretoria vai acompanhar de perto.';
        this.modalFLK({titulo:'Fim da reunião', corpoHTML:this.cartaoDecisao({
            destaque:{rotulo:'Resultado da reunião', titulo:`Confiança ${f(Math.round(tot.d))}`, desc:msg, tom:tot.d<0?'alerta':''},
            kpis:[{rotulo:'Confiança agora', valor:`${Math.round(this.confianca)}/100`},{rotulo:'Demissão em', valor:String(this.corteDemissao())}]}),
          botoes:[{txt:'Voltar ao trabalho',tipo:'primary'}]});
      })});
    this.modalFLK({titulo:'🏛️ Reunião com a diretoria', fechavel:false, fila:true,
      corpoHTML:`<div class="mf">${topo()}
        <p class="mf-fala">🤵 “Professor, os resultados preocupam. A diretoria quer entender o que está acontecendo.”</p>
        ${this.explicarConfiancaHTML()}
        <div class="mf-destaque alerta"><small>Pergunta 1 de 2</small><b class="col-q">“Por que os resultados pioraram?”</b></div>
        <div class="col-resps">${P1.map((r,i)=>`<button class="col-resp" data-resp="${i}"><small>${r.perfil}</small><span>“${this.esc(r.txt)}”</span>
          <em><i class="n">a diretoria confere: ${r.fato}</i>${r.dOk===r.dNao?`<i class="b">cargo ${f(r.dOk)}</i>`:`<i class="b">${f(r.dOk)} se for verdade</i><i class="r">${f(r.dNao)} se não for</i>`}</em></button>`).join('')}</div></div>`,
      botoes:[],
      aoAbrir:(el)=>el.querySelectorAll('[data-resp]').forEach(b=>b.onclick=()=>{
        const r=P1[+b.dataset.resp]; const d=r.ok?r.dOk:r.dNao;
        tot.d+=this.mudarConfianca(d,'Reunião: '+(r.ok?'argumento aceito':'desculpa não colou'));
        this.modalFLK(passo2());
      })});
  },

  /* ---------- COLETIVA PÓS-JOGO (UI) ---------- */
  contextoColetiva(){
    const j=this._ultimoJogo; if(!j) return null;
    const t=this.teams[this.myTeam];
    const onze=new Set(this.onzeDe(this.myTeam).map(p=>p.numero));
    const insat=t.players.filter(p=>!onze.has(p.numero) && Rating.moralDe(p)<40).sort((a,b)=>Rating.moralDe(a)-Rating.moralDe(b))[0];
    const cls=this.classificacao(), idx=cls.findIndex(s=>s.i===this.myTeam);
    const obj=this.garantirObjetivos&&this.garantirObjetivos();
    return {...j, craque:this._craqueRodada||null, insatisfeito:insat?{nome:insat.nome, numero:insat.numero}:null,
      posicao:idx+1, zonaBoa:idx>=0 && idx+1<=Math.max(1,Math.ceil(cls.length*0.3)),
      pressao:(this.confianca??this.CONF_INICIAL)<50, meta:(obj&&obj.principal&&obj.principal.titulo)||'a meta'};
  },
  moralMediaTime(){ const ps=this.teams[this.myTeam].players; return Math.round(ps.reduce((a,p)=>a+Rating.moralDe(p),0)/Math.max(1,ps.length)); },
  aplicarRespostaColetiva(r, alvoNum){
    const t=this.teams[this.myTeam], cl=v=>Math.max(0,Math.min(100,Math.round(v*10)/10));
    if(r.moral) t.players.forEach(p=>{ p.moral=cl(Rating.moralDe(p)+r.moral); });
    if(r.moralAlvo && alvoNum!=null){ const p=t.players.find(x=>x.numero===alvoNum); if(p) p.moral=cl(Rating.moralDe(p)+r.moralAlvo); }
    if(r.cargo) this.mudarConfianca(r.cargo,'Coletiva: '+(r.perfil||'resposta').toLowerCase());
  },
  abrirColetiva(){
    if(!this.garantirOpcoes().coletiva) return;
    const ctx=this.contextoColetiva(); if(!ctx) return;
    const col=Coletiva.montar(ctx); if(!col.perguntas.length) return;
    const t=this.teams[this.myTeam], tot={moral:0, cargo:0, alvo:0};
    const passo=(k)=>{
      const q=col.perguntas[k]; const nomeAlvo=q.alvo!=null?(t.players.find(p=>p.numero===q.alvo)||{}).nome:null;
      const conf=Math.round(this.confianca??this.CONF_INICIAL), mor=this.moralMediaTime();
      const corpo=`<div class="mf">
        <div class="mf-top"><span class="col-mic">🎤</span><div><div class="mf-nome">${this.esc(col.reporter[0])}</div>
          <div class="mf-sub">${this.esc(col.reporter[1])} · ${ctx.meus}×${ctx.deles} vs ${this.esc(ctx.adv)}</div></div></div>
        <div class="mf-kpis n2"><div class="mf-kpi"><small>Moral do time</small><b>${mor}/100</b></div>
          <div class="mf-kpi"><small>Segurança no cargo</small><b>${conf}/100</b></div></div>
        <div class="mf-destaque"><small>Pergunta ${k+1} de ${col.perguntas.length} · ${q.tema}</small><b class="col-q">“${this.esc(q.txt)}”</b></div>
        <div class="col-resps">${q.respostas.map((r,i)=>`<button class="col-resp" data-resp="${i}">
            <small>${r.perfil}</small><span>“${this.esc(r.txt)}”</span>
            <em>${Coletiva.selos(r, nomeAlvo&&nomeAlvo.split(' ')[0]).map(x=>`<i class="${x.neutro?'n':x.bom?'b':'r'}">${x.t}</i>`).join('')}</em></button>`).join('')}</div>
      </div>`;
      return {titulo:'🎤 Coletiva pós-jogo', corpoHTML:corpo,
        botoes:[{txt:'⏩ Pular a coletiva', tipo:'sm'}],
        aoAbrir:(el)=>{ el.querySelectorAll('[data-resp]').forEach(b=>b.onclick=()=>{
          const r=q.respostas[+b.dataset.resp]; this.aplicarRespostaColetiva(r,q.alvo);
          tot.moral+=r.moral||0; tot.cargo+=r.cargo||0; tot.alvo+=r.moralAlvo||0;
          if(k+1<col.perguntas.length) this.modalFLK(passo(k+1));
          else { const m=document.getElementById('flkModal'); if(m) m.remove(); this.fimColetiva(tot); this._proximoDaFila(); }
        }); }};
    };
    this.modalFLK({...passo(0), fila:true});
  },
  fimColetiva(tot){
    const f=v=>(v>0?'+':'')+v;
    this.renderShell(); if(!this.liveState) this.showTab('escala');
    Tutorial.toast(`🎤 Coletiva encerrada · moral <b>${f(tot.moral)}</b> · cargo <b>${f(tot.cargo)}</b>`);
  },

  // propostas que chegaram nesta rodada viram modais de decisão (em fila)
  avisarPropostasNovas(){
    (this.ofertasRecebidas||[]).filter(o=>!o.avisada).forEach(o=>{ o.avisada=true; this.decidirVendaUI(o.pid,{fila:true, nova:true}); });
  },
  // modal de decisão de venda: quem quer, quanto, impacto no caixa/folha/escalação
  decidirVendaUI(pid, op){
    op=op||{};
    const o=(this.ofertasRecebidas||[]).find(x=>x.pid===pid); if(!o) return;
    const t=this.teams[this.myTeam], p=t.players.find(x=>x.pid===pid); if(!p) return;
    const comprador=this.teams[o.de];
    const vm=this.valorMercadoReais(p), caixa=t.saldo||0;
    const pos=this.posDe(this.myTeam,p.numero), titular=pos!=='BANCO'&&pos!=='FORA';
    const mg=Motor.melhorGeral(p);
    const pct=vm>0?Math.round(o.valor/vm*100):100;
    const fim=()=>{ this.salvarSupabase(true); this.renderShell(); if(!op.fila) this.showTab('mercado'); };
    this.modalFLK({fila:!!op.fila, titulo:op.nova?'📨 Proposta recebida':'Vender jogador?',
      corpoHTML:this.cartaoDecisao({
        topo:{escudo:this.escudoHTML(comprador,40), nome:this.esc(o.deNome), sub:`quer contratar · Série ${comprador.divisao}`},
        destaque:{rotulo:titular?'Titular do seu time':'Jogador à venda', titulo:this.esc(p.nome),
          desc:`${mg.pos} · força ${p.forca} · ${p.idade||'–'} anos · salário ${this.fmtm(p.salario)}/mês`},
        kpis:[
          {rotulo:'Oferta', valor:this.fmtReais(o.valor), cor:pct>=100?'var(--lemon)':pct>=90?'#e8c547':'var(--loss)'},
          {rotulo:'Valor de mercado', valor:this.fmtReais(vm)},
          {rotulo:'Caixa depois', valor:this.fmtReais(caixa+o.valor), cor:'var(--lemon)'},
          {rotulo:'Oferta × valor', valor:pct+'%'},
        ],
        aviso:titular?`⚠️ ${this.esc(p.nome.split(' ')[0])} é titular e sai da escalação se você vender.`:'',
      }),
      botoes:[
        {txt:'Recusar', tipo:'sm', onClick:()=>{ this.responderOferta(pid,false); fim(); }},
        ...(op.fila?[{txt:'Decidir depois', tipo:'sm'}]:[]),
        {txt:'Aceitar venda', tipo:'primary', onClick:()=>{
          const r=this.responderOferta(pid,true); fim();
          this.avisoFLK(r.ok?'✅ Venda concluída':'❌ Não deu', r.msg, r.ok?'var(--lemon)':'var(--loss)');
        }},
      ]});
  },

  /* ---------- ESTATÍSTICAS DA TEMPORADA (A2) ----------
     Agrega jogadores da MINHA divisão a partir de dados que já existem
     (golsTemp do motor, notas do A1). Tudo re-derivável — nada persistido novo. */

  // todos os jogadores da minha divisão, com o time anexado, para rankings
  _jogadoresDaMinhaDivisao(){
    const div=this.divisao;
    const out=[];
    this.indicesDaDivisao(div).forEach(ti=>{
      const t=this.teams[ti]; if(!t) return;
      t.players.forEach(p=>out.push({p, ti, timeNome:t.nome, timeAbrev:t.abrev}));
    });
    return out;
  },
  // top artilheiros da temporada (gols > 0), maior primeiro
  topArtilheiros(n=10){
    return this._jogadoresDaMinhaDivisao()
      .filter(o=>(o.p.golsTemp||0)>0)
      .sort((a,b)=>(b.p.golsTemp||0)-(a.p.golsTemp||0) || (b.p._somaNotas||0)-(a.p._somaNotas||0))
      .slice(0,n);
  },
  // líderes de assistência da temporada (assistTemp > 0)
  topAssistencias(n=10){
    return this._jogadoresDaMinhaDivisao()
      .filter(o=>(o.p.assistTemp||0)>0)
      .sort((a,b)=>(b.p.assistTemp||0)-(a.p.assistTemp||0) || (b.p.golsTemp||0)-(a.p.golsTemp||0))
      .slice(0,n);
  },
  // melhores notas médias da temporada (mínimo de jogos pra evitar amostra pequena)
  topNotas(n=10, minJogos=3){
    return this._jogadoresDaMinhaDivisao()
      .filter(o=>(o.p._qtdNotas||0)>=minJogos)
      .map(o=>({...o, media:o.p._somaNotas/o.p._qtdNotas}))
      .sort((a,b)=>b.media-a.media)
      .slice(0,n);
  },
  // craque da última rodada do MEU time (setado no encerrarRodada)
  craqueDaRodada(){ return this._craqueRodada||null; },

  // A2: sparkline SVG de uma série numérica (sem libs). vals = array de números.
  sparkline(vals, cor){
    const n=vals.length;
    if(n<2) return '<div style="color:var(--muted);font-size:.85em;padding:8px 0">Um gráfico aparece a partir da 2ª temporada.</div>';
    const W=260,H=54,pad=4;
    const min=Math.min(...vals), max=Math.max(...vals), amp=(max-min)||1;
    const x=i=>pad+i*(W-2*pad)/(n-1);
    const y=v=>H-pad-((v-min)/amp)*(H-2*pad);
    const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const c=cor||'var(--lemon)';
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block">
      <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(n-1).toFixed(1)}" cy="${y(vals[n-1]).toFixed(1)}" r="3" fill="${c}"/>
    </svg>`;
  },

  /* ---------- OBJETIVOS (A3) ---------- */
  garantirObjetivos(){
    if(!this.objetivos || this.objetivos.div!==this.divisao){
      this.objetivos=Objetivos.novaTemporada(this.divisao);
    }
    return this.objetivos;
  },
  registrarEventosObjetivos(ev){
    const o=this.garantirObjetivos();
    o.sec.forEach(s=>{
      if(s.feito) return;
      let inc=0;
      switch(s.ev){
        case 'vitCasa': if(ev.resultado==='v' && ev.souCasa) inc=1; break;
        case 'vitoria': if(ev.resultado==='v') inc=1; break;
        case 'gols':    inc=ev.meusGols||0; break;
        case 'clean':   if(ev.golsAdv===0) inc=1; break;
        case 'invicto': if(ev.resultado==='d'){ s.prog=0; } else { s.prog=(s.prog||0)+1; }
          if(s.prog>=s.meta) this.concluirObjetivoSec(s);
          return;
      }
      if(inc>0){ s.prog=Math.min(s.meta,(s.prog||0)+inc); if(s.prog>=s.meta) this.concluirObjetivoSec(s); }
    });
  },
  concluirObjetivoSec(s){
    if(s.feito) return;
    s.feito=true; s.prog=s.meta;
    const t=this.teams[this.myTeam]; if(t){ t.saldo=(t.saldo||0)+s.premioBase; this.addExtrato('Objetivo: '+s.titulo, +s.premioBase); }
    if(!Array.isArray(this._objetivosConcluidos)) this._objetivosConcluidos=[];
    this._objetivosConcluidos.push({id:s.id, titulo:s.titulo, premio:s.premioBase});
  },
  // gancho de AD (Bloco B): dobra o prêmio de um objetivo já concluído, uma vez
  /* ---------- ANÚNCIOS RECOMPENSADOS (Bloco B) ----------
     mostrarAnuncio é o ÚNICO ponto de integração de ad do jogo. Hoje é um
     placeholder (modal de confirmação). Quando o SDK entrar (AdMob/rewarded),
     só este método muda: dispara o ad real e chama onRecompensa apenas no
     callback de "recompensa concedida"; onCancelar se o usuário fecha antes.
     Quem removeu anúncios (adFree) NUNCA vê ad — recebe a recompensa direto. */
  mostrarAnuncio({titulo, descricao, onRecompensa, onCancelar}){
    if(this.semAnuncios()){ onRecompensa&&onRecompensa(); return; }  // comprou: sem ad, recompensa direta
    if(this.modalFLK){
      this.modalFLK({ titulo:titulo||'▶ Assistir anúncio',
        corpoHTML:`<p style="line-height:1.6">${descricao||'Assista a um anúncio curto para receber a recompensa.'}</p>
          <p style="color:var(--muted);font-size:.85em">Recompensa opcional — nunca obrigatória.</p>
          <p style="color:var(--muted);font-size:.75em;margin-top:8px">⚠️ Placeholder: o anúncio real entra com o empacotamento (loja).</p>`,
        botoes:[
          {txt:'Assistir e receber', tipo:'primary', onClick:()=>{ onRecompensa&&onRecompensa(); return false; }},
          {txt:'Agora não', tipo:'sm', onClick:()=>{ onCancelar&&onCancelar(); return false; }}
        ] });
    } else { onRecompensa&&onRecompensa(); }
  },
  resgatarBonusAd(secId){
    const o=this.garantirObjetivos(); const s=o.sec.find(x=>x.id===secId);
    if(!s || !s.feito || s.adUsado) return false;
    s.adUsado=true;
    const t=this.teams[this.myTeam]; if(t){ t.saldo=(t.saldo||0)+s.premioBase; this.addExtrato('Bônus 2x'+(this.semAnuncios()?'':' (anúncio)')+': '+s.titulo, +s.premioBase); }
    return true;
  },
  // dobra o prêmio de um objetivo concluído: via ad (grátis) ou direto (adFree).
  assistirAnuncioBonus(secId){
    const o=this.garantirObjetivos(); const s=o.sec.find(x=>x.id===secId);
    if(!s || !s.feito || s.adUsado) return;
    this.mostrarAnuncio({
      titulo:'▶ Dobrar prêmio',
      descricao:`Dobre o prêmio de "${this.esc(s.titulo)}" — mais <b>${this.fmtM(s.premioBase/1e6)}</b> no seu caixa.`,
      onRecompensa:()=>{ if(this.resgatarBonusAd(secId)){
        this.salvarSupabase&&this.salvarSupabase(true); this.renderCompeticoes(); this.renderFinancas&&this.renderFinancas();
        this.avisoFLK&&this.avisoFLK('🎁 Bônus em dobro!', `Prêmio de "${s.titulo}" dobrado: +${this.fmtM(s.premioBase/1e6)}.`, 'var(--lemon)'); } }
    });
  },
  avaliarPrincipal(destino){
    const o=this.garantirObjetivos(); const P=o.principal; if(!P || o.principalStatus!=='aberto') return null;
    const eu=this.myTeam;
    const subi = destino && destino.sobem && destino.sobem.includes(eu);
    const cai  = destino && destino.caem  && destino.caem.includes(eu);
    let ok=false;
    if(P.id==='ficar_a')       ok = !cai;
    else if(P.id==='subir_d')  ok = subi;
    else                       ok = subi;
    o.principalStatus = ok?'cumprido':'falhou';
    this.mudarConfianca(ok?P.confOk:P.confFail, ok?'Meta da diretoria cumprida':'Meta da diretoria não cumprida');
    if(ok){ const t=this.teams[eu]; if(t){ t.saldo=(t.saldo||0)+P.premio; this.addExtrato('Meta da diretoria: '+P.titulo, +P.premio); } }
    return {ok, premio:ok?P.premio:0, titulo:P.titulo};
  },

  // A2: retrato do meu clube nesta temporada (pra série histórica)
  retratoClube(){
    const t=this.teams[this.myTeam]; if(!t) return null;
    const jog=t.players||[];
    const ovs=jog.map(p=>Rating.overallGlobal(p)).filter(v=>v>0);
    const ovMedio = ovs.length ? Math.round(ovs.reduce((a,b)=>a+b,0)/ovs.length) : 0;
    const valorElenco = jog.reduce((a,p)=>a+(this.valorDe?this.valorDe(p):0),0);
    return { temporada:this.temporada||1, divisao:this.divisao,
             saldo:Math.round(t.saldo||0), valorElenco:Math.round(valorElenco), ovMedio };
  },
  // registra o retrato no histórico (idempotente por temporada)
  registrarHistoricoClube(){
    const r=this.retratoClube(); if(!r) return;
    if(!Array.isArray(this.histClube)) this.histClube=[];
    if(this.histClube.some(h=>h.temporada===r.temporada)) return; // já registrado
    this.histClube.push(r);
    if(this.histClube.length>50) this.histClube=this.histClube.slice(-50); // teto
  },

        }).join('')}</div>`;

          ${hist.map(f=>`<div class="cmp-ko-fase">

            ${f.confrontos.map((cf,k)=>`<div class="cmp-ko-cf ${cf.includes(this.myTeam)?'eu':''}">
              ${f.vencedores[k]===cf[0]?`<b>${nome(cf[0])}</b>`:nome(cf[0])} ×
              ${f.vencedores[k]===cf[1]?`<b>${nome(cf[1])}</b>`:nome(cf[1])}
            </div>`).join('')}
          </div>`).join('')}
          ${mm&&mm.confrontos&&this.fase==='ko'?`<div class="cmp-ko-fase" style="border-color:var(--lemon)">
            <div class="cmp-ko-h">${mm.faseNome} · em disputa</div>
            ${mm.confrontos.map(cf=>`<div class="cmp-ko-cf ${cf.includes(this.myTeam)?'eu':''}">${nome(cf[0])} × ${nome(cf[1])}</div>`).join('')}
          </div>`:''}
          ${mm&&mm.campeao!=null?`<div class="cmp-ko-fase" style="border-color:var(--lemon)">
            <div class="cmp-ko-h">🏆 Campeão</div>
            <div class="cmp-ko-cf ${mm.campeao===this.myTeam?'eu':''}"><b>${nome(mm.campeao)}</b></div>

        </div>

          <span class="cmp-pos">${pos+1}º</span><span class="cmp-nome">${this.teams[s.i].nome}${flag(s.i)}</span>
          <span class="cmp-j">${s.j}j</span><span class="cmp-pts">${s.pts}</span></div>`).join('')}
      </div></div>`;
      return;
    }
    if(aba==='stats'){
      const arts=this.topArtilheiros(10);

      // A3: painel de objetivos da temporada

  /* ============ FIM DE TEMPORADA ============ */
  /* ---------- OUTRAS DIVISÕES (simulação leve, só para acompanhar) ----------
     Carrega apenas a lista de clubes das outras séries (sem jogadores) e simula
     os resultados a partir de uma força-base. Barato e suficiente para exibição. */
  // simula UM confronto (usando a força REAL dos onzes) e devolve o placar
  simularConfrontoReal(h, a){
    // Fase 0: mando percentual (+7%), coerente com o motor real.
    const fh=this.forcaBaseTime(h)*(1+Motor.MANDO_PCT), fa=this.forcaBaseTime(a);
    const tot=Math.max(1,fh+fa);
    const gc=this.poisson((fh/tot)*2.6), gf=this.poisson((fa/tot)*2.6);
    return {gc, gf};
  },
  // avança UMA rodada de cada liga que NÃO é a do usuário (elencos reais).
  // Trata pontos corridos e, na Série D, a fase de grupos + mata-mata.
  simularOutrasDivisoes(){
    if(!this.ligas) return;
    Object.values(this.ligas).forEach(liga=>{
      if(liga.div===this.divisao) return;            // a do usuário é jogada de verdade
      this.avancarRodadaLiga(liga);
    });
  },
  // roda a próxima rodada pendente de uma liga (auto-simulada)
  avancarRodadaLiga(liga){
    if(liga.rodada < liga.fixtures.length){
      const jogos=liga.fixtures[liga.rodada]||[];
      const statOf=i=>liga.stats.find(s=>s.i===i);
      jogos.forEach(([h,a])=>{
        const {gc,gf}=this.simularConfrontoReal(h,a);
        if(liga.fase!=='ko'){
          const H=statOf(h), A=statOf(a); if(!H||!A) return;
          H.j++;A.j++; H.gp+=gc;H.gc+=gf; A.gp+=gf;A.gc+=gc;
          if(gc>gf){H.v++;A.d++;H.pts+=3;} else if(gf>gc){A.v++;H.d++;A.pts+=3;} else {H.e++;A.e++;H.pts++;A.pts++;}
        } else if(liga.mataMata){
          (liga.mataMata.resultados||(liga.mataMata.resultados=[])).push({h,a,gc,gf});
        }
      });
      liga.rodada++;
    }
    // acabaram as rodadas atuais → se é formato de grupos, avança de fase
    if(liga.rodada>=liga.fixtures.length && liga.formato.tipo==='grupos' && liga.fase!=='fim'){
      this.avancarFaseLiga(liga);
    }
  },
  // avanço de fase (grupos→mata-mata→...→campeão) de uma liga auto-simulada da Série D
  avancarFaseLiga(liga){
    const f=liga.formato;
    if(liga.fase==='grupos'){
      const pares=Competicao.montarMataMata(liga.grupos, liga.stats, i=>this.teams[i].nome, f.avancamPorGrupo);
      this.iniciarFaseKOLiga(liga, pares);
      return;
    }
    if(liga.fase==='ko' && liga.mataMata){
      const mm=liga.mataMata, venc=[], perd=[];
      mm.confrontos.forEach(cf=>{
        const jogos=(mm.resultados||[]).filter(r=>(r.h===cf[0]&&r.a===cf[1])||(r.h===cf[1]&&r.a===cf[0]));
        const r=Competicao.vencedorDoConfronto(cf[0],cf[1],jogos);
        venc.push(r.vencedor); perd.push(r.perdedor);
      });
      mm.historico=mm.historico||[];
      mm.historico.push({fase:Competicao.nomeFase(mm.confrontos.length*2), confrontos:mm.confrontos, vencedores:venc, perdedores:perd});
      if(mm.confrontos.length===4){ mm.eliminadosQuartas=perd; mm.semifinalistas=venc; }
      if(venc.length<=1){
        mm.campeao=venc[0]??null;
        const ac=Competicao.acessosSerieD(mm.semifinalistas||[], mm.eliminadosQuartas||[]);
        const repVenc=(ac.repescagem||[]).map(([x,y])=>
          Math.random()<(this.forcaDoTime(x)/(this.forcaDoTime(x)+this.forcaDoTime(y)))?x:y);
        mm.sobem=[...(mm.semifinalistas||[]), ...repVenc].slice(0,f.acessos);
        liga.fase='fim'; return;
      }
      const pares=[]; for(let i=0;i<venc.length;i+=2) pares.push([venc[i],venc[i+1]]);
      this.iniciarFaseKOLiga(liga, pares, mm);
    }
  },
  iniciarFaseKOLiga(liga, pares, mmAnterior){
    const ida=pares.map(([h,a])=>[h,a]);
    const volta=pares.map(([h,a])=>[a,h]);
    liga.fixtures.push(ida, volta);
    liga.mataMata={confrontos:pares, resultados:[],
      historico:(mmAnterior&&mmAnterior.historico)||[],
      eliminadosQuartas:(mmAnterior&&mmAnterior.eliminadosQuartas)||null,
      semifinalistas:(mmAnterior&&mmAnterior.semifinalistas)||null,
      faseNome:Competicao.nomeFase(pares.length*2)};
    liga.fase='ko';
  },
  poisson(lambda){
    let L=Math.exp(-lambda), k=0, p=1;
    do{ k++; p*=Math.random(); }while(p>L);
    return k-1;
  },

  // quem sobe e quem cai, conforme o formato da divisão
  destinosDaTemporada(){
    const f=this.formato||Competicao.formatoDe(this.divisao||'A');
    if(f.tipo==='grupos'){
      // Série D: sobem os 4 semifinalistas + 2 da repescagem. Sem rebaixamento.
      const classGrupos=(this.grupos||[]).map(g=>Competicao.classificarGrupo(this.stats,g,i=>this.teams[i].nome));
      const avancaram=[]; classGrupos.forEach(c=>c.slice(0,f.avancamPorGrupo).forEach(s=>avancaram.push(s.i)));
      // sem mata-mata jogado ainda: usa os melhores classificados como aproximação
      const mm=this.mataMata;
      const sobem=(mm&&mm.sobem&&mm.sobem.length)? mm.sobem : avancaram.slice(0,f.acessos);
      return {sobem, caem:[], avancaram, semRebaixamento:true,
              campeao:(mm&&mm.campeao!=null)?mm.campeao:null,
              historico:(mm&&mm.historico)||[]};
    }
    const ordem=this.classificacao();
    return {sobem:ordem.slice(0,f.acessos).map(s=>s.i),
            caem:ordem.slice(-f.rebaixa).map(s=>s.i),
            avancaram:null, semRebaixamento:false};
  },
  nomeDivisaoAcima(){ return ({B:'Série A',C:'Série B',D:'Série C'})[this.divisao]||null; },
  nomeDivisaoAbaixo(){ return ({A:'Série B',B:'Série C',C:'Série D'})[this.divisao]||null; },

  /* ============================================================
     MODAL FLK — overlay estilizado (substitui prompt/confirm/alert)
     opts: {titulo, corpoHTML, campos:[{id,label,tipo,valor,placeholder}],
            botoes:[{txt,tipo,onClick(vals)}], onClose}
     Retorna nada; a interação é via callbacks dos botões.
     ============================================================ */
  /* ====================================================================
     MODAL FLK — padrão ÚNICO para tudo que é importante e pede resposta
     (§6.3 do roadmap). Nunca usar alert/confirm/prompt nativos.
     opts: {titulo, corpoHTML, campos[], botoes[{txt,tipo,onClick}], onClose,
            fechavel:false  → decisão obrigatória (sem ✕, sem clique fora, sem Esc)
            fila:true       → se já houver um modal aberto, entra na fila e abre depois}
     Botões: onClick que retorna true mantém o modal aberto. Se o onClick abrir
     OUTRO modal (ex.: aviso de erro), o fechamento do primeiro não apaga o novo.
     ==================================================================== */
  modalFLK(opts){
    const id='flkModal';
    let ov=document.getElementById(id);
    if(ov && opts.fila){ (this._filaModais||(this._filaModais=[])).push(opts); return {fechar(){}, el:null, enfileirado:true}; }
    if(!ov){ ov=document.createElement('div'); ov.id=id; document.body.appendChild(ov); }
    const tok=String(this._flkTok=(this._flkTok||0)+1); ov.dataset.tok=tok;
    const fechavel=opts.fechavel!==false;
    const campos=(opts.campos||[]).map(c=>`
      <div class="flkm-field">
        <label for="flkm_${c.id}">${c.label||''}</label>
        <input id="flkm_${c.id}" type="${c.tipo||'text'}" value="${c.valor!=null?c.valor:''}"
          placeholder="${c.placeholder||''}" ${c.tipo==='number'?'inputmode="decimal"':''}>
      </div>`).join('');
    const botoes=(opts.botoes||[{txt:'OK',tipo:'primary'}]).map((b,idx)=>
      `<button class="btn ${b.tipo||'sm'}" data-flkm-btn="${idx}">${b.txt}</button>`).join('');
    ov.innerHTML=`<div class="flkm-bg"><div class="flkm-box" role="dialog" aria-modal="true" aria-labelledby="flkmT${tok}">
      ${fechavel?'<button class="fmodal-close" data-flkm-x aria-label="Fechar">✕</button>':''}
      <div class="flkm-title" id="flkmT${tok}">${opts.titulo||''}</div>
      ${opts.corpoHTML?`<div class="flkm-body">${opts.corpoHTML}</div>`:''}
      ${campos?`<div class="flkm-fields">${campos}</div>`:''}
      <div class="flkm-foot">${botoes}</div>
    </div></div>`;
    const ativo=()=>ov.isConnected && ov.dataset.tok===tok;
    const fechar=()=>{
      if(!ativo()) return;                       // já foi substituído por outro modal
      ov.remove(); document.removeEventListener('keydown',onKey);
      if(opts.onClose) opts.onClose();
      this._proximoDaFila();
    };
    const onKey=(e)=>{ if(e.key==='Escape' && fechavel && ativo()) fechar(); };
    document.addEventListener('keydown',onKey);
    const lerVals=()=>{ const v={}; (opts.campos||[]).forEach(c=>{
      const el=document.getElementById('flkm_'+c.id); v[c.id]=el?el.value:''; }); return v; };
    const x=ov.querySelector('[data-flkm-x]'); if(x) x.onclick=fechar;
    ov.querySelector('.flkm-bg').onclick=(e)=>{ if(fechavel && e.target.classList.contains('flkm-bg')) fechar(); };
    (opts.botoes||[{txt:'OK',tipo:'primary'}]).forEach((b,idx)=>{
      const el=ov.querySelector(`[data-flkm-btn="${idx}"]`); if(!el) return;
      el.onclick=()=>{ const keep=b.onClick?b.onClick(lerVals()):false; if(!keep) fechar(); };
    });
    if(opts.aoAbrir) try{ opts.aoAbrir(ov, fechar); }catch(e){ console.error(e); }
    // foco: primeiro campo, senão o botão principal (último)
    const foco=ov.querySelector('.flkm-field input')||ov.querySelector('.flkm-foot .btn:last-child');
    if(foco) try{ foco.focus({preventScroll:true}); }catch(e){}
    return {fechar, el:ov};
  },
  // abre o próximo modal da fila (se nenhum estiver aberto); quando a fila esvazia, roda _aposFila
  _proximoDaFila(){
    if(document.getElementById('flkModal')) return;
    const prox=(this._filaModais||[]).shift();
    if(prox){ prox.fila=false; this.modalFLK(prox); return; }
    const cbs=this._aposFila||[]; this._aposFila=[];
    cbs.forEach(fn=>{ try{ fn(); }catch(e){ console.error(e); } });
  },
  // roda fn quando não houver mais nenhum modal aberto nem na fila
  aposFila(fn){
    if(!document.getElementById('flkModal') && !(this._filaModais||[]).length) return fn();
    (this._aposFila||(this._aposFila=[])).push(fn);
  },
  // corpo padrão dos modais (mesmo visual das boas-vindas):
  // {topo:{escudo, nome, sub}, fala, destaque:{rotulo,titulo,desc,tom}, kpis:[{rotulo,valor,cor,id}], lista:[{a,b}], aviso, extraHTML, classe}
  cartaoDecisao(c){
    const e=v=>v==null?'':v;
    return `<div class="mf ${e(c.classe)}">
      ${c.topo?`<div class="mf-top">${c.topo.escudo?`<span class="mf-esc">${c.topo.escudo}</span>`:''}
        <div><div class="mf-nome">${e(c.topo.nome)}</div>${c.topo.sub?`<div class="mf-sub">${c.topo.sub}</div>`:''}</div></div>`:''}
      ${c.fala?`<p class="mf-fala">${c.fala}</p>`:''}
      ${c.destaque?`<div class="mf-destaque ${c.destaque.tom||''}">${c.destaque.rotulo?`<small>${c.destaque.rotulo}</small>`:''}
        <b>${e(c.destaque.titulo)}</b>${c.destaque.desc?`<span>${c.destaque.desc}</span>`:''}</div>`:''}
      ${c.lista&&c.lista.length?`<div class="mf-lista">${c.lista.map(l=>`<div><b>${l.a}</b><span>${e(l.b)}</span></div>`).join('')}</div>`:''}
      ${c.kpis&&c.kpis.length?`<div class="mf-kpis n${c.kpis.length}">${c.kpis.map(k=>`<div class="mf-kpi"><small>${k.rotulo}</small><b${k.id?` id="${k.id}"`:''}${k.cor?` style="color:${k.cor}"`:''}>${k.valor}</b></div>`).join('')}</div>`:''}
      ${c.aviso?`<div class="mf-aviso">${c.aviso}</div>`:''}
      ${e(c.extraHTML)}
    </div>`;
  },

  // método dispara a compra real e só liga adFree após o servidor confirmar

  comprarRemoverAnuncios(){

      </div>`,
      botoes:[
        {txt:'Simular compra', tipo:'primary', onClick:()=>{
          // C2: a posse é concedida e VERIFICADA no servidor (não confiada ao cliente).
          if(this.convidado){
            this.avisoFLK('Faça login','A compra de remover anúncios fica na sua conta — entre para comprar (o convidado não tem posse na nuvem).','var(--loss)');

  // destinos (sobem/caem) de UMA liga qualquer (não só a do usuário)
  destinosDaLiga(liga){
    const f=liga.formato;
    if(f.tipo==='grupos'){
      const classG=(liga.grupos||[]).map(g=>Competicao.classificarGrupo(liga.stats,g,i=>this.teams[i].nome));
      const avancaram=[]; classG.forEach(c=>c.slice(0,f.avancamPorGrupo).forEach(s=>avancaram.push(s.i)));
      const mm=liga.mataMata;
      const sobem=(mm&&mm.sobem&&mm.sobem.length)?mm.sobem:avancaram.slice(0,f.acessos);
      return {sobem, caem:[], semRebaixamento:true};
    }
    const ord=[...liga.stats].sort((a,b)=>b.pts-a.pts||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp);
    return {sobem:ord.slice(0,f.acessos).map(s=>s.i),
            caem:ord.slice(-f.rebaixa).map(s=>s.i), semRebaixamento:false};
  },
  // PIPELINE: aplica acesso/rebaixamento em team.divisao para TODAS as divisões.
  // Regra de casamento: os que sobem da divisão de baixo trocam de lugar com os
  // que caem da de cima (mesma quantidade), preservando o tamanho de cada série.
  aplicarAcessoRebaixamento(){
    const ordemDiv=['A','B','C','D'];   // A no topo, D embaixo
    const mudancas=[];                  // {ti, de, para}
    for(let k=0;k<ordemDiv.length-1;k++){
      const cima=ordemDiv[k], baixo=ordemDiv[k+1];
      const ligaCima=this.ligas[cima], ligaBaixo=this.ligas[baixo];
      if(!ligaCima||!ligaBaixo) continue;
      const sobem=this.destinosDaLiga(ligaBaixo).sobem||[];
      const caem =this.destinosDaLiga(ligaCima).caem||[];
      const n=Math.min(sobem.length, caem.length);
      for(let m=0;m<n;m++){
        mudancas.push({ti:sobem[m], de:baixo, para:cima});
        mudancas.push({ti:caem[m],  de:cima,  para:baixo});
      }
    }
    // aplica (depois do loop, pra não bagunçar as leituras acima)
    mudancas.forEach(mc=>{ if(this.teams[mc.ti]) this.teams[mc.ti].divisao=mc.para; });
    return mudancas;
  },

  novaTemporadaCompleta(){
    this.registrarHistoricoClube();   // A2: fecha o retrato da temporada que terminou
    // A3: avalia a meta da diretoria ANTES de trocar de divisão (usa o destino da minha liga)
    const minhaLiga=this.ligas&&this.ligas[this.divisao];
    if(minhaLiga){ this._resultadoPrincipal=this.avaliarPrincipal(this.destinosDaLiga(minhaLiga)); }
    // C3: contabiliza carreira ANTES de virar (usa a temporada que terminou).
    // Título: fui campeão da minha liga (mata-mata) ou 1º nos pontos corridos.
    const car=this.garantirCarreira();
    // campeão: mata-mata (Série D) tem campeao explícito; pontos corridos = 1º colocado.
    let fuiCampeao=false;
    if(minhaLiga && minhaLiga.mataMata && minhaLiga.mataMata.campeao!=null){
      fuiCampeao = (minhaLiga.mataMata.campeao===this.myTeam);
    } else {
      const ordem=this.classificacao();
      fuiCampeao = !!(ordem && ordem.length && ordem[0].i===this.myTeam);
    }
    if(fuiCampeao) car.titulos++;
    this.temporada=(this.temporada||1)+1;
    // 1) aplica acesso/rebaixamento de TODAS as divisões (times trocam de série)
    const mudancas=this.aplicarAcessoRebaixamento();
    const meuMov=mudancas.find(m=>m.ti===this.myTeam);
    if(meuMov && meuMov.para<meuMov.de) car.acessos++;   // C3: subi de divisão = acesso
    // 2) gols/jogos de CARREIRA acumulam; os da TEMPORADA zeram; disciplina/energia idem
    this.teams.forEach(t=>t.players.forEach(p=>{
      p.energia=100; delete p.lesionado;
      p.golsTemp=0; p.jogosTemp=0; p.assistTemp=0;
      p.amarelos=0; delete p.suspenso; delete p._motivoSusp;
      // A1: notas são por temporada — zeram junto com gols/jogos
      p._somaNotas=0; p._qtdNotas=0; delete p._melhorNota; delete p._notaRodada;
      p._ovBase=Rating.overallGlobal(p);   // item 4: base da tendência de overall
    }));
    this.tempEncerrada=false;
    // 3) remonta a temporada inteira (todas as ligas) com as divisões já atualizadas
    this.montarTemporada();
    this.objetivos=Objetivos.novaTemporada(this.divisao);   // A3: novos objetivos p/ a divisão atual
    this.ultimato=null; this._reuniaoFeita=false;            // temporada nova, crise nova
    this._objetivosConcluidos=[];
    this.renderShell(); this.showTab('arena');
    this.salvarSupabase(true);
    const msg = meuMov
      ? (meuMov.para<meuMov.de ? `⬆️ Acesso! Agora você disputa a Série ${meuMov.para}.`
                               : `🔻 Rebaixado para a Série ${meuMov.para}.`)
      : `Temporada ${this.temporada} iniciada!`;
    // prêmio em dinheiro por acesso (sobe = divisão de letra menor)
    if(meuMov && meuMov.para<meuMov.de){ this.premiarAcesso(meuMov.para); }
    this.setStatus('saveStatus','ok',msg);
    if(meuMov) setTimeout(()=>this.avisoFLK(meuMov.para<meuMov.de?'⬆️ Acesso!':'🔻 Rebaixamento', msg, meuMov.para<meuMov.de?'var(--lemon)':'var(--loss)'),50);
    // C3: manda o score pro ranking (servidor roda plausibilidade e carimba suspeito).
    this.submeterRanking().catch(()=>{});
  },

  // reinício de temporada num clube específico (usado na DEMISSÃO)
  reiniciarTemporadaPara(ti){
    this.myTeam=ti; this.squadView=ti;
    this.teams.forEach(t=>t.players.forEach(p=>{
      p.energia=100; delete p.lesionado; p.golsTemp=0; p.jogosTemp=0; p.assistTemp=0;
      p.amarelos=0; delete p.suspenso; delete p._motivoSusp;
      p._somaNotas=0; p._qtdNotas=0; delete p._melhorNota; delete p._notaRodada;
      p._ovBase=Rating.overallGlobal(p);   // item 4: base da tendência de overall
    }));
    this.tempEncerrada=false;
    this.objetivos=Objetivos.novaTemporada(this.divisao);   // A3

  // esconde o jogo e reexibe o container de pré-jogo (para a tela de demissão)

  },

  /* ============ SAVE ============ */
  // snapshot serializável do estado do jogo
  snapshot(){

      jogadoresById[p.pid]={
        numero:p.numero, energia:Math.round(p.energia), gols:p.gols||0,

        golsTemp:p.golsTemp||0, jogosTemp:p.jogosTemp||0,

        somaNotas:p._somaNotas||0, qtdNotas:p._qtdNotas||0, melhorNota:p._melhorNota||0, notaRodada:p._notaRodada||0,
        moral:p.moral!=null?p.moral:65, semJogar:p._semJogar||0,   // A4
        notas5:p._notas5||[],                                      // v9: forma recente
        ovBase:p._ovBase!=null?p._ovBase:null,   // item 4
        attrs:p.attrs, attrsDec:p.attrsDec, mkt:p._mktFactor,
        ovIni:p._ovInicialNat, growth:p._growth, capAttr:p._capAttr,

      };
    }));
    const snap={
      versao:7, temporada:this.temporada||1,
      // --- Fase 1: metadados de SaveSchema (validados no load) ---
      schemaVersion:this.SCHEMA_VERSION, gameVersion:this.GAME_VERSION,
      createdAt:this._saveCreatedAt||new Date().toISOString(),
      updatedAt:new Date().toISOString(),
      rodada:this.rodada, dia:this.dia, myTeam:this.myTeam,
      stats:this.stats, resultados:this.resultados,
      histClube:this.histClube||[],   // A2: série histórica do meu clube
      objetivos:this.objetivos||null,  // A3: pacote de objetivos da temporada
      carreira:this.garantirCarreira(),// C3: contadores de carreira (títulos/acessos) p/ o ranking
      opcoes:this.garantirOpcoes(),    // Bloco B: preferências do jogador
      composicao:this.teams.map(t=>t.players.map(p=>p.pid)),  // quem está em cada time
      grupos:this.grupos||null, fase:this.fase||'pontos', divisao:this.divisao||null,
      mataMata:this.mataMata||null,
      jogadoresById,
      // finanças: saldo por time + extrato do meu time + controle de mês
      saldos:this.teams.map(t=>t.saldo||0),
      extrato:this.extrato||[], ultimoMesPago:this.ultimoMesPago||0,
      cfg:this.cfg, fixtures:this.fixtures,
      // --- v7: pipeline de divisões, ligas paralelas, confiança e empréstimo ---
      divisoesTime:this.teams.map(t=>t.divisao),   // divisão atual de cada time (pipeline)
      ligas:this.serializarLigas(),
      confianca:this.confianca!=null?this.confianca:this.CONF_INICIAL,
      demitido:!!this.demitido,
      histConf:this.histConf||[], ultimato:this.ultimato||null, reuniaoFeita:!!this._reuniaoFeita,   // reunião com a diretoria
      emprestimo:this.emprestimo||null,
      // --- v9: forma recente de cada time (5 últimas notas + V/E/D) ---
      formaTimes:this.teams.map(t=>({n:t._notas5||[], r:t._forma5||[]})),

  // checksum leve e determinístico (djb2) sobre o corpo do save, ignorando o
  // próprio campo checksum. Serve para detectar corrupção/adulteração acidental —
  // NÃO é segurança (o cliente pode recalcular). A validação de verdade é server-side.
  _checksum(obj){
    const str=JSON.stringify(obj, (k,v)=> k==='checksum'? undefined : v);
    let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; }
    return h.toString(16);
  },

  /* ===================== BLOCO C / C1 — ASSINATURA DO SAVE =====================
     Objetivo: barrar o cheat TRIVIAL (App.teams[x].saldo=999 no console + salvar).
     Não é inquebrável — o segredo mora no arquivo que entregamos. A meta é subir
     de "editável em 5s" para "chato o bastante" pro casual, e produzir o insumo
     `_saveAssinado` que o ranking (C3) usa pra decidir plausibilidade.
     Assinatura = HMAC-SHA256(estado) via Web Crypto, sobre o JSON canônico do
     snapshot. Guardada no ENVELOPE do save (fora do estado), não dentro dele. */
  SAVE_SECRET:'pfc_v1_a7Q2-nEon-Lemon-D2FF00-!prancheta',   // segredo embutido (ofuscação, não cofre)
  _cryptoOk(){ return typeof crypto!=='undefined' && crypto.subtle && typeof TextEncoder!=='undefined'; },
  // JSON canônico: chaves ordenadas, ignorando o checksum interno, pra a assinatura
  // ser estável independentemente da ordem de serialização.
  _canonical(obj){
    // só CICLO vira null (objeto que já está no caminho da recursão). Referência
    // repetida (ex.: fixtures/stats/grupos no topo E dentro de ligas) é serializada
    // por inteiro — senão a assinatura não sobrevive ao JSON (que duplica as cópias).
    const caminho=new WeakSet();
    const ord=(v)=>{
      if(v && typeof v==='object'){
        if(caminho.has(v)) return null;
        caminho.add(v);
        const r = Array.isArray(v) ? v.map(ord)
          : Object.keys(v).filter(k=>k!=='checksum').sort().reduce((o,k)=>{ o[k]=ord(v[k]); return o; },{});
        caminho.delete(v);
        return r;
      }
      return v;
    };
    return JSON.stringify(ord(obj));
  },
  async _hmac(str){
    if(!this._cryptoOk()) return null;
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw', enc.encode(this.SAVE_SECRET),
      {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
    const sig=await crypto.subtle.sign('HMAC', key, enc.encode(str));
    return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
  },
  // assina um snapshot: devolve a hex da HMAC (ou null se o ambiente não tiver crypto)
  async assinarSnapshot(snap){ return await this._hmac(this._canonical(snap)); },
  // confere: recomputa a HMAC e compara. Sem crypto ou sem sig => não-assinado.
  async conferirAssinatura(snap, sig){
    if(!sig || !this._cryptoOk()) return false;
    const calc=await this._hmac(this._canonical(snap));
    return !!calc && calc===sig;
  },
  // valida um snapshot ANTES de aplicá-lo. Retorna {ok, motivo}.
  // Trata o save como dado NÃO confiável (pode vir de import de arquivo).
  validateSnapshot(s){
    if(!s || typeof s!=='object') return {ok:false, motivo:'save vazio ou inválido'};
    // versão de schema: aceita a atual e as anteriores conhecidas (retrocompat)
    const sv=s.schemaVersion|| (s.versao? s.versao : 0);
    if(sv> this.SCHEMA_VERSION) return {ok:false, motivo:`save de versão ${sv} mais nova que o jogo (${this.SCHEMA_VERSION}) — atualize o jogo`};
    // campos estruturais mínimos
    if(!Array.isArray(this.teams)||!this.teams.length) return {ok:false, motivo:'nenhum time carregado do banco'};
    const nT=this.teams.length;
    if(s.myTeam==null || s.myTeam<0 || s.myTeam>=nT) return {ok:false, motivo:`myTeam inválido (${s.myTeam})`};
    if(s.rodada!=null && (s.rodada<0 || s.rodada>1000)) return {ok:false, motivo:`rodada fora de faixa (${s.rodada})`};
    if(s.temporada!=null && (s.temporada<1 || s.temporada>10000)) return {ok:false, motivo:`temporada fora de faixa (${s.temporada})`};
    if(s.confianca!=null && (s.confianca<0 || s.confianca>100)) return {ok:false, motivo:`confiança fora de 0..100 (${s.confianca})`};
    // composição: pids têm que existir no banco carregado; nenhum time pode ficar vazio
    if(s.composicao){
      if(!Array.isArray(s.composicao)) return {ok:false, motivo:'composição malformada'};
      const pidsBanco=new Set(); this.teams.forEach(t=>t.players.forEach(p=>pidsBanco.add(p.pid)));
      let vazios=0, desconhecidos=0;
      s.composicao.forEach(pids=>{
        if(!Array.isArray(pids) || pids.length===0){ vazios++; return; }
        pids.forEach(pid=>{ if(!pidsBanco.has(pid)) desconhecidos++; });
      });
      // base desatualizada: muitos pids sumiram → save incompatível
      if(desconhecidos>0 && desconhecidos> pidsBanco.size*0.5)
        return {ok:false, motivo:'base de jogadores mudou muito desde este save (pids ausentes)'};
      // time sem nenhum jogador → estado quebrado
      if(vazios>0) return {ok:false, motivo:`${vazios} time(s) ficariam sem jogadores`};
    }
    // atributos e energia dentro da faixa (amostra: se algo veio 0..100 estourado)
    if(s.jogadoresById){
      for(const pid in s.jogadoresById){
        const sp=s.jogadoresById[pid];
        if(sp.energia!=null && (sp.energia<0 || sp.energia>100)) return {ok:false, motivo:`energia inválida no pid ${pid}`};
        if(sp.attrs){ for(const k in sp.attrs){ const v=sp.attrs[k]; if(typeof v==='number' && (v<0||v>100)) return {ok:false, motivo:`atributo ${k} fora de 0..100 no pid ${pid}`}; } }
      }
    }
    // checksum: se presente, confere. Divergência = corrupção (aviso, não bloqueio fatal).
    if(s.checksum){
      const calc=this._checksum(s);
      if(calc!==s.checksum) return {ok:true, motivo:'checksum não confere (save possivelmente editado)', aviso:true};
    }
    return {ok:true};
  },
  // serializa this.ligas (competição de cada divisão) — só dados, sem referências cruzadas
  serializarLigas(){
    if(!this.ligas) return null;
    const out={};
    Object.keys(this.ligas).forEach(d=>{
      const lg=this.ligas[d];
      out[d]={div:lg.div, indices:lg.indices, rodada:lg.rodada,
        grupos:lg.grupos, fase:lg.fase, mataMata:lg.mataMata,
        fixtures:lg.fixtures, stats:lg.stats};
    });
    return out;
  },

  // aplica um snapshot sobre os times já carregados do banco.
  // Valida ANTES de aplicar (Fase 1): save quebrado é rejeitado e o caller
  // decide o fallback (novaTemporada). Retorna {ok, motivo}.
  aplicarSnapshot(s){
    const v=this.validateSnapshot(s);
    if(!v.ok){
      // não aplica nada — deixa o estado atual intacto e avisa
      if(this.avisoFLK) this.avisoFLK('Save incompatível',
        `Não foi possível restaurar este save: ${v.motivo}. Começando uma temporada nova.`,'var(--loss)');
      return {ok:false, motivo:v.motivo};
    }
    if(v.aviso && this.setStatus) this.setStatus('saveStatus','info', v.motivo);
    this._saveCreatedAt = s.createdAt || new Date().toISOString();
    this.temporada=s.temporada||1;
    this.rodada=s.rodada||0; this.dia=s.dia||1; this.myTeam=s.myTeam||0;
    // v7: restaura a DIVISÃO de cada time ANTES de qualquer remontagem (pipeline)
    if(s.divisoesTime) s.divisoesTime.forEach((d,ti)=>{ if(this.teams[ti]) this.teams[ti].divisao=d; });
    this.stats=s.stats; this.resultados=s.resultados||[];
    this.histClube=Array.isArray(s.histClube)?s.histClube:[];   // A2
    this.objetivos=(s.objetivos&&s.objetivos.div)?s.objetivos:null;   // A3 (garantirObjetivos recria se faltar)
    this.carreira=(s.carreira&&typeof s.carreira==='object')?{titulos:s.carreira.titulos||0, acessos:s.carreira.acessos||0}:{titulos:0, acessos:0};   // C3
    this.opcoes=(s.opcoes&&typeof s.opcoes==='object')?{...this.OPCOES_PADRAO,...s.opcoes}:{...this.OPCOES_PADRAO};   // Bloco B
    this.fixtures=s.fixtures||gerarFixtures(Math.max(this.teams.length,2));
    if(s.grupos!==undefined) this.grupos=s.grupos;
    if(s.fase) this.fase=s.fase;
    if(s.divisao){ this.divisao=s.divisao; this.formato=Competicao.formatoDe(s.divisao); }
    if(s.mataMata!==undefined) this.mataMata=s.mataMata;
    this.cfg=s.cfg||this.teams.map(t=>this.cfgInicial(t));
    // v7: confiança da diretoria + empréstimo
    this.confianca = (s.confianca!=null)? s.confianca : this.CONF_INICIAL;
    this.demitido = !!s.demitido;
    this.histConf = Array.isArray(s.histConf) ? s.histConf.filter(h=>h&&isFinite(+h.d)).slice(-12).map(h=>({t:+h.t||1,r:+h.r||0,d:+h.d,m:String(h.m||'').slice(0,80)})) : [];
    this.ultimato = (s.ultimato && isFinite(+s.ultimato.rodadaLimite)) ? {rodadaLimite:+s.ultimato.rodadaLimite, limiar:Math.max(0,Math.min(100,+s.ultimato.limiar||0)), temporada:+s.ultimato.temporada||1} : null;
    this._reuniaoFeita = !!s.reuniaoFeita;
    this.emprestimo = s.emprestimo||null;
    // finanças
    if(s.saldos) s.saldos.forEach((v,ti)=>{ if(this.teams[ti]) this.teams[ti].saldo=v; });
    this.extrato=s.extrato||[]; this.ultimoMesPago=s.ultimoMesPago||0;
    // v9: forma recente por time (save v8 não tem → listas vazias)
    this.teams.forEach((t,ti)=>{ const f=Array.isArray(s.formaTimes)?s.formaTimes[ti]:null;
      t._notas5=Forma.sanearNotas(f&&f.n); t._forma5=Forma.sanearResultados(f&&f.r); });

    if((s.versao||4)>=6 && s.composicao && s.jogadoresById){
      // --- v6: recompõe elencos por pid (transferências persistem) ---
      // pool = todos os jogadores carregados do banco, indexados por pid
      const pool={};
      this.teams.forEach(t=>t.players.forEach(p=>{ pool[p.pid]=p; }));
      // reaplica estado por pid
      for(const pid in s.jogadoresById){
        const p=pool[pid], sp=s.jogadoresById[pid]; if(!p) continue;
        p.numero=sp.numero; p.energia=sp.energia; p.gols=sp.gols; p.jogos=sp.jogos;
        p.golsTemp=sp.golsTemp||0; p.jogosTemp=sp.jogosTemp||0;
        p.assist=Math.max(0,+sp.assist||0); p.assistTemp=Math.max(0,+sp.assistTemp||0);   // v10 (v9 → 0)
        p.amarelos=sp.amarelos||0; p.expulsoes=sp.expulsoes||0;
        p._somaNotas=sp.somaNotas||0; p._qtdNotas=sp.qtdNotas||0;
        p.moral=(sp.moral!=null)?sp.moral:65; p._semJogar=sp.semJogar||0;   // A4
        p._ovBase=(sp.ovBase!=null)?sp.ovBase:null;   // item 4
        p._notas5=Forma.sanearNotas(sp.notas5);       // v9 (save v8 → lista vazia)
        if(sp.melhorNota) p._melhorNota=sp.melhorNota; if(sp.notaRodada) p._notaRodada=sp.notaRodada;
        if(sp.suspenso>0){ p.suspenso=sp.suspenso; p._motivoSusp=sp.motivoSusp||''; } else { delete p.suspenso; delete p._motivoSusp; }
        if(sp.lesionado) p.lesionado=sp.lesionado; else delete p.lesionado;
        if(sp.contratoMeses!=null) p.contratoMeses=sp.contratoMeses;
        p.aVenda=sp.aVenda||false;
        if(sp.attrs){
          p.attrs=sp.attrs;
          p.attrsDec=sp.attrsDec||Object.assign({},sp.attrs);
          p._ovInicialNat=sp.ovIni; p._growth=sp.growth; p._capAttr=sp.capAttr;
          p._mktFactor=sp.mkt!=null?sp.mkt:1.0;
          p._ancora=(sp.ovIni!=null && sp.capAttr!=null);
          if(sp.valor!=null) p.valor=sp.valor;
          Evolucao.recalcForca(p);
        }
      }
      // reconstrói cada elenco na ordem salva
      s.composicao.forEach((pids,ti)=>{
        const t=this.teams[ti]; if(!t) return;
        t.players=pids.map(pid=>pool[pid]).filter(Boolean);
      });
    } else {
      // --- retrocompat v4/v5: estado por posição dentro do time fixo ---
      if(s.jogadores) s.jogadores.forEach((arr,ti)=>{
        const t=this.teams[ti]; if(!t) return;
        const byNum={}; t.players.forEach(p=>byNum[p.numero]=p);
        arr.forEach(sp=>{ const p=byNum[sp.numero]; if(p){
          p.energia=sp.energia; p.gols=sp.gols; p.jogos=sp.jogos;
          if(sp.lesionado) p.lesionado=sp.lesionado; else delete p.lesionado;
          if(sp.attrs){
            p.attrs=sp.attrs;
            p.attrsDec=sp.attrsDec||Object.assign({},sp.attrs);
            p._ovInicialNat=sp.ovIni; p._growth=sp.growth; p._capAttr=sp.capAttr;
            p._mktFactor=sp.mkt!=null?sp.mkt:1.0;
            p._ancora=(sp.ovIni!=null && sp.capAttr!=null);
            if(sp.valor!=null) p.valor=sp.valor;
            Evolucao.recalcForca(p);
          }
        }});
      });
      if((s.versao||4)<5) this.teams.forEach(t=>t.players.forEach(p=>Evolucao.inicializar(p)));
    }
    // v7: restaura as ligas paralelas (competição de cada divisão)
    this.restaurarLigas(s);
    this.squadView=0; this.renderShell();
    return {ok:true};
  },
  // reconstrói this.ligas a partir do save (ou remonta do zero em saves antigos)
  restaurarLigas(s){
    if(s.ligas){
      this.ligas={};
      Object.keys(s.ligas).forEach(d=>{
        const lg=s.ligas[d];
        this.ligas[d]={div:lg.div, formato:Competicao.formatoDe(d),
          indices:lg.indices||this.indicesDaDivisao(d), rodada:lg.rodada||0,
          grupos:lg.grupos||null, fase:lg.fase||'pontos', mataMata:lg.mataMata||null,
          fixtures:lg.fixtures||[], stats:lg.stats||[]};
      });
      // religa a liga ativa (divisão do usuário) aos campos do motor ao vivo,
      // usando as MESMAS referências salvas (fixtures/stats/grupos/mataMata)
      const ativa=this.ligas[this.divisao];
      if(ativa){
        this._ligaAtiva=ativa;
        this.grupos=ativa.grupos; this.fase=ativa.fase; this.mataMata=ativa.mataMata;
        this.fixtures=ativa.fixtures;
        // this.stats indexado por índice GLOBAL; aponta p/ as linhas de cada liga
        this.stats=this.teams.map((t,i)=>({i,pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0}));
        Object.values(this.ligas).forEach(lg=>lg.stats.forEach(st=>{ this.stats[st.i]=st; }));
      }
    } else {
      // save pré-v7: só a divisão do usuário existia — remonta as outras divisões
      this.montarTemporada();
    }
  },

  // salva no Supabase (auto após rodada + botão manual)
  // gzip nativo do navegador (CompressionStream) + base64 — sem biblioteca externa
  podeComprimir(){ return typeof CompressionStream==='function' && typeof DecompressionStream==='function'; },
  async comprimir(txt){
    const buf=await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    const b=new Uint8Array(buf); let bin=''; const C=0x8000;
    for(let i=0;i<b.length;i+=C) bin+=String.fromCharCode.apply(null,b.subarray(i,i+C));
    return btoa(bin);
  },
  async descomprimir(b64){
    const bin=atob(b64), b=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
    return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  },
  async salvarSupabase(silencioso){
    const meta={temporada:this.temporada||1, rodada:this.rodada, dia:this.dia, myTeam:this.myTeam};
    const okHud=()=>{ const hud=document.getElementById('saveHint');
      if(hud){ hud.textContent='✓ salvo'; setTimeout(()=>{if(hud)hud.textContent='';},2000); } };
    // convidado: salva neste dispositivo
    if(this.convidado){
      try{
        const estado=this.snapshot();
        const sig=await this.assinarSnapshot(estado);   // C1: assina o corpo do save
        // o snapshot tem ~8 MB (atributos de ~3 mil jogadores) e a cota do
        // localStorage é ~5 M caracteres → grava COMPRIMIDO (gzip nativo + base64)
        const env={clube:this.teams[this.myTeam]?.nome||'Carreira', ...meta, sig, updated_at:new Date().toISOString()};
        if(this.podeComprimir()) env.estadoZ=await this.comprimir(JSON.stringify(estado));
        else env.estado=estado;
        localStorage.setItem('flk_save_'+(this.slotAtual||1), JSON.stringify(env));
        this._falhaSaveAvisada=false;
        if(!silencioso) this.setStatus('saveStatus','ok','Salvo neste dispositivo.');
        okHud();
      }catch(e){
        if(!silencioso) this.setStatus('saveStatus','err','Falha ao salvar: '+e.message);
        // nunca falhar calado: avisa uma vez por sessão, mesmo no auto-save
        if(!this._falhaSaveAvisada){ this._falhaSaveAvisada=true;
          this.avisoFLK('Não deu pra salvar', 'O jogo não conseguiu salvar neste aparelho ('+this.esc(e.message)+'). Crie uma conta para salvar na nuvem, ou libere espaço do navegador.', 'var(--loss)', {fila:true}); }
      }
      return;
    }
    if(!this.sb || !this.userId){ if(!silencioso) this.setStatus('saveStatus','err','Você não está logado.'); return; }
    try{
      const estado=this.snapshot();
      const sig=await this.assinarSnapshot(estado);   // C1: assina o corpo do save
      // a coluna `estado` (jsonb) é o único container do save no banco: guardamos a
      // assinatura em _sig, FORA do objeto assinado (o _canonical ignora chaves extras
      // do envelope só se estiverem no topo do que foi assinado — por isso assinamos
      // `estado` ANTES de anexar _sig).
      const envelope={...estado, _sig:sig};
      const row={ user_id:this.userId, slot:String(this.slotAtual||1),
        temporada:meta.temporada, rodada:meta.rodada, dia:meta.dia, my_team:meta.myTeam,
        estado:envelope, updated_at:new Date().toISOString() };
      const {error}=await this.sb.from('game_save').upsert(row,{onConflict:'user_id,slot'});
      if(error) throw error;
      if(!silencioso) this.setStatus('saveStatus','ok',`Salvo (rodada ${this.rodada}).`);
      okHud();
    }catch(e){ if(!silencioso) this.setStatus('saveStatus','err','Falha ao salvar: '+e.message); }
  },

  async carregarSupabase(){
    // O load oficial é por slot (game_save por user_id+slot), feito no menu inicial.
    // Mantido só como atalho informativo na aba Dados.
    this.setStatus('saveStatus','info','Use o menu inicial (Carregar Jogo) para restaurar um slot salvo.');
  },

  // export/import JSON (backup local)
  exportSave(){
    const blob=new Blob([JSON.stringify(this.snapshot())],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`flk-arena-t${this.temporada||1}-r${this.rodada}.json`; a.click(); URL.revokeObjectURL(a.href);
    this.setStatus('saveStatus','ok',`Backup exportado (rodada ${this.rodada}).`);
  },
  importSave(o){
    const r=this.aplicarSnapshot(o)||{ok:false,motivo:'desconhecido'};
    if(r.ok) this.setStatus('saveStatus','ok',`Backup carregado (rodada ${this.rodada}).`);
    else this.setStatus('saveStatus','err','Save inválido: '+r.motivo);
  },
};

/* navegação (uma vez): menu lateral, barra inferior, folha "Mais" */
['tabs','bottomBar','maisSheet'].forEach(id=>{ const n=document.getElementById(id); if(n) n.addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]'); if(b){ App.showTab(b.dataset.tab); window.scrollTo(0,0); return; }
  if(e.target.closest('[data-mais]')) document.getElementById('maisSheet').classList.remove('hidden');
  if(e.target.closest('[data-mais-cfg]')){ document.getElementById('maisSheet').classList.add('hidden'); App.abrirConfig(); }
  if(e.target.closest('[data-mais-menu]')){ document.getElementById('maisSheet').classList.add('hidden'); App.irMenuPrincipal(); }
  if(e.target.id==='maisSheet') e.target.classList.add('hidden');
}); });
(function(){
  const g=document.getElementById('btnConfig'); if(g) g.onclick=()=>App.abrirConfig();
  const m=document.getElementById('btnMenuPrincipal'); if(m) m.onclick=()=>App.irMenuPrincipal();
  const grid=document.getElementById('appGrid'), r=document.getElementById('btnRecolher');
  const K='prancheta_menu_recolhido';
  try{ if(localStorage.getItem(K)==='1') grid.classList.add('side-min'); }catch(e){}
  if(r) r.onclick=()=>{ const on=grid.classList.toggle('side-min'); try{ localStorage.setItem(K,on?'1':'0'); }catch(e){} };
})();

App.boot();
</script>
