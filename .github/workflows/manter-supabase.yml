# Mantém o projeto do Supabase acordado.
# O plano gratuito PAUSA o projeto depois de 7 dias sem nenhuma requisição (já aconteceu
# em 10/2026 e de novo em 11/2026: login, saves na nuvem e ranking pararam).
# Este agendamento faz uma leitura leve no banco TODO DIA, de graça, pelo GitHub Actions.
# Era a cada 3 dias, mas o agendamento do GitHub não é garantido (execuções atrasam ou
# são puladas sem aviso) — duas puladas seguidas já passavam dos 7 dias. Diário, em dois
# horários, dá margem de sobra. Há também um 2º agendador fora do GitHub (cron-job.org)
# batendo no mesmo endereço — ver docs/manter_supabase.md.
# Usa a mesma chave pública do jogo (só lê; nada é gravado).
# Pra rodar na mão: Actions → "Manter Supabase acordado" → Run workflow.
name: Manter Supabase acordado

on:
  schedule:
    - cron: '17 12 * * *'   # todo dia, 09:17 de Brasília
    - cron: '47 0 * * *'    # todo dia, 21:47 de Brasília (2ª chance se a 1ª for pulada)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leitura leve no banco
        env:
          SUP_URL: https://leysofvftpgocigqqgzi.supabase.co
          SUP_KEY: sb_publishable_i5CqcTOw2U9amGelpwcuxg_d-nYXdxu
        run: |
          for tentativa in 1 2 3; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "apikey: $SUP_KEY" -H "Authorization: Bearer $SUP_KEY" \
              "$SUP_URL/rest/v1/team?select=id&limit=1")
            echo "tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase não respondeu 200 — o projeto pode estar pausado. Retome em supabase.com/dashboard."
          exit 1
